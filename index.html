let stoolFlags={mucus:false,blood:false};

document.addEventListener('click', async (ev)=>{
  const el=ev.target.closest('[data-act]'); if (!el) return;
  const a=el.dataset.act, iso=el.dataset.date||S.cursor||localToday();
  const d=S.days[iso]||{};

  if (a==='signin'){ return doSignIn(); }
  if (a==='signout'){ await signOut(auth); location.reload(); return; }
  if (a==='go'){ S.tab=el.dataset.tab; render(); return; }
  if (a==='goday'){ S.cursor=el.dataset.date; S.tab='day'; render(); return; }
  if (a==='openday'){ S.cursor=el.dataset.date; S.tab='day'; render(); return; }
  if (a==='dismiss-banner'){ S.banner=null; render(); return; }
  if (a==='swapcard'){ const wasEve=isEvening(); S.forceCard=wasEve?'morning':'evening';
    if ((S.forceCard==='evening')===(new Date().getHours()>=(S.settings.handoverHour??16))) S.forceCard=null;
    render(); return; }
  if (a==='jump'){ const k=el.dataset.k;
    if (k==='bowl'){ S.forceCard='evening'; S.cursor=toIso(toDay(localToday())-1); S.tab='day'; }
    else { S.forceCard='morning'; }
    render(); return; }
  if (a==='dayshift'){ const n=Number(el.dataset.n);
    const next=toIso(toDay(S.cursor)+n);
    if (toDay(next)>=toDay(S.settings.startDate) && toDay(next)<=toDay(localToday())) S.cursor=next;
    render(); return; }
  if (a==='range'){ S.range=Number(el.dataset.r); render(); return; }
  if (a==='theme'){ saveSettings({theme:el.dataset.t}); applyTheme(); return; }

  if (a==='bcs'){ const v=Number(el.dataset.v); saveDay(iso,{bcs: d.bcs===v?null:v}); return; }
  if (a==='event'){ const id=el.dataset.id; const cur=d.events||[];
    saveDay(iso,{events: cur.includes(id)?cur.filter(x=>x!==id):[...cur,id]}); return; }

  if (a==='openstool'){ S.adding=iso; stoolFlags={mucus:false,blood:false}; render(); return; }
  if (a==='cancelstool'){ S.adding=null; render(); return; }
  if (a==='tog-mucus'){ stoolFlags.mucus=!stoolFlags.mucus; el.classList.toggle('on'); return; }
  if (a==='tog-blood'){ stoolFlags.blood=!stoolFlags.blood; el.classList.toggle('on'); return; }
  if (a==='addstool'){
    const t=($('#st-t')||{}).value||nowHHMM();
    const st=[...(d.stools||[]), {id:'s'+Date.now().toString(36), time:t, bristol:Number(el.dataset.b), mucus:stoolFlags.mucus, blood:stoolFlags.blood}];
    S.adding=null; saveDay(iso,{stools:st}); return; }
  if (a==='delstool'){ saveDay(iso,{stools:(d.stools||[]).filter(x=>x.id!==el.dataset.id)}); return; }
  if (a==='swapattr'){
    const to=el.dataset.to||'';
    saveDay(iso,{stools:(d.stools||[]).map(x=>x.id===el.dataset.id?{...x, mealOverride: to||undefined}:x)}); return; }

  if (a==='pick'){
    const r=el.dataset.id, meal=d.meal||{};
    if (meal.recipe===r && !meal.fedAt){ saveDay(iso,{meal:null}); return; }
    const b=bowlFor(iso,r,S.settings,S.changes,{egg:!!meal.egg,broth:!!meal.broth});
    saveDay(iso,{meal:{...meal, recipe:r, darfPlanned:b.darfG, oilMl:b.oilMl, fibreG:b.fibreG}});
    return; }
  if (a==='pickday'){
    const r=el.dataset.id, meal=d.meal||{};
    if (meal.recipe===r){ saveDay(iso,{meal:null}); return; }
    const b=bowlFor(iso,r,S.settings,S.changes,{egg:!!meal.egg,broth:!!meal.broth});
    saveDay(iso,{meal:{...meal, recipe:r, darfPlanned:b.darfG, darfFed:meal.darfFed??b.darfG, oilMl:b.oilMl, fibreG:b.fibreG, fedAt:meal.fedAt||'19:00'}});
    return; }
  if (a==='extra'){
    const k=el.dataset.k, meal=d.meal||{};
    const next={...meal, [k]:!meal[k]};
    if (meal.recipe){ const b=bowlFor(iso,meal.recipe,S.settings,S.changes,{egg:!!next.egg,broth:!!next.broth});
      next.darfPlanned=b.darfG; if (!meal.fedAt) next.darfFed=undefined; }
    saveDay(iso,{meal:next}); return; }
  if (a==='fed'){
    const meal=d.meal||{}; const r=meal.recipe||el.dataset.r; if (!r) return;
    const b=bowlFor(iso,r,S.settings,S.changes,{egg:!!meal.egg,broth:!!meal.broth});
    saveDay(iso,{meal:{...meal, recipe:r, fedAt:nowHHMM(), darfPlanned:b.darfG, darfFed:b.darfG, oilMl:b.oilMl, fibreG:b.fibreG}});
    return; }
  if (a==='unfeed'){ const meal={...(d.meal||{})}; delete meal.fedAt; saveDay(iso,{meal}); return; }
  if (a==='bowl'){ const meal=d.meal||{}; if (!meal.fedAt && S.tab==='today') return;
    saveDay(iso,{meal:{...meal, bowl: meal.bowl===el.dataset.k?null:el.dataset.k}}); return; }

  if (a==='applyadv'){
    const adv=weeklyAdvice(); if (!adv.applied) return;
    await saveChange({date:localToday(), deltaG:adv.adjustmentG, source:'rule', reason:adv.reason});
    S.banner={kind:'good',title:'Applied',text:`DARF moves ${adv.adjustmentG>0?'up':'down'} ${Math.abs(adv.adjustmentG)} g from tonight. The rule will not fire again until next Monday.`};
    render(); return; }
  if (a==='refuseadv'){
    await saveChange({date:localToday(), deltaG:0, source:'refused', refused:true, reason:'Refused: '+weeklyAdvice().reason});
    S.banner={kind:'plain',title:'Refused',text:'Nothing changed. The rule will look again next Monday.'};
    render(); return; }
  if (a==='applyfibre'){
    const g=Number(el.dataset.g);
    saveSettings({fibreSchedule:[...(S.settings.fibreSchedule||[]), {from:localToday(), g}]});
    S.banner={kind:'good',title:`Pro-Fibre now ${g} g`,text:'The streak restarts from tomorrow.'};
    render(); return; }
  if (a==='dismissfibre'){ S.banner={kind:'plain',title:'Left as it is',text:'It will come back tomorrow.'}; render(); return; }
  if (a==='setfibre'){
    const g=Number(el.dataset.g);
    if (g>S.settings.fibreRestG && !confirm(`${g} g is above the ${S.settings.fibreRestG} g ceiling the audit set. Stool that does not settle at ${S.settings.fibreRestG} g is a clinical question rather than a dose question. Set it anyway?`)) return;
    saveSettings({fibreSchedule:[...(S.settings.fibreSchedule||[]), {from:localToday(), g}]}); return; }
  if (a==='addregime'){ saveSettings({regimeChanges:[...(S.settings.regimeChanges||[]), localToday()]}); return; }
  if (a==='delregime'){ saveSettings({regimeChanges:(S.settings.regimeChanges||[]).filter(x=>x!==el.dataset.d)}); return; }
  if (a==='delchange'){ removeChange(el.dataset.id); return; }

  if (a==='exportmonth'){ exportMonthCsv(); return; }
  if (a==='exportmd'){ exportMonthMd(); return; }
  if (a==='exportall'){ exportAll(); return; }
  if (a==='selftest'){ selfTest(); return; }
  if (a==='erase'){
    if (!confirm('Delete every day and every recorded change? Settings are kept. Export first.')) return;
    if (prompt('Type ERASE to confirm')!=='ERASE') return;
    for (const k of Object.keys(S.days)) await deleteDoc(doc(db,'days',k));
    for (const c of S.changes) await deleteDoc(doc(db,'changes',c.id));
    S.banner={kind:'plain',title:'Erased',text:'Settings were kept.'}; render(); return; }
});

const tdeb=new Map();
document.addEventListener('input', (ev)=>{
  const el=ev.target.closest('[data-act]'); if (!el) return;
  const a=el.dataset.act;
  if (a==='import'){ if (el.files&&el.files[0]) importJson(el.files[0]); return; }
  const iso=el.dataset.date||S.cursor||localToday();
  const key=a+'|'+iso+'|'+(el.dataset.k||'');
  clearTimeout(tdeb.get(key));
  tdeb.set(key, setTimeout(()=>{
    tdeb.delete(key);
    const v=el.value;
    if (a==='weight'){ const n=parseFloat(v);
      if (v==='') return saveDay(iso,{weight:null});
      if (!Number.isFinite(n)||n<10||n>30) return;
      const m=windowMean(weightsList().filter(w=>toDay(w.date)<toDay(iso)),toDay(iso)-1,7);
      if (m.mean && Math.abs(n-m.mean)/m.mean>0.05 &&
          !confirm(`${n} kg is ${((n-m.mean)/m.mean*100).toFixed(0)}% from the recent average of ${m.mean.toFixed(2)} kg. Keep it?`)) { el.value=''; return; }
      saveDay(iso,{weight:n}); return; }
    if (a==='walkMin'||a==='activeMin'||a==='treats'){ saveDay(iso,{[a]: v===''?null:Math.round(Number(v))}); return; }
    if (a==='walkKm'){ saveDay(iso,{walkKm: v===''?null:Number(v)}); return; }
    if (a==='notes'){ saveDay(iso,{notes:v}); return; }
    if (a==='darfFed'){ const meal=S.days[iso]?.meal||{}; saveDay(iso,{meal:{...meal, darfFed: v===''?null:Math.round(Number(v))}}); return; }
    if (a==='setnum'){ const n=Number(v); if (Number.isFinite(n)) saveSettings({[el.dataset.k]:n}); return; }
  }, 700));
});

document.addEventListener('change', (ev)=>{
  const el=ev.target.closest('[data-act]');
  if (el && el.dataset.act==='import' && el.files && el.files[0]) importJson(el.files[0]);
});

$('#tabbar').addEventListener('click', (ev)=>{
  const b=ev.target.closest('button[data-tab]'); if (!b) return;
  S.tab=b.dataset.tab; S.forceCard=null; if (S.tab==='day'&&!S.cursor) S.cursor=localToday();
  render();
});

/* =====================================================================
   AUTH AND BOOT
   ===================================================================== */
async function doSignIn(){
  const em=$('#em').value.trim(), pw=$('#pw').value;
  const err=$('#gate-err'); err.classList.add('hide');
  if (!em||!pw){ err.textContent='Enter both an email address and a password.'; err.classList.remove('hide'); return; }
  $('#signin').disabled=true; $('#signin').innerHTML='<span class="spin"></span>';
  try { await signInWithEmailAndPassword(auth, em, pw); }
  catch(e){
    const map={
      'auth/invalid-credential':'That email and password do not match an account.',
      'auth/wrong-password':'That password is not right.',
      'auth/user-not-found':'No account with that email address.',
      'auth/invalid-email':'That does not look like an email address.',
      'auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.',
      'auth/network-request-failed':'No connection. A first sign-in on a device needs one.'
    };
    err.textContent = map[e.code] || ('Sign-in failed: '+(e.message||e.code));
    err.classList.remove('hide');
  }
  finally { $('#signin').disabled=false; $('#signin').textContent='Sign in'; }
}
$('#signin').addEventListener('click', doSignIn);
$('#pw').addEventListener('keydown', e=>{ if (e.key==='Enter') doSignIn(); });

onAuthStateChanged(auth, (u)=>{
  S.user=u;
  $('#gate').classList.toggle('hide', !!u);
  $('#app').classList.toggle('hide', !u);
  if (u && !S.subscribed){ S.subscribed=true; S.cursor=localToday(); subscribe(); }
  if (u) render();
});

window.addEventListener('online', ()=>setStatus('Synced'));
window.addEventListener('offline', ()=>setStatus('Offline, queued','warn'));

if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
