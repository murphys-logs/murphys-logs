<html lang="en-GB">

<style>
:root{
  color-scheme:dark;
  --paper:#000; --surface:#161616; --surface-2:#222;
  --ink:#d6d6d6; --ink-2:#b8b8b8; --ink-3:#aaa;
  --rule:#454545; --rule-2:#737373;
  --accent:#ddd; --accent-ink:#eee; --accent-soft:#252525;
  --good:#78c886; --good-soft:#16251a;
  --watch:#e7b45a; --watch-soft:#2a2316;
  --alert:#ed9389; --alert-soft:#2d1a18; --on-accent:#080808;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --compact:"SF Compact Text","SF Compact",var(--sans);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --sl:max(var(--s4),env(safe-area-inset-left)); --sr:max(var(--s4),env(safe-area-inset-right));
  --tabh:4rem;
}
:root[data-theme="light"]{
  color-scheme:light;
  --paper:#eee; --surface:#fff; --surface-2:#f3f3f3;
  --ink:#171717; --ink-2:#414141; --ink-3:#595959;
  --rule:#bbb; --rule-2:#777;
  --accent:#333; --accent-ink:#222; --accent-soft:#e6e6e6;
  --good:#276e30; --good-soft:#e4f1e4;
  --watch:#805109; --watch-soft:#f6eddc;
  --alert:#9f3027; --alert-soft:#f7e4e1; --on-accent:#fff;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font:-apple-system-body}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:1rem; line-height:1.5;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:contain;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0;text-align:left;min-width:44px;min-height:44px;overflow-wrap:anywhere}
input,select,.btn{min-height:44px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.hide{display:none !important}
.num,.row .v,.field input,.scale button,.bristol b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.g{--tone:var(--good)} .a{--tone:var(--watch)} .r{--tone:var(--alert)}

/* shell */
#gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:var(--s5)}
.gate-card{width:100%;max-width:380px}
.gate-card h1{font-size:1.625rem;font-weight:650;letter-spacing:-.02em;margin:0 0 4px}
.gate-card p.sub{color:var(--ink-2);font-size:.9rem;margin:0 0 26px}

#app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule);
  padding:calc(env(safe-area-inset-top) + var(--s3)) var(--sr) var(--s2) var(--sl);
  display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);
}
.topbar .who{font-size:.75rem;font-weight:600;letter-spacing:.14em}
.topbar .state{font-size:.75rem;color:var(--ink-3)}
.topbar .state.warn{color:var(--watch)}
.topbar .state.bad{color:var(--alert)}

main{flex:1;padding:var(--s4) var(--sr) calc(var(--tabh) + env(safe-area-inset-bottom) + var(--s6)) var(--sl);max-width:42rem;width:100%;margin:0 auto}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(max(20%,8ch),1fr));font:.75rem/1.5 var(--compact);
  background:var(--surface);border-top:1px solid var(--rule-2);
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.tabbar button{
  position:relative;text-align:center;padding:var(--s2) 2px;font:inherit;color:var(--ink-3);white-space:nowrap;
  min-height:44px;min-width:0;
}
.tabbar button.on{color:var(--accent-ink);font-weight:600;box-shadow:inset 0 2px 0 var(--accent)}
.tabbar svg{display:block;width:22px;height:22px;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar .dotmark{position:absolute;top:7px;left:calc(50% + 13px);width:6px;height:6px;border-radius:50%;background:var(--alert)}

/* pieces */
.moment{
  display:inline-block;font-size:.6875rem;font-weight:700;
  letter-spacing:.17em;text-transform:uppercase;color:var(--on-accent);
  background:var(--accent);padding:var(--s1) var(--s2);border-radius:2px;margin-bottom:var(--s3);
}
h2.screen{font-size:1.3125rem;font-weight:650;letter-spacing:-.015em;margin:0 0 var(--s4);line-height:1.2}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;margin-bottom:var(--s4);overflow:hidden}
.sec{padding:var(--s4)}
.card>.sec+.sec{border-top:1px solid var(--rule)}
.lab{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 var(--s3)}
.sec>.lab:not(:first-child){margin-top:var(--s4)}
summary{min-height:44px;cursor:pointer;font-weight:600;list-style-position:inside;overflow-wrap:anywhere}
details[open]>summary{margin-bottom:var(--s3)}
details.card>summary{padding:var(--s4);margin:0;outline-offset:-4px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.row:last-child{margin-bottom:0}
.row .k{color:var(--ink-2);font-size:.875rem;min-width:0;overflow-wrap:anywhere}
.row .v{font-size:.875rem;font-weight:500}
.sub{font-size:.75rem;color:var(--ink-3);margin:3px 0 0;font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:block;width:100%;text-align:center;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:.9375rem;padding:var(--s3);border-radius:8px}
.btn[disabled]{opacity:.4}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--rule-2)}
.btn.sm{font-size:.875rem;padding:var(--s2)}
.btn.danger{background:var(--alert);color:var(--on-accent)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s3)}
[data-form]+.chip{margin-top:var(--s3)}
.link{color:var(--accent-ink);font-weight:500;font-size:.8125rem}

/* inputs */
.field{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);border-bottom:1px solid var(--rule-2);padding:var(--s2) 0}
.field label{flex:1;font-size:.8125rem;color:var(--ink-2)}
.field input{
  border:0;background:transparent;text-align:right;
  font-size:1.0625rem;font-weight:600;width:7rem;max-width:100%;min-width:0;padding:var(--s2);
}
.tin{width:100%;max-width:100%;border:1px solid var(--rule-2);border-radius:8px;padding:var(--s3);background:var(--surface);font-size:1rem}
textarea.tin{min-height:64px;resize:vertical;font-family:var(--sans)}
.inline-lab{display:block;font-size:.8125rem;color:var(--ink-2);margin:0 0 var(--s2)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chips,.meal-flags,.seg{margin-block:var(--s3)}
.meal-flags{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.chip{font-size:.8125rem;padding:var(--s2) var(--s3);border:1px solid var(--rule-2);border-radius:8px;color:var(--ink-2);background:transparent}
.chip.on,.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip.on.ev{background:var(--alert);border-color:var(--alert)}

/* segmented */
.seg{display:flex;border:1px solid var(--rule-2);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-width:0;text-align:center;padding:var(--s2) var(--s1);font-size:.8125rem;color:var(--ink-2);border-right:1px solid var(--rule-2)}
.seg button:last-child{border-right:0}

/* bristol + bcs scales */
.bristol,.scale{display:grid;grid-template-columns:repeat(var(--steps,4),minmax(0,1fr));gap:var(--s2);margin-block:var(--s3)}
:is(.bristol,.scale) button{text-align:center;border:1px solid var(--rule-2);border-radius:6px;background:var(--surface)}
.bristol button{padding:9px 1px 7px;line-height:1.1}
.bristol b{display:block;font-size:.9375rem;font-weight:600;color:var(--tone)}
.bristol i{display:block;font-style:normal;font-size:.625rem;color:var(--ink-3);margin-top:3px}

.scale button{
  padding:11px 0;font-size:.8125rem;font-weight:600;color:var(--tone);
}
.bristol button.on b,.bristol button.on i,.scale button.on{color:var(--on-accent)}
:is(.bristol,.scale) .on{background:var(--tone);border-color:var(--tone)}

/* stool entries */
.stool{display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s2) 0;border-bottom:1px solid var(--rule)}
.stool:last-of-type{border-bottom:0}
.dot{width:9px;height:9px;border-radius:2px;flex:none;margin-top:5px;background:var(--tone)}
.stool .body{flex:1;min-width:0}
.stool .t{font-size:.875rem}
.stool .attr{display:block;font-size:.75rem;color:var(--ink-3);margin-top:2px}

/* callouts */
.note{border-radius:7px;padding:11px 13px;font-size:.8125rem;line-height:1.5;margin-bottom:10px;color:var(--ink-2)}
.note b{display:block;color:var(--ink);font-weight:650;font-size:.875rem;margin-bottom:3px}
.note.hold{background:var(--accent-soft);border-left:3px solid var(--accent)}
.note.good{background:var(--good-soft);border-left:3px solid var(--good)}
.note.warn{background:var(--watch-soft);border-left:3px solid var(--watch)}
.note.bad{background:var(--alert-soft);border-left:3px solid var(--alert)}
.note.plain{background:var(--surface-2);border-left:3px solid var(--rule-2)}

/* streak */
.streak{display:flex;gap:4px}
.streak span{flex:1;min-height:26px;border-radius:4px;border:1px solid var(--rule-2);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--ink-3);background:var(--surface)}
.streak span.clean{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.streak span.broken{background:var(--alert);border-color:var(--alert);color:var(--on-accent)}
.streak span.pause{background:var(--surface-2)}

/* gauge */
.gauge{height:9px;border-radius:5px;background:var(--surface-2);border:1px solid var(--rule-2);position:relative;overflow:hidden;margin:8px 0 5px}
.gauge .mid{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--rule-2)}
.gauge .fill{position:absolute;top:0;bottom:0;background:var(--accent)}

/* charts */
svg.chart{display:block;width:100%;height:auto}
.legend{font-size:.75rem;color:var(--ink-3);margin-top:5px}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.8125rem}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--rule);white-space:nowrap}
thead th{font-size:.6875rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2)}
td{color:var(--tone,var(--ink-2));font-variant-numeric:tabular-nums}
tr.tap{cursor:pointer}

/* date bar */
.datebar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--rule);border-radius:7px;padding:8px 10px;margin-bottom:12px}
.datebar button{font-size:1.0625rem;color:var(--ink-2);padding:2px 12px}
.datebar button[disabled]{opacity:.28}
.datebar .d{font-size:.875rem;font-weight:600;font-variant-numeric:tabular-nums}

/* misc */
.muted{color:var(--ink-3);font-size:.8125rem}
.err{color:var(--alert);font-size:.875rem;margin-top:10px}
.stack{display:grid;gap:var(--s3)}
.pre{font-family:var(--mono);font-size:.75rem;white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border-radius:6px;padding:10px;color:var(--ink-2);max-height:320px;overflow:auto}
@media(min-width:64rem){
  main.wide{max-width:68rem}
  .daily{--steps:7;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4);margin-bottom:var(--s4)}
  .daily>.card{margin:0}
  .daily>.card:last-child{grid-column:1/-1}
  .tabbar{max-width:42rem;margin:auto;border:1px solid var(--rule);border-radius:12px 12px 0 0}
}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h1>Murphy's Log</h1>
    <p class="sub">Stools, weight, condition and the evening bowl.</p>
    <div class="stack">
      <div>
        <label class="inline-lab" for="em">Email</label>
        <input class="tin" type="email" id="em" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false">
      </div>
      <div>
        <label class="inline-lab" for="pw">Password</label>
        <input class="tin" type="password" id="pw" autocomplete="current-password">
      </div>
      <button class="btn" id="signin">Sign in</button>
    </div>
    <p class="err hide" id="gate-err" role="alert"></p>
    <p class="muted" style="margin-top:22px">Two accounts only. There is no sign-up here; accounts are added in the Firebase console.</p>
  </div>
</div>

<div id="app" class="hide">
  <div class="topbar">
    <span class="who">MURPHY</span>
    <span class="state" id="state" role="status">Connecting</span>
  </div>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar" aria-label="Primary navigation">
    <button data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/></svg>Now</button>
    <button data-tab="day"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
    <button data-tab="status"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Status<span class="dotmark hide" aria-hidden="true"></span></button>
    <button data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3v18h17M8 17v-5m5 5V7m5 10V3"/></svg>Data</button>
    <button data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h5m4 0h7M4 17h9m4 0h3M9 4v6m4 4v6"/></svg>Settings</button>
  </nav>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         doc, collection, setDoc, deleteDoc, deleteField, runTransaction, onSnapshot }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const APP_VERSION = '3.1.1';

const firebaseConfig = {
  apiKey: "AIzaSyC-_At19q0VrY7u8HaYmTozUjBEQ6yTT6k",
  authDomain: "murphy-s-stool-log-v3.firebaseapp.com",
  projectId: "murphy-s-stool-log-v3",
  storageBucket: "murphy-s-stool-log-v3.firebasestorage.app",
  messagingSenderId: "973290826819",
  appId: "1:973290826819:web:be8f108bcd4bf9667f78f6"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
let db;
try {
  db = initializeFirestore(fbApp, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
  });
} catch (e) {
  db = initializeFirestore(fbApp, {});
  console.warn('Offline cache unavailable, continuing without it.', e);
}

/* Pure calculations; see selfTest and tests/. */

const RECIPES = [
  { id:'lamb',   name:'Grass-Fed Lamb',        short:'Lamb',   kcal100:122, noOil:false },
  { id:'fish',   name:'Sustainable Fish',      short:'Fish',   kcal100:94,  noOil:false },
  { id:'turkey', name:'Higher-Welfare Turkey', short:'Turkey', kcal100:100, noOil:false },
  { id:'tripe',  name:'Grass-Fed Beef Tripe',  short:'Tripe',  kcal100:118, noOil:false },
  { id:'beef',   name:'Grass-Fed Beef',        short:'Beef',   kcal100:118, noOil:false },
  { id:'salmon', name:'Sustainable Salmon',    short:'Salmon', kcal100:129, noOil:true  },
  { id:'duck',   name:'Nutrient-Rich Duck',    short:'Duck',   kcal100:157, noOil:false }
];
const BRISTOL = [null,
  { n:1, word:'Pellets', band:'r' }, { n:2, word:'Lumpy', band:'a' },
  { n:3, word:'Cracked', band:'g' }, { n:4, word:'Smooth', band:'g' },
  { n:5, word:'Soft',    band:'a' }, { n:6, word:'Mushy',  band:'a' },
  { n:7, word:'Liquid',  band:'r' }];
const BCS_STEPS = [
  { v:3, band:'r' }, { v:4, band:'a' }, { v:4.5, band:'g' }, { v:5, band:'g' },
  { v:5.5, band:'g' }, { v:6, band:'a' }, { v:7, band:'r' }];
const EVENTS = [
  { id:'vomited', label:'Vomited' }, { id:'blood', label:'Blood' },
  { id:'lethargic', label:'Lethargic' }, { id:'offFood', label:'Off food' },
  { id:'vacant', label:'Vacant episode' }];

const DEFAULTS = {
  startDate:'2026-09-07', targetKcal:1240, bdGrams:500,
  kcalPerGDarf:4.62, kcalPerMlOil:7.82, kcalPerKgTissue:7000,
  damping:0.125, deadbandPct:1.0, maxStepG:15, maxCumulativeG:40,
  minWeighIns:5, windowDays:7, suppressOnRegimeChange:true,
  bcsHoldAtOrBelow:5, bcsTarget:5, darfMinG:20,
  attributionMinH:6, handoverHour:16,
  eggKcal:0, brothKcal:0,
  fibreStepG:2.5, fibreRestG:5, fibreCapG:10, fibreStreakDays:7,
  fibreStepBackDays:14, fibreReviewMinDays:14, fibreReviewWindow:14, fibreReviewBadDays:6,
  oilSchedule:[{from:'2026-01-01', ml:8},{from:'2026-09-28', ml:4}],
  fibreSchedule:[{from:'2026-09-04', g:2.5}],
  regimeChanges:[], vetWindowDays:90, theme:'dark'
};

const DAY_MS = 86400000;
const dateDays = new Map();
function toDay(iso){
  if (!dateDays.has(iso)){
    if (dateDays.size > 4096) dateDays.clear();
    dateDays.set(iso, Math.floor(Date.parse(iso + 'T00:00:00Z') / DAY_MS));
  }
  return dateDays.get(iso);
}
const toIso = (d) => new Date(d * DAY_MS).toISOString().slice(0, 10);
function mondayOf(iso){ const d = toDay(iso); const w = new Date(d*DAY_MS).getUTCDay(); return d - ((w+6)%7); }
const minsOf = (t) => { const [h,m] = String(t||'00:00').split(':').map(Number); return h*60+m; };
const round1 = (x) => Math.round(x*10)/10;

function inForce(sch, iso, key){
  let val=null, best=-Infinity;
  for (const e of (sch||[])){ const d=toDay(e.from); if (d<=toDay(iso) && d>=best){ best=d; val=e[key]; } }
  return val;
}
const oilMlOn  = (iso,s) => { const v=inForce(s.oilSchedule,iso,'ml');  return v===null?0:v; };
const fibreGOn = (iso,s) => { const v=inForce(s.fibreSchedule,iso,'g'); return v===null?0:v; };
const adjustmentOn = (iso, ch) => (ch||[]).reduce((a,c)=> toDay(c.date)<=toDay(iso) ? a+(c.deltaG||0) : a, 0);

function bowlFor(iso, recipeId, s, changes, extras){
  const r = RECIPES.find(x=>x.id===recipeId); if (!r) return null;
  const bdKcal = r.kcal100 * (s.bdGrams/100);
  const oilMl = r.noOil ? 0 : oilMlOn(iso,s);
  const oilKcal = round1(oilMl * s.kcalPerMlOil);
  const fibreG = fibreGOn(iso,s);
  const ex = extras||{};
  const extrasKcal = (ex.egg?s.eggKcal:0) + (ex.broth?s.brothKcal:0);
  const adjustment = adjustmentOn(iso, changes);
  const darfBase = (s.targetKcal - bdKcal - oilKcal - extrasKcal) / s.kcalPerGDarf;
  let darfG = Math.round(darfBase + adjustment), floored = false;
  if (darfG < s.darfMinG){ darfG = s.darfMinG; floored = true; }
  return { recipe:r, bdGrams:s.bdGrams, bdKcal, oilMl, oilKcal, fibreG, extrasKcal,
    adjustment, darfBase:round1(darfBase), darfG, floored,
    totalKcal: Math.round(bdKcal + oilKcal + extrasKcal + darfG*s.kcalPerGDarf) };
}

function windowMean(weights, endDay, len){
  const start = endDay - len + 1, seen = new Set();
  let sum=0;
  for (const w of weights||[]){
    if (!w || !Number.isFinite(w.kg) || w.kg<=0 || w.weightMissed===true || w.missed===true) continue;
    const d=toDay(w.date);
    if (d<start || d>endDay || !Number.isFinite(d) || seen.has(d)) continue;
    seen.add(d); sum+=w.kg;
  }
  return { n:seen.size, mean:seen.size?sum/seen.size:null, from:toIso(start), to:toIso(endDay) };
}

/* Weekly ration rule: two completed windows, inclusive threshold, condition hold before caps. */
function computeDarfAdjustment({ weights=[], asOf, currentOffsetG=0, lastAdjustmentWeek=null,
  bcs7dMean=null, regimeChanges=[], settings={} } = {}){
  const cfg = { ...DEFAULTS, ...settings };
  const thisWeek = mondayOf(asOf), endDay = thisWeek - 1;
  const current = windowMean(weights, endDay, cfg.windowDays);
  const previous = windowMean(weights, endDay - cfg.windowDays, cfg.windowDays);
  const out = { asOf, weekStart:toIso(thisWeek),
    currentWindow:[current.from,current.to], previousWindow:[previous.from,previous.to],
    previousMean:previous.mean, currentMean:current.mean, previousN:previous.n, currentN:current.n,
    percentChange:null, fullCorrectionG:null, rawStepG:null,
    adjustmentG:0, applied:false, limitedBy:null, held:false, reason:'' };

  if (lastAdjustmentWeek && mondayOf(lastAdjustmentWeek) >= thisWeek){
    out.reason = 'Adjustment already recorded this week.'; return out; }
  if (cfg.suppressOnRegimeChange){
    const lo=toDay(previous.from), hi=toDay(current.to);
    const hit=(regimeChanges||[]).find(d=>{const n=toDay(d);return n>=lo&&n<=hi;});
    if (hit){ out.reason = `Ration changed on ${fmtDate(hit)} inside these windows; the comparison is confounded, so hold.`; return out; }
  }
  if (previous.n < cfg.minWeighIns || current.n < cfg.minWeighIns){
    out.reason = `Weigh-ins: ${previous.n} earlier, ${current.n} later; at least ${cfg.minWeighIns} per week required.`;
    return out;
  }
  const pct = ((current.mean - previous.mean) / previous.mean) * 100;
  out.percentChange = pct;
  const perPct = (0.01 * current.mean * cfg.kcalPerKgTissue) / (cfg.windowDays * cfg.kcalPerGDarf);
  out.fullCorrectionG = -pct * perPct;
  out.rawStepG = out.fullCorrectionG * cfg.damping;

  // Allow only floating-point roundoff at the inclusive threshold.
  if (Math.abs(pct) + 1e-10 < cfg.deadbandPct){
    out.reason = `${pct>=0?'+':''}${pct.toFixed(2)}% is within the ±${cfg.deadbandPct}% deadband: hold.`;
    return out;
  }
  let step = Math.round(out.rawStepG);

  // Apply condition hold before caps.
  if (step < 0 && bcs7dMean !== null && bcs7dMean <= cfg.bcsHoldAtOrBelow){
    out.held = true;
    out.reason = `Weight up ${pct.toFixed(2)}%; mean condition ${bcs7dMean.toFixed(1)} is at or below ${cfg.bcsHoldAtOrBelow}: hold the reduction.`;
    return out;
  }
  const direction = Math.sign(step);
  if (Math.abs(step) > cfg.maxStepG){ step = Math.sign(step)*cfg.maxStepG; out.limitedBy='maxStepG'; }
  const projected = currentOffsetG + step;
  if (Math.abs(projected) > cfg.maxCumulativeG){
    step = Math.trunc(Math.sign(projected)*cfg.maxCumulativeG - currentOffsetG);
    if (Math.sign(step) !== direction) step = 0;   // Never reverse advice.
    out.limitedBy = 'maxCumulativeG';
  }
  if (step === 0){
    out.reason = `${pct>=0?'+':''}${pct.toFixed(2)}% calls for a change, but the ±${cfg.maxCumulativeG} g cumulative cap is reached.`;
    return out;
  }
  out.adjustmentG = step; out.applied = true;
  out.reason = `${fmtDate(current.from)} to ${fmtDate(current.to)} averaged ${current.mean.toFixed(2)} kg against `
    + `${previous.mean.toFixed(2)} kg the week before, ${pct>0?'+':''}${pct.toFixed(2)}%. `
    + `Undamped: ${Math.abs(out.fullCorrectionG).toFixed(0)} g DARF; damped: `
    + `${step>0?'up':'down'} ${Math.abs(step)} g`
    + (out.limitedBy ? ` and held at the ${out.limitedBy==='maxStepG'?'single-step':'cumulative'} cap.` : '.');
  return out;
}

function attributionFor(stoolIso, stoolTime, meals, cfg, overrideDate){
  const t=toDay(stoolIso)*1440+minsOf(stoolTime), gap=(cfg.attributionMinH??6)*60;
  const eligible=[], earlier=[], prior=[];
  let override=null;
  const insert=(list,m,at)=>{
    if(!list[0]||at>=list[0].at){list[1]=list[0];list[0]={m,at};}
    else if(!list[1]||at>=list[1].at)list[1]={m,at};
  };
  for (const m of meals||[]){
    const day=toDay(m.date), at=day*1440+minsOf(m.fedAt);
    if (m.date===overrideDate) override=m;
    if (day<toDay(overrideDate)) insert(prior,m,day);
    if (t-at>=gap) insert(eligible,m,at);
    if (at<t) insert(earlier,m,at);
  }
  if (override) return {primary:override,secondary:prior[0]?.m||null,assumed:false,overridden:true};
  const list=eligible.length?eligible:earlier;
  return {primary:list[0]?.m||null,secondary:list[1]?.m||null,assumed:!eligible.length&&!!earlier.length};
}

function dayVerdict(day){
  const st = (day && day.stools) || [];
  if (!st.length) return 'pause';
  return st.some(s => s.bristol<3 || s.bristol>4 || s.mucus || s.blood) ? 'broken' : 'clean';
}
function fibreStreak(days, sinceIso, todayIso){
  const out=[]; let count=0;
  for (let d=toDay(sinceIso)+1; d<=toDay(todayIso); d++){
    const iso=toIso(d), v=dayVerdict(days[iso]);
    if (v==='clean') count++; else if (v==='broken') count=0;
    out.push({date:iso, verdict:v});
  }
  return { count, days:out };
}
function fibreAdvice(days, todayIso, s){
  const dose = fibreGOn(todayIso,s), since = inForce(s.fibreSchedule,todayIso,'from');
  const res = { dose, since, streak:0, chips:[], advice:null, review:false, note:'' };
  if (!since) return res;
  const st = fibreStreak(days, since, todayIso);
  res.streak = st.count;
  res.chips = st.days.slice(-s.fibreStreakDays);
  const daysAtDose = toDay(todayIso) - toDay(since);

  const prior = (s.fibreSchedule||[]).filter(e=>toDay(e.from)<toDay(since)).sort((a,b)=>toDay(a.from)-toDay(b.from));
  const previousDose = prior.length ? prior[prior.length-1].g : null;
  if (previousDose !== null && dose > previousDose && daysAtDose <= s.fibreStepBackDays){
    // Rolling three-day flags; 3, 5, 6 and 7 contain at least two loose days.
    let bits=0, seen=0;
    for(let d=toDay(since)+1;d<=toDay(todayIso);d++){
      const loose=(days[toIso(d)]?.stools||[]).some(x=>x.bristol>=5);
      bits=((bits<<1)|Number(loose))&7; seen++;
      if(seen>=3&&[3,5,6,7].includes(bits)){
        res.advice={kind:'down',toG:previousDose,text:`Loose stools since the step to ${dose} g. Return to ${previousDose} g.`};
        return res;
      }
    }
  }
  if (dose < s.fibreRestG && res.streak >= s.fibreStreakDays){
    const toG = Math.min(dose + s.fibreStepG, s.fibreRestG);
    res.advice = { kind:'up', toG, text:`${res.streak} clean days. Step Pro-Fibre from ${dose} g to ${toG} g.` };
    return res;
  }
  if (dose >= s.fibreRestG){
    res.note = `Resting at ${dose} g. This is the advice ceiling.`;
    if (daysAtDose >= s.fibreReviewMinDays){
      let bad=0;
      for (let d=toDay(todayIso)-s.fibreReviewWindow+1; d<=toDay(todayIso); d++){
        const st2=(days[toIso(d)]||{}).stools||[];
        if (st2.length && st2.some(x=>x.bristol<3||x.bristol>4||x.mucus)) bad++;
      }
      if (bad >= s.fibreReviewBadDays){
        res.review = true;
        res.note = `${bad} of the last ${s.fibreReviewWindow} logged days were outside Bristol 3 to 4 or carried mucus, after ${daysAtDose} days at ${dose} g. Stool not settling at ${s.fibreRestG} g needs vet review: faecal pathogens, pancreatic lipase and raw handling. Settings allows manual doses up to ${s.fibreCapG} g; the app never advises an increase above the ceiling.`;
      }
    }
  }
  return res;
}

function bcsMean(days,todayIso,n){
  let sum=0,count=0;
  for(let d=toDay(todayIso)-n+1;d<=toDay(todayIso);d++){
    const value=days[toIso(d)]?.bcs;
    if(Number.isFinite(value)){sum+=value;count++;}
  }
  return {mean:count?sum/count:null,n:count};
}

function vetItems(days, todayIso, weights, s){
  const items=[], within=(iso,n)=>toDay(iso)>toDay(todayIso)-n;
  const all=Object.keys(days).sort();
  const blood=all.filter(d=>(days[d].stools||[]).some(x=>x.blood)||(days[d].events||[]).includes('blood'));
  if (blood.length) items.push({sev:'r',title:'Blood recorded',dates:blood,text:'Never aged out of this list.'});
  const vacant=all.filter(d=>within(d,s.vetWindowDays)&&(days[d].events||[]).includes('vacant'));
  if (vacant.length) items.push({sev:'r',title:'Vacant episode',dates:vacant,text:'Video it if it happens again. For an episodic neurological sign a video is the single most useful thing a vet can be given.'});
  const leth=all.filter(d=>within(d,s.vetWindowDays)&&(days[d].events||[]).includes('lethargic'));
  if (leth.length) items.push({sev:'a',title:'Lethargy',dates:leth,text:''});
  const vom=all.filter(d=>within(d,7)&&(days[d].events||[]).includes('vomited'));
  if (vom.length>=2) items.push({sev:'a',title:'Vomited on two or more days this week',dates:vom,text:''});
  const six=[];
  for (let i=1;i<all.length;i++){
    const a=all[i-1], b=all[i];
    if (toDay(b)-toDay(a)!==1) continue;
    const bad=d=>(days[d].stools||[]).some(x=>x.bristol>=6);
    if (bad(a)&&bad(b)&&within(b,s.vetWindowDays)) six.push(b);
  }
  if (six.length) items.push({sev:'a',title:'Bristol 6 or 7 on consecutive days',dates:six,text:''});
  const ref=all.filter(d=>within(d,7)&&days[d].meal&&days[d].meal.bowl==='refused');
  if (ref.length>=2) items.push({sev:'a',title:'Bowl refused twice this week',dates:ref,text:''});
  const end=toDay(todayIso);
  const w2=windowMean(weights,end,14), w2p=windowMean(weights,end-14,14);
  if (w2.mean&&w2p.mean&&(w2.mean-w2p.mean)/w2p.mean<=-0.02){
    const nights=all.filter(d=>within(d,14)&&days[d].meal&&days[d].meal.bowl);
    if (nights.length>=4&&nights.every(d=>days[d].meal.bowl==='cleared'))
      items.push({sev:'a',title:'Losing weight with a cleared bowl',dates:[],
        text:'Down 2% or more over a fortnight while eating everything put down. Loss with a normal appetite is a vet question rather than a ration question.'});
  }
  return items;
}

const S = {

function localToday(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function nowHHMM(){ const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
const MON=['Jan','Feb','Mar','Apr','May','June','July','Aug','Sept','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtDate(iso){
  if (!iso) return '';
  const d=new Date(toDay(iso)*DAY_MS);
  return `${DOW[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`;
}
function fmtShort(iso){ const d=new Date(toDay(iso)*DAY_MS); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; }

function setStatus(text, cls){ S.status=text; const el=$('#state'); if (el){ el.textContent=text; el.className='state '+(cls||''); } }

let flushing=false, writeClock=0, unsubs=[];
const queuePrefix=()=>`murphy-outbox:${S.user.uid}:`;
const object=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
function mergeData(base, patch){
  const out={...base};
  for(const [k,v] of Object.entries(patch))
    Object.defineProperty(out,k,{value:object(v)?mergeData(object(out[k])?out[k]:{},v):v,enumerable:true,writable:true,configurable:true});
  return out;
}
function pathValue(body,path,value,remove=false){
  let p=body;
  for(const k of path.slice(0,-1)) p=p[k]=object(p[k])?{...p[k]}:{};
  if(remove) delete p[path.at(-1)]; else p[path.at(-1)]=value;
}
// Only explicit edits clear fields; untouched historical nulls and empty values survive.
function cleanDay(patch, remove=[], path=[], base={}){
  const out={};
  for(const [k,v] of Object.entries(patch)){
    if(v===base[k]) continue;
    const p=[...path,k];
    if(v===null||v===undefined||v==='') remove.push(p);
    else if(v!==base[k]){
      const next=object(v)?cleanDay(v,remove,p,base[k]||{}):v;
      if(!object(next)||Object.keys(next).length) out[k]=next;
    }
  }
  return out;
}
function queuedWrites(){
  if(!S.user) return [];
  const prefix=queuePrefix(), entries=[];
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(key.startsWith(prefix)) entries.push([key,JSON.parse(localStorage.getItem(key))]);
  }
  return entries.sort(([a],[b])=>a.localeCompare(b));
}
function stoolMerge(stools, delta){
  const put=new Map(delta.put.map(s=>[s.id,s]));
  return (stools||[]).filter(s=>!delta.drop.includes(s.id)).map(s=>{
    const p=put.get(s.id); put.delete(s.id); return p?{...s,...p}:s;
  }).concat([...put.values()]);
}
function operationData(op, current={}, remote=false){
  const body=mergeData(remote&&!op.restore?{}:current,op.patch||{});
  for(const path of op.remove||[]) pathValue(body,path,remote?deleteField():null,!remote);
  if(op.stools) body.stools=stoolMerge(current.stools,op.stools);
  return body;
}
function applyOperation(op){
  if(op.items){ op.items.forEach(applyOperation); return; }
  if(op.col==='days') S.days={...S.days,[op.id]:operationData(op,S.days[op.id])};
  if(op.col==='settings') S.settings=operationData(op,S.settings);
  if(op.col==='changes') S.changes=S.changes.filter(c=>c.id!==op.id)
    .concat(op.erase?[]:[operationData(op,S.changes.find(c=>c.id===op.id))]).sort((a,b)=>toDay(a.date)-toDay(b.date));
}
function storeError(e){
  setStatus('Not saved','bad');
  S.banner={kind:'bad',title:'Could not save locally',text:String(e.message||e)+'. Keep this form open and retry.'};
  render();
}
async function write(op){
  try{
    if(!S.user) throw Error('Sign in before saving');
    writeClock=Math.max(Date.now(),writeClock+1);
    localStorage.setItem(queuePrefix()+writeClock+'-'+crypto.randomUUID(),JSON.stringify(op));
  }catch(e){storeError(e);return false;}
  applyOperation(op); setStatus('Saved locally; syncing','warn'); render();
  void flushWrites(); return true;
}
async function sendOperation(op){
  if(op.items){ for(const item of op.items) await sendOperation(item); return; }
  const ref=doc(db,op.col,op.id);
  if(op.erase) return deleteDoc(ref);
  if(!op.stools&&!op.restore) return setDoc(ref,operationData(op,{},true),{merge:true});
  return runTransaction(db,async tx=>{
    const snap=await tx.get(ref), current=snap.exists()?snap.data():{};
    if(op.restore&&snap.exists()){
      if(op.col==='changes'||(op.col==='days'&&(current.updatedAt||'')>=(op.patch.updatedAt||''))) return;
      if(op.col==='settings'){
        const patch=Object.fromEntries(Object.entries(op.patch).filter(([k])=>!Object.hasOwn(current,k)));
        if(Object.keys(patch).length) tx.set(ref,patch,{merge:true});
        return;
      }
    }
    tx.set(ref,operationData(op,current,true),{merge:true});
  });
}
async function flushWrites(){
  if(flushing||!S.user) return;
  flushing=true;
  const uid=S.user.uid;
  const flush=async()=>{
    for(;;){
      const entry=queuedWrites()[0]; if(!entry) break;
      const [key,op]=entry;
      if(S.user?.uid!==uid) return;
      if(localStorage.getItem(key)===null) continue;
      await sendOperation(op); localStorage.removeItem(key);
    }
    setStatus(navigator.onLine?'Synced':'Offline','');
  };
  try{
    if(navigator.locks) await navigator.locks.request('murphy-sync:'+uid,flush); else await flush();
  }catch(e){
    setStatus('Saved locally; retry sync','warn');
    S.banner={kind:'warn',title:'Sync pending',text:'Your confirmed entry is kept on this device. Retry sync when connected. '+String(e.message||e)};
    render();
  }finally{flushing=false;}
}
function saveDay(iso,patch){
  const remove=[], data=cleanDay(patch,remove,[],S.days[iso]||{}), op={col:'days',id:iso,patch:data,remove};
  if(Array.isArray(data.stools)){
    const before=S.days[iso]?.stools||[], after=data.stools;
    op.stools={put:after.flatMap(s=>{
      const old=before.find(b=>b.id===s.id); if(!old) return [s];
      const patch=Object.fromEntries(Object.entries(s).filter(([k,v])=>k==='id'||v!==old[k]));
      return Object.keys(patch).length>1?[patch]:[];
    }),
      drop:before.filter(s=>!after.some(a=>a.id===s.id)).map(s=>s.id)};
    delete data.stools;
  }
  data.date=iso; data.updatedAt=new Date().toISOString();
  return write(op);
}
function saveSettings(patch){return write({col:'settings',id:'main',patch});}
function saveChange(c){
  const id=c.id||'c'+crypto.randomUUID();
  return write({col:'changes',id,patch:{...c,id}});
}
function removeChange(id){return write({col:'changes',id,erase:true});}

function subscribe(){
  unsubs.forEach(fn=>fn()); unsubs=[];
  const uid=S.user.uid, seen=new Set();
  S.days={}; S.changes=[]; S.settings={...DEFAULTS}; S.ready=false;
  const received=(name,snap)=>{
    if(S.user?.uid!==uid) return;
    seen.add(name); S.ready=seen.size===3;
    let queued;
    try{queued=queuedWrites();queued.forEach(([,op])=>applyOperation(op));}catch(e){storeError(e);return;}
    setStatus(queued.length?'Saved locally; syncing':snap.metadata.fromCache?'Cached; checking sync':'Synced');
    applyTheme(); render();
  };
  const failed=e=>{setStatus('Not connected','bad');S.banner={kind:'bad',title:'Connection failed',text:String(e.message||e)};render();};
  unsubs.push(onSnapshot(collection(db,'days'),{includeMetadataChanges:true},snap=>{
    if(S.user?.uid!==uid) return;
    S.days=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()])); received('days',snap);
  },failed));
  unsubs.push(onSnapshot(collection(db,'changes'),{includeMetadataChanges:true},snap=>{
    if(S.user?.uid!==uid) return;
    S.changes=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>toDay(a.date)-toDay(b.date)); received('changes',snap);
  },failed));
  unsubs.push(onSnapshot(doc(db,'settings','main'),{includeMetadataChanges:true},snap=>{
    if(S.user?.uid!==uid) return;
    S.savedSettings=snap.exists()?snap.data():{};
    S.settings={...DEFAULTS,...S.savedSettings}; received('settings',snap);
  },failed));
  void flushWrites();
}
window.addEventListener('storage',e=>{
  if(S.user&&e.key?.startsWith(queuePrefix())){queuedWrites().forEach(([,op])=>applyOperation(op));render();void flushWrites();}
});

  return miss;
}
function bandOfBristol(n){ return (BRISTOL[n]||{}).band||'a'; }

/* RENDER */
const refocus=id=>document.getElementById(id)?.focus({preventScroll:true});
let renderPending=false,rendered='';
function render(force=false){
  if (!S.user) return;
  if (!S.ready){rendered='';$('#main').innerHTML=bannerHtml()+'<p role="status">Loading saved records…</p>';return;}
  if (!force && $('#main [data-dirty],#main [data-stool]')){renderPending=true;return;}
  renderPending=false;
  if (!S.cursor) S.cursor=localToday();
  $$('#tabbar button').forEach(b=>{
    const active=b.dataset.tab===S.tab;
    b.classList.toggle('on',active);
    if (active) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  const needs=insights().vet.length||weeklyAdvice().applied||insights().fib.advice;
  $('#tabbar .dotmark')?.classList.toggle('hide',!needs);
  $('#main').className=['today','day','history'].includes(S.tab)?'wide':'';
  const html=S.tab==='today'?viewToday():S.tab==='day'?viewDay():S.tab==='status'?viewStatus():S.tab==='history'?viewHistory():viewMore();
  if(!force&&html===rendered)return;
  rendered=html;
  const expanded=$$('#main details[id]').map(e=>[e.id,e.open]), focus=document.activeElement?.id;
  $('#main').innerHTML=html;
  for(const [id,open] of expanded){const e=document.getElementById(id);if(e)e.open=open;}
  if(focus)refocus(focus);
}
function leaveDraft(){
  if (!$('#main [data-dirty],#main [data-stool]')) return true;
  if (!confirm('Discard the unconfirmed draft?')) return false;
  S.adding=null; stoolDraft=null; render(true); return true;
}

function bannerHtml(){
  if (!S.banner) return '';
  const b=S.banner;
  return `<div class="note ${b.kind}"><b>${esc(b.title)}</b>${esc(b.text)}
    <div style="margin-top:8px"><button class="link" data-act="retrysync">Retry sync</button> <button class="link" data-act="dismiss-banner">Dismiss</button></div></div>`;
}

/* TODAY */
function viewToday(){
  const today=localToday();
  const adv=weeklyAdvice(), {fib,vet}=insights();
  let head='';
  if (vet.length) head += `<div class="note bad"><b>${vet.length===1?'One vet item':vet.length+' vet items'}</b>${esc(vet.map(v=>v.title).join('. '))}. <button class="link" data-act="go" data-tab="status">Open Status</button></div>`;
  if (adv.applied) head += `<div class="note warn"><b>This week's ration advice is waiting</b>${esc(adv.reason)} <button class="link" data-act="go" data-tab="status">Open Status</button></div>`;
  else if (fib.advice) head += `<div class="note warn"><b>Pro-Fibre</b>${esc(fib.advice.text)} <button class="link" data-act="go" data-tab="status">Open Status</button></div>`;

  const toggle = `<div style="display:flex;justify-content:flex-end;margin-bottom:10px">
    <button class="link" data-act="swapcard">${isEvening()?'Show the morning log':"Show tonight's bowl"}</button></div>`;
  return bannerHtml()+head+toggle+(isEvening()?cardEvening(today):cardMorning(today));
}

function row(k,v){ return `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`; }
function choice(on,cls=''){return `class="${cls}${on?' on':''}" aria-pressed="${!!on}"`;}
function panel(title,body){ return `<section class="card sec"><h3 class="lab">${title}</h3>${body}</section>`; }
function fold(title,body,id,open=false){return `<details class="card" id="${id}" ${open?'open':''}><summary class="sec">${title}</summary><div class="sec">${body}</div></details>`;}
function inputField(iso,k,label,min=0,max=600,step=1){
  const d=S.days[iso]||{}, value=k==='setnum'?S.settings[label]:k==='darfFed'?d.meal?.darfFed:d[k];
  const id='in-'+k+'-'+(k==='setnum'?label:iso);
  return `<div data-form data-date="${iso}" data-key="${k}" data-setting="${esc(label)}">
    ${k==='notes'?`<label class="inline-lab" for="${id}">Notes for ${fmtDate(iso)}</label><textarea id="${id}" class="tin" data-act="notes">${esc(value||'')}</textarea>`:
    `<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" type="number" inputmode="${step<1?'decimal':'numeric'}" min="${min}" max="${max}" step="${step}" value="${esc(value??'')}" data-act="${k}" placeholder="—"></div>`}
  </div>`;
}
function dailyFields(iso){
  const d=S.days[iso]||{};
  return '<div class="daily">'+stoolsCard(iso)+panel('Weight',inputField(iso,'weight','Pre-feed weight, kg',10,30,.01)+
    `<button ${choice(d.weightMissed,'chip')} data-act="missed" data-date="${iso}">Pre-feed weight missed</button>`+weightHint(iso))+
    panel('Condition',bcsScale(iso,d.bcs)+'<p class="sub">An informed, subjective assessment of ribs, waist and tuck. Excellent: 4.5–5.5; ideal centre: 5.0.</p>')+
    panel('Walk','<div class="stack">'+inputField(iso,'walkMin','Minutes walked')+inputField(iso,'walkKm','Kilometres',0,80,.1)+inputField(iso,'activeMin','Active minutes',0,1440)+'</div>')+
    panel('Treats',inputField(iso,'treats','Dried necks and feet',0,10))+
    panel('Events',`<div class="chips">${EVENTS.map(e=>`<button ${choice((d.events||[]).includes(e.id),'chip ev')} data-act="event" data-id="${e.id}" data-date="${iso}">${e.label}</button>`).join('')}</div>`)+
    panel('Notes',inputField(iso,'notes','Notes'))+'</div>';
}
const MEAL_FLAGS={egg:'Whole egg',broth:'Bone broth',fibreGiven:'Fibre',oilGiven:'Salmon oil'};
function mealFlags(iso,m){
  return `<div class="meal-flags">${Object.entries(MEAL_FLAGS).map(([k,label])=>`<button ${choice(m[k]===true,'chip')} data-act="extra" data-k="${k}" data-date="${iso}">${label}: ${m[k]===true?'Yes':m[k]===false?'No':'not recorded'}</button>`).join('')}</div>`;
}
function mealSummary(m){
  return `${m.fedAt?esc(m.fedAt)+' · ':''}oil ${esc(m.oilMl??'?')} ml · fibre ${esc(m.fibreG??'?')} g<br>${Object.entries(MEAL_FLAGS).map(([k,l])=>l+': '+(m[k]===true?'Yes':m[k]===false?'No':'not recorded')).join(' · ')}`;
}
function mealEditor(iso,live=false,details='',previous=false){
  const m=S.days[iso]?.meal||{}, r=RECIPES.find(x=>x.id===m.recipe), fed=!!m.fedAt;
  const disabled=live&&!fed;
  const body=`<label class="inline-lab" for="recipe-${iso}">Recipe · ${fmtDate(iso)}</label>
    <select class="tin" id="recipe-${iso}" data-act="recipe" data-date="${iso}"><option value="" disabled ${!m.recipe?'selected':''}>Choose a recipe</option>${m.recipe&&!r?`<option selected value="${esc(m.recipe)}">${esc(m.recipe)}</option>`:''}${RECIPES.map(x=>`<option value="${x.id}" ${m.recipe===x.id?'selected':''}>${x.name}</option>`).join('')}</select>
    ${!live&&m.recipe?`<p class="sub">${esc(m.darfFed??m.darfPlanned??'?')} g · ${m.fedAt?esc(m.fedAt)+' · ':''}oil ${esc(m.oilMl??'?')} ml · fibre ${esc(m.fibreG??'?')} g</p>`:''}
    ${details}${mealFlags(iso,m)}
    ${r?`${live?`${fed?row('Fed at '+esc(m.fedAt),esc(m.darfFed??m.darfPlanned??'?')+' g'):''}<button class="btn ${fed?'ghost sm':''}" data-act="${fed?'unfeed':'fed'}" data-date="${iso}">${fed?'Undo Fed':'Fed'}</button>`:''}
      ${!disabled?inputField(iso,'darfFed','Grams actually fed',0,400):''}
      <p class="lab">How the bowl went</p><div class="seg">${['cleared','left','refused'].map(k=>`<button ${choice(m.bowl===k)} ${disabled?'disabled':''} data-act="bowl" data-k="${k}" data-date="${iso}">${k==='left'?'Left some':k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>
      ${disabled?'<p class="sub">Selectable once Fed is pressed.</p>':''}`:''}`;
  return previous?fold(`Evening meal <span class="sub">${r?esc(r.short)+' · '+esc(m.darfFed??m.darfPlanned??'?')+' g · '+esc(m.bowl||'bowl not recorded'):'Not recorded'}</span>`,body,'meal-'+iso,!m.recipe||!m.bowl):panel('Evening meal',body);
}
function cardMorning(iso){
  const miss=missingFor(iso);
  return `<span class="moment">Morning</span><h2 class="screen">${fmtDate(iso)}</h2>`+
    mealEditor(toIso(toDay(iso)-1),false,'',true)+dailyFields(iso)+
    `<div class="note ${miss.length?'plain':'good'}">${miss.length?'<b>Still to log</b>'+miss.map(x=>`<button class="link" data-act="jump" data-k="${x.k}">${x.t}</button>`).join(', '):'<b>Morning complete</b>Evening meal controls are ready when needed.'}</div>`;
}

function weightHint(iso){
  const d=S.days[iso]||{};
  const m=windowMean(weightsList(),toDay(iso),7);
  if (!m.mean) return '';
  let extra='';
  if (Number.isFinite(d.weight) && Math.abs(d.weight-m.mean)/m.mean>0.05)
    extra=` <span style="color:var(--watch)">That is ${((d.weight-m.mean)/m.mean*100).toFixed(0)}% from the recent average.</span>`;
  return `<p class="sub">7-day mean ${m.mean.toFixed(2)} kg from ${m.n} reading${m.n===1?'':'s'}.${extra}</p>`;
}

function bcsScale(iso,val){
  return `<div class="scale">${BCS_STEPS.map(s=>
    `<button ${choice(val===s.v,s.band)} data-act="bcs" data-v="${s.v}" data-date="${iso}">${s.v}</button>`).join('')}</div>`;
}

function stoolsCard(iso){
  const st=(S.days[iso]?.stools||[]).slice().sort((a,b)=>minsOf(a.time)-minsOf(b.time)), meals=mealsList();
  const rows=st.map(s=>{
    const b=BRISTOL[s.bristol]||{word:'?',band:'a'}, at=attributionFor(iso,s.time,meals,S.settings,s.mealOverride);
    const attr=at.primary?`after ${RECIPES.find(x=>x.id===at.primary.recipe)?.short||at.primary.recipe}${at.assumed?', assumed':''}${at.overridden?', set by hand':''}`:'no earlier meal';
    return `<div class="stool"><span class="dot ${b.band}"></span><div class="body"><span class="t">${esc(s.time)} · Bristol ${esc(s.bristol)}, ${b.word}${s.mucus?' · mucus':''}${s.blood?' · blood':''}</span><span class="attr">${esc(attr)}</span>
      <details id="stool-${esc(s.id)}"><summary class="link" aria-label="Stool actions at ${esc(s.time)}">Actions</summary><div class="chips">
      <button class="link" data-act="editstool" data-date="${iso}" data-id="${esc(s.id)}">Edit</button>
      ${at.secondary?`<button class="link" data-act="swapattr" data-date="${iso}" data-id="${esc(s.id)}" data-to="${at.overridden?'':at.secondary.date}">Change meal</button>`:''}
      <button class="link" data-act="delstool" data-date="${iso}" data-id="${esc(s.id)}" aria-label="Delete stool at ${esc(s.time)}">Delete</button></div></details></div></div>`;
  }).join('');
  const f=stoolDraft;
  const form=S.adding===iso&&f?`<div data-stool data-date="${iso}">
    <label class="inline-lab" for="st-t">Time</label><input class="tin" id="st-t" type="time" required value="${esc(f.time)}">
    <div class="bristol">${BRISTOL.slice(1).map(b=>`<button ${choice(f.bristol===b.n,b.band)} aria-label="Bristol ${b.n}, ${b.word}" data-act="stooltype" data-b="${b.n}"><b>${b.n}</b><i>${b.word}</i></button>`).join('')}</div>
    <div class="chips">${['mucus','blood'].map(k=>`<button ${choice(f[k],'chip')} data-act="tog-${k}">${k==='mucus'?'Mucus':'Blood'}</button>`).join('')}</div>
    <div class="btnrow"><button class="btn" data-act="savestool">Save stool entry</button><button class="btn ghost" data-act="cancelstool">Cancel</button></div>
  </div>`:`<button class="link" data-act="openstool" data-date="${iso}">+ Add stool</button>`;
  return panel('Stools',(rows||'<p class="muted">None logged.</p>')+form);
}

function cardEvening(iso){
  const s=S.settings, meal=S.days[iso]?.meal||{}, b=bowlFor(iso,meal.recipe,s,S.changes,meal);
  const oil=s.oilSchedule||[], fibre=s.fibreSchedule||[];
  const next=oil.filter(e=>e.from>iso).sort((a,b)=>a.from.localeCompare(b.from))[0];
  const recent=[...oil,...fibre].map(e=>e.from).filter(d=>d<=iso&&toDay(iso)-toDay(d)<=7).sort().at(-1);
  const last6=mealsList().filter(m=>m.date<iso).slice(-6).reverse().map(m=>RECIPES.find(r=>r.id===m.recipe)?.short||m.recipe);
  const details=`<p class="sub">Regime: Pro-Fibre ${fibreGOn(iso,s)} g · oil ${oilMlOn(iso,s)} ml${next?` · changes to ${next.ml} ml in ${toDay(next.from)-toDay(iso)} days`:''}</p>`+
    (last6.length?`<p class="sub">Last six: ${esc(last6.join(', '))}</p>`:'')+
    (b?`<h3 class="lab">The bowl</h3>${row('Bella &amp; Duke',b.bdGrams+' g')}
      ${row('DARF Active',`<strong style="font-size:1.5rem">${b.darfG} g</strong>`)}
      ${row('Salmon oil',b.oilMl?b.oilMl+' ml':'none tonight')}${row('Pro-Fibre',b.fibreG+' g')}
      <p class="sub">${b.darfBase} g base ${b.adjustment>=0?'+':'−'} ${Math.abs(b.adjustment)} g adjustment · ${b.totalKcal} kcal${b.floored?' · at the ration floor':''}</p>`:
      '<p class="muted">Choose a recipe to see tonight’s amounts.</p>')+
    (recent?`<p class="sub" style="color:var(--watch)">Fibre or oil changed on ${fmtDate(recent)}. An extra now will muddy the read-out.</p>`:'');
  return `<span class="moment">Evening</span><h2 class="screen">Tonight's bowl</h2>`+
    mealEditor(iso,true,details)+eveningFoot(iso);
}

function eveningFoot(iso){
  const miss=missingFor(iso).filter(x=>x.k!=='bowl');
  const d=S.days[iso]||{};
  if (!miss.length) return `<div class="note good"><b>This morning</b>${(d.stools||[]).length} stool${(d.stools||[]).length===1?'':'s'} &middot; ${d.weightMissed?'Weight missed':(d.weight??'--')+' kg'} &middot; BCS ${d.bcs??'--'}. Nothing outstanding.</div>`;
  return `<div class="note plain"><b>Still to log today</b>${miss.map(x=>`<button class="link" data-act="jump" data-k="${x.k}">${x.t}</button>`).join(', ')}</div>`;
}

/* DAY SHEET */
function viewDay(){
  const iso=S.cursor, miss=missingFor(iso);

/* STATUS */
function meanRows(today,weight){
  return [7,14,28].map(n=>{
    const m=weight?windowMean(weightsList(),toDay(today),n):bcsMean(S.days,today,n);
    return m.mean===null?'':row(n+'-day mean',m.mean.toFixed(weight?2:1)+(weight?' kg':'')+' · '+m.n+' readings');
  }).join('');
}
function viewStatus(){
  const today=localToday(), s=S.settings;
  const {vet,fib}=insights(), adv=weeklyAdvice();
  const off=offsetNow();
  const W=weightsList();
  const latest=W.length?W[W.length-1]:null;

  const vetHtml = vet.length
    ? vet.map(v=>`<div class="note ${v.sev==='r'?'bad':'warn'}"><b>${esc(v.title)}</b>${v.dates.length?esc(v.dates.map(fmtShort).join(', ')):''}${v.text?'<br>'+esc(v.text):''}</div>`).join('')
    : '<p class="muted">None.</p>';

  let advHtml;
  if (adv.applied){
    advHtml = `<div class="note warn"><b>${adv.adjustmentG>0?'Increase':'Reduce'} DARF by ${Math.abs(adv.adjustmentG)} g on every recipe</b>${esc(adv.reason)}</div>
      <div class="btnrow"><button class="btn sm" data-act="applyadv">Apply</button>
      <button class="btn ghost sm" data-act="refuseadv">Refuse</button></div>`;
  } else if (adv.held){
    advHtml = `<div class="note hold"><b>Held</b>${esc(adv.reason)}</div>`;
  } else {
    advHtml = `<div class="note plain"><b>No change</b>${esc(adv.reason||'Not enough data yet.')}</div>`;
  }
  const windows = (adv.currentMean!=null&&adv.previousMean!=null) ? `
    ${row(`${fmtShort(adv.currentWindow[0])} to ${fmtShort(adv.currentWindow[1])}`,`${adv.currentMean.toFixed(2)} kg`)}
    ${row(`${fmtShort(adv.previousWindow[0])} to ${fmtShort(adv.previousWindow[1])}`,`${adv.previousMean.toFixed(2)} kg`)}
    <p class="sub">${adv.percentChange==null?'Trend unavailable':(adv.percentChange>=0?'+':'')+adv.percentChange.toFixed(2)+'%'} &middot; ${adv.previousN} and ${adv.currentN} weigh-ins${adv.fullCorrectionG!=null?` &middot; full correction ${Math.abs(adv.fullCorrectionG).toFixed(0)} g, damped to ${Math.abs(Math.round(adv.rawStepG))} g`:''}</p>` : '';

  const chips = fib.chips.length ? `<div class="streak">${
    Array.from({length:s.fibreStreakDays},(_,i)=>{
      const c=fib.chips[i];
      if (!c) return '<span></span>';
      return `<span class="${c.verdict}" title="${fmtShort(c.date)}">${c.verdict==='clean'?'&check;':c.verdict==='broken'?'&times;':'&ndash;'}</span>`;
    }).join('')}</div>` : '';

  let fibHtml = row('Current dose',fib.dose+' g')+chips;
  if (fib.dose < s.fibreRestG) fibHtml += `<p class="sub">${fib.streak} of ${s.fibreStreakDays} clean days since ${fmtShort(fib.since)}. A day with no stool pauses rather than resets.</p>`;
  if (fib.advice) fibHtml += `<div class="note warn" style="margin-top:9px"><b>${fib.advice.kind==='up'?'Step up':'Step back'}</b>${esc(fib.advice.text)}</div>
    <div class="btnrow"><button class="btn sm" data-act="applyfibre" data-g="${fib.advice.toG}">Apply</button>
    <button class="btn ghost sm" data-act="dismissfibre">Not now</button></div>`;
  if (fib.review) fibHtml += `<div class="note bad" style="margin-top:9px"><b>Review with the vet</b>${esc(fib.note)}</div>`;
  else if (fib.note && !fib.advice) fibHtml += `<p class="sub">${esc(fib.note)}</p>`;

  const pct=Math.min(Math.abs(off)/s.maxCumulativeG,1)*50;
  const gauge=`<div class="gauge"><div class="mid"></div><div class="fill" style="${off>=0?`left:50%;width:${pct}%`:`right:50%;width:${pct}%`}"></div></div>`;

  const ctx=weekContext(today);
  const tonight=RECIPES.map(r=>{const b=bowlFor(today,r.id,s,S.changes,{});
    return row(r.short,b.darfG+' g');}).join('');

  return bannerHtml()+'<h2 class="screen">Status</h2>'+panel('Vet items',vetHtml)+
    panel("This week's ration",advHtml+windows)+panel('Pro-Fibre',fibHtml)+`<div class="card">
    <div class="sec"><p class="lab">Weight</p>
      ${latest?`${row(`Latest, ${fmtShort(latest.date)}`,`${latest.kg.toFixed(2)} kg`)}`:'<p class="muted">No weights yet.</p>'}
      ${meanRows(today,true)}
    </div>
    <div class="sec"><p class="lab">Condition</p>
      ${meanRows(today,false)}
      <p class="sub">Excellent range 4.5–5.5; ideal centre 5.0. Body condition is subjective. Scores in this range do not alone call for a ration change. Weight-trend reductions retain the configured hold at or below ${s.bcsHoldAtOrBelow}.</p>
    </div>
    <div class="sec"><p class="lab">Corrective offset</p>${gauge}
      <p class="sub">${off>=0?'+':'&minus;'}${Math.abs(off)} g of the plus or minus ${s.maxCumulativeG} g cap</p>
      ${S.changes.length?S.changes.slice(-4).reverse().map(c=>`${row(`${fmtShort(c.date)} &middot; ${esc(c.source||'manual')}`,`${c.deltaG>=0?'+':'&minus;'}${Math.abs(c.deltaG)} g`)}`).join(''):'<p class="muted">No changes recorded.</p>'}
      <p class="sub">Oil changes adjust the base ration, not this offset.</p>
    </div>
  </div>`+panel('This week against last',ctx)+panel('Tonight by recipe',tonight);
}

function weekContext(today){
  const end=toDay(today);
  const agg=(from,to)=>{
    let wm=0,wk=0,am=0,n=0,kn=0,an=0,cl=0,lf=0,rf=0,tr=0,tn=0,eg=0,br=0,fi=0,oi=0;
    for (let d=from;d<=to;d++){
      const day=S.days[toIso(d)]; if (!day) continue;
      if (Number.isFinite(day.walkMin)){wm+=day.walkMin;n++;}
      if (Number.isFinite(day.walkKm)){wk+=day.walkKm;kn++;}
      if (Number.isFinite(day.activeMin)){am+=day.activeMin;an++;}
      if (Number.isFinite(day.treats)){tr+=day.treats;tn++;}
      const m=day.meal||{};
      if (m.bowl==='cleared')cl++; else if (m.bowl==='left')lf++; else if (m.bowl==='refused')rf++;
      if (m.egg)eg++; if (m.broth)br++; if (m.fibreGiven===true)fi++; if (m.oilGiven===true)oi++;
    }
    return {wm:n?wm/n:null,wk:kn?wk/kn:null,am:an?am/an:null,n,cl,lf,rf,tr:tn?tr/tn:null,eg,br,fi,oi};
  };
  const a=agg(end-6,end), b=agg(end-13,end-7);
  const d=(x,y)=> (x!=null&&y!=null&&y>0)?` &middot; ${x>=y?'+':''}${((x-y)/y*100).toFixed(0)}%`:'';
  return `
    ${row(`Walk minutes`,`${a.wm!=null?a.wm.toFixed(0):'--'}${d(a.wm,b.wm)}`)}
    ${row(`Kilometres`,`${a.wk!=null?a.wk.toFixed(1):'--'}${d(a.wk,b.wk)}`)}
    ${row(`Active minutes`,`${a.am!=null?a.am.toFixed(0):'--'}${d(a.am,b.am)}`)}
    ${row(`Bowl`,`${a.cl} cleared, ${a.lf} left, ${a.rf} refused`)}
    ${row(`Treats a day`,`${a.tr!=null?a.tr.toFixed(1):'--'}`)}
    ${row(`Egg / broth nights`,`${a.eg} / ${a.br}`)}
    ${row(`Fibre / oil confirmed`,`${a.fi} / ${a.oi}`)}
    <p class="sub">Context for reading a drift. None of it is ever an input to the advice.</p>`;
}

/* HISTORY */
function viewHistory(){
  const today=localToday(), s=S.settings;
  const range=S.range||28;
  const from=Math.max(toDay(s.startDate), toDay(today)-range+1);
  const isos=[]; for (let d=from;d<=toDay(today);d++) isos.push(toIso(d));

  const chips=[14,28,56,9999].map(r=>`<button ${choice(r===range,'chip')} data-act="range" data-r="${r}">${r===9999?'All':r}</button>`).join('');
  const W=weightsList().filter(w=>toDay(w.date)>=from);
  const B=isos.map(i=>({date:i,v:(S.days[i]||{}).bcs})).filter(x=>Number.isFinite(x.v));

  const rows=isos.slice().reverse().map(i=>{
    const d=S.days[i]||{}, st=(d.stools||[]);

    const m=d.meal||{}, r=m.recipe?RECIPES.find(x=>x.id===m.recipe):null;

      <td>${Number.isFinite(d.bcs)?d.bcs:'--'}</td>
      <td>${r?r.short:'--'}<div class="sub">${mealSummary(m)}</div></td>
      <td>${m.darfFed??m.darfPlanned??'--'}</td>
      <td>${esc(m.bowl||'--')}</td>
      <td>${(d.events||[]).length?'&#9679;':''}</td></tr>`;
  }).join('');

  return bannerHtml()+`
  <h2 class="screen">Data</h2>
  <div class="chips" style="margin-bottom:12px">${chips}</div>
  <div class="card"><div class="sec"><p class="lab">Weight, kg</p>${lineChart(W.map(w=>({x:toDay(w.date),y:w.kg})),'kg')}</div>
    <div class="sec"><p class="lab">Condition</p>${lineChart(B.map(b=>({x:toDay(b.date),y:b.v})),'bcs',[3,7],s.bcsTarget)}</div>
    <div class="sec"><p class="lab">Stools</p>${stoolChart(isos)}</div></div>
  <div class="card"><div class="sec"><p class="lab">By recipe</p>${foodTable(isos,false)}</div>
    <div class="sec"><p class="lab">By extra</p>${foodTable(isos,true)}</div></div>
  <div class="card tw"><table><thead><tr><th>Date</th><th>Worst</th><th>kg</th><th>BCS</th><th>Meal</th><th>DARF</th><th>Bowl</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function chartLabels(x0,x1){
  return [x0,x1].map((v,i)=>`<text x="${i?590:42}" y="163" text-anchor="${i?'end':'start'}" fill="var(--ink-3)" font-size="11">${fmtShort(toIso(v))}</text>`).join('');
}
function chartTicks(values,py,format){
  return values.map(v=>`<line x1="42" y1="${py(v)}" x2="590" y2="${py(v)}" stroke="var(--rule)"/><text x="36" y="${py(v)+4}" text-anchor="end" fill="var(--ink-3)" font-size="11">${format(v)}</text>`).join('');
}
function lineChart(pts, kind, forceRange, targetLine){
  if (pts.length<2) return '<p class="muted">Not enough data to plot yet.</p>';
  const W=600,H=170,L=42,R=10,T=12,Bm=26;
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  let lo=forceRange?forceRange[0]:Math.min(...ys), hi=forceRange?forceRange[1]:Math.max(...ys);
  if (!forceRange){ const pad=Math.max((hi-lo)*0.18,kind==='kg'?0.15:0.4); lo-=pad; hi+=pad; }
  const x0=Math.min(...xs), x1=Math.max(...xs);
  const px=v=>L+((v-x0)/Math.max(x1-x0,1))*(W-L-R);
  const py=v=>T+(1-(v-lo)/Math.max(hi-lo,0.0001))*(H-T-Bm);
  const ticks=chartTicks([lo,(lo+hi)/2,hi],py,v=>v.toFixed(kind==='kg'?2:1));
  const line=pts.map((p,i)=>`${i?'L':'M'}${px(p.x).toFixed(1)},${py(p.y).toFixed(1)}`).join('');
  const dots=pts.map(p=>`<circle cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="2.6" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"/>`).join('');
  const tgt=targetLine!=null?`<line x1="${L}" y1="${py(targetLine).toFixed(1)}" x2="${W-R}" y2="${py(targetLine).toFixed(1)}" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="4 3"/>`:'';
  const marks=S.changes.filter(c=>toDay(c.date)>=x0&&toDay(c.date)<=x1).map(c=>
    `<line x1="${px(toDay(c.date)).toFixed(1)}" y1="${T}" x2="${px(toDay(c.date)).toFixed(1)}" y2="${H-Bm}" stroke="var(--watch)" stroke-width="1" stroke-dasharray="3 3"/>`).join('');
  const lbl=chartLabels(x0,x1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${kind==='kg'?'Weight':'Body condition'} over time">
    ${ticks}${tgt}${marks}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>${dots}${lbl}</svg>
    ${targetLine!=null?'<p class="legend">Dashed line marks the ideal centre. The excellent range is 4.5–5.5.</p>':'<p class="legend">Amber dashes mark a recorded ration change.</p>'}`;
}

function stoolChart(isos){
  const all=[];
  isos.forEach(i=>((S.days[i]||{}).stools||[]).forEach(s=>all.push({d:toDay(i),m:minsOf(s.time),b:s.bristol,mu:s.mucus,bl:s.blood})));
  if (!all.length) return '<p class="muted">No stools logged in this range.</p>';
  const W=600,H=170,L=42,R=10,T=12,Bm=26;
  const x0=toDay(isos[0]), x1=toDay(isos[isos.length-1]);
  const px=v=>L+((v-x0)/Math.max(x1-x0,1))*(W-L-R);
  const py=m=>T+(m/1440)*(H-T-Bm);
  const band=`<rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-Bm}" fill="var(--surface-2)" opacity="0.5"/>`;
  const hours=chartTicks([0,6,12,18,24],h=>py(h*60),h=>String(h).padStart(2,'0'));
  const col={g:'var(--good)',a:'var(--watch)',r:'var(--alert)'};
  const dots=all.map(s=>{
    const c=col[bandOfBristol(s.b)];
    const ring=(s.mu||s.bl)?`<circle cx="${px(s.d).toFixed(1)}" cy="${py(s.m).toFixed(1)}" r="6" fill="none" stroke="${s.bl?'var(--alert)':'var(--watch)'}" stroke-width="1.4"/>`:'';
    return `<circle cx="${px(s.d).toFixed(1)}" cy="${py(s.m).toFixed(1)}" r="3.4" fill="${c}"/>${ring}`;
  }).join('');
  const lbl=chartLabels(x0,x1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Every stool by date and time of day, coloured by Bristol type">
    ${band}${hours}${dots}${lbl}</svg>
    <p class="legend">Time of day up the side. Green is Bristol 3 to 4, amber 2, 5 and 6, red 1 and 7. A ring marks mucus or blood.</p>`;
}

function foodStats(isos){
  return cached('food-'+isos[0]+'-'+isos.at(-1),()=>{
    const stats=Object.create(null);
    const get=k=>stats[k]??={n:0,sum:0,cnt:0,loose:0,mucus:0};
    const keys=m=>[m.recipe,...['egg','broth','fibreGiven','oilGiven'].filter(k=>m[k]===true),...(m.egg===false&&m.broth===false?['none']:[])];
    const dates=new Set(isos), meals=mealsList();
    for(const m of meals) if(dates.has(m.date)) for(const k of keys(m)) get(k).n++;
    for(const iso of isos) for(const stool of S.days[iso]?.stools||[]){
      const at=attributionFor(iso,stool.time,meals,S.settings,stool.mealOverride);
      if(!at.primary||at.assumed) continue;
      for(const k of keys(at.primary)){
        const x=get(k);x.sum+=stool.bristol;x.cnt++;
        if(stool.bristol>=5)x.loose++;if(stool.mucus)x.mucus++;
      }
    }
    return {get};
  });
}
function foodTable(isos,extras){
  const {get}=foodStats(isos), labels=extras?[...Object.entries(MEAL_FLAGS),['none','Neither egg nor broth']]:RECIPES.map(r=>[r.id,r.short]);
  const rows=labels.map(([k,label])=>{
    const x=get(k), mean=x.cnt?x.sum/x.cnt:null;
    const read=!x.n?'not yet fed':x.loose>=2?'repeated loose stool':mean>4.5?'trending loose':'fine';
    return `<tr><td>${label}</td><td>${x.n}</td><td>${mean?.toFixed(1)??'--'}</td><td>${x.loose}</td>${extras?'':`<td>${x.mucus}</td><td>${read}</td>`}</tr>`;
  }).join('');
  return `<div class="tw"><table><thead><tr><th>${extras?'Extra':'Recipe'}</th><th>Nights</th><th>Mean stool</th><th>5+</th>${extras?'':'<th>Mucus</th><th>Read</th>'}</tr></thead><tbody>${rows}</tbody></table></div>${extras?'<p class="legend">Unknown historical flags are excluded. Neither requires a confirmed No for both egg and broth.</p>':''}`;
}

/* EXPORT */
function download(name, text, type){
  const blob=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function monthIsos(ym){
  return Object.keys(S.days).filter(d=>d.startsWith(ym)).sort();
}
function csvCell(v){
  let s=String(v??'');
  if(typeof v==='string'&&/^[\s]*[=+\-@\t\r]/.test(s)) s="'"+s;
  return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
