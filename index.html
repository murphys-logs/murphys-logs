function validateBackup(data){
  const check=(ok,where)=>{if(!ok) throw Error('Invalid backup: '+where);};
  const date=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&Number.isFinite(toDay(v))&&toIso(toDay(v))===v;
  const id=v=>typeof v==='string'&&v.length>0&&v.length<1500&&!/[\/]/.test(v)&&v!=='.'&&v!=='..';
  const visit=(v,depth=0)=>{
    check(depth<32,'nesting too deep');
    if(v&&typeof v==='object') for(const [k,x] of Object.entries(v)){
      check(!['__proto__','constructor','prototype'].includes(k),'unsafe field name'); visit(x,depth+1);
    }
  };
  const fields=(v,names,test,where)=>{
    for(const k of names.split(' ')) if(v[k]!=null) check(test(v[k]),where+'.'+k);
  };
  const num=v=>Number.isFinite(v)&&v>=0, bool=v=>typeof v==='boolean', str=v=>typeof v==='string';
  visit(data); check(object(data)&&object(data.days),'days');
  for(const [iso,d] of Object.entries(data.days)){
    check(date(iso)&&object(d),'day '+iso);
    fields(d,'date',v=>v===iso,iso); fields(d,'updatedAt',v=>str(v)&&Number.isFinite(Date.parse(v)),iso);
    fields(d,'notes',str,iso); fields(d,'weightMissed',bool,iso);
    fields(d,'weight',v=>Number.isFinite(v)&&v>0,iso);
    fields(d,'bcs',v=>Number.isFinite(v)&&v>=1&&v<=9,iso);
    fields(d,'walkMin walkKm activeMin treats',num,iso);
    if(d.events!=null) check(Array.isArray(d.events)&&d.events.every(str),iso+'.events');
    if(d.stools!=null){
      check(Array.isArray(d.stools),iso+'.stools'); const ids=new Set();
      for(const s of d.stools){
        check(object(s)&&Number.isInteger(s.bristol)&&s.bristol>=1&&s.bristol<=7,iso+'.stool');
        fields(s,'id',id,iso); fields(s,'time',v=>str(v)&&/^([01]\d|2[0-3]):[0-5]\d$/.test(v),iso);
        fields(s,'mucus blood',bool,iso); fields(s,'mealOverride',date,iso);
        if(s.id!=null){check(!ids.has(s.id),iso+'.duplicate stool id');ids.add(s.id);}
      }
    }
    if(d.meal!=null){
      check(object(d.meal),iso+'.meal');
      fields(d.meal,'recipe bowl fedAt',str,iso+'.meal');
      fields(d.meal,'darfPlanned darfFed oilMl fibreG',num,iso+'.meal');
      fields(d.meal,'egg broth fibreGiven oilGiven',bool,iso+'.meal');
    }
  }
  if(data.changes!=null){
    check(Array.isArray(data.changes),'changes'); const ids=new Set();
    for(const c of data.changes){
      check(object(c)&&id(c.id)&&date(c.date)&&Number.isFinite(c.deltaG)&&!ids.has(c.id),'change');ids.add(c.id);
      fields(c,'reason source',str,'change'); fields(c,'refused',bool,'change');
    }
  }
  if(data.settings!=null){
    check(object(data.settings),'settings');
    for(const [k,v] of Object.entries(DEFAULTS)) if(typeof v==='number') fields(data.settings,k,Number.isFinite,'settings');
    fields(data.settings,'startDate',date,'settings'); fields(data.settings,'theme',str,'settings');
    for(const [key,unit] of [['oilSchedule','ml'],['fibreSchedule','g']]) if(data.settings[key]!=null)
      check(Array.isArray(data.settings[key])&&data.settings[key].every(v=>object(v)&&date(v.from)&&num(v[unit])),key);
    if(data.settings.regimeChanges!=null) check(Array.isArray(data.settings.regimeChanges)&&data.settings.regimeChanges.every(date),'regimeChanges');
  }
  return data;
}
let importing=false;
async function importJson(file){
  if(importing) return; importing=true;
  try{
    if(file.size>10*1024*1024) throw Error('Backup exceeds 10 MB; split it into smaller backups.');
    const data=validateBackup(JSON.parse(await file.text())), items=[];
    for(const [iso,day] of Object.entries(data.days)){
      const cur=S.days[iso];
      if(!cur||(day.updatedAt||'')>(cur.updatedAt||'')) items.push({col:'days',id:iso,patch:day,restore:true});
    }
    const n=items.length;
    for(const c of data.changes||[]) if(!S.changes.some(x=>x.id===c.id)) items.push({col:'changes',id:c.id,patch:c,restore:true});
    const settings=Object.fromEntries(Object.entries(data.settings||{}).filter(([k])=>!Object.hasOwn(S.savedSettings||{},k)));
    if(Object.keys(settings).length) items.push({col:'settings',id:'main',patch:settings,restore:true});
    if(items.length&&!await write({items})) return;
    S.banner={kind:'good',title:'Import saved locally',text:`${n} days accepted. Existing newer days, change IDs and settings were kept. Sync will check the server again before merging.`};
    render();
  }catch(e){S.banner={kind:'bad',title:'Import failed',text:String(e.message||e)};render();}
  finally{importing=false;}
}

/* SELF-TESTS */
function selfTest(){
  const L=[]; let p=0,f=0;
  const ok=(n,g,w)=>{ const good=JSON.stringify(g)===JSON.stringify(w);
    good?p++:f++; L.push(`${good?'PASS':'FAIL'}  ${n}${good?'':`\n      got ${JSON.stringify(g)} want ${JSON.stringify(w)}`}`); };
  const s={...DEFAULTS};
  const adjust=(weights,options={})=>computeDarfAdjustment({weights,asOf:'2026-09-14',settings:s,...options});
  const ser=(start,n,kg)=>Array.from({length:n},(_,i)=>({date:toIso(toDay(start)+i),kg}));
  const prev=ser('2026-08-31',7,18.80);

  L.push('RATION at 8 ml');
  const w8={lamb:123,fish:153,turkey:147,tripe:127,beef:127,salmon:129,duck:85};
  RECIPES.forEach(r=>ok(r.short, bowlFor('2026-09-14',r.id,s,[],{}).darfG, w8[r.id]));
  L.push('RATION at 4 ml, from 28 Sept');
  const w4={lamb:130,fish:160,turkey:153,tripe:134,beef:134,salmon:129,duck:92};
  RECIPES.forEach(r=>ok(r.short, bowlFor('2026-09-28',r.id,s,[],{}).darfG, w4[r.id]));
  L.push('THE OIL STEP');
  ok('Lamb rises 7 g', bowlFor('2026-09-28','lamb',s,[],{}).darfG - bowlFor('2026-09-27','lamb',s,[],{}).darfG, 7);
  ok('energy within 3 kcal', Math.abs(bowlFor('2026-09-28','lamb',s,[],{}).totalKcal-1240)<=3, true);
  ok('Salmon unmoved', bowlFor('2026-09-28','salmon',s,[],{}).darfG, bowlFor('2026-09-27','salmon',s,[],{}).darfG);
  ok('adjustment applies', bowlFor('2026-09-14','lamb',s,[{date:'2026-09-14',deltaG:-5}],{}).darfG, 118);
  ok('ration floor', bowlFor('2026-09-14','duck',s,[{date:'2026-09-14',deltaG:-200}],{}).darfG, s.darfMinG);

  L.push('WEEKLY RULE');
  const at=(p2)=>adjust([...prev,...ser('2026-09-07',7,+(18.80*(1+p2/100)).toFixed(3))]).adjustmentG;
  ok('1.0% gain reduces ration by 5 g', adjust([...prev,...ser('2026-09-07',7,18.988)]).adjustmentG, -5);
  ok('1.1% gives 6 g', at(1.1), -6);
  ok('1.8% gives 9 g', at(1.8), -9);
  ok('3.0% capped at 15 g', at(3.0), -15);
  ok('0.74% does nothing', adjust([...prev,...ser('2026-09-07',7,18.939)]).applied, false);
  ok('4 weigh-ins not enough', adjust([...ser('2026-08-31',4,18.80),...ser('2026-09-07',4,18.988)]).applied, false);
  ok('5 weigh-ins enough', adjust([...ser('2026-08-31',5,18.80),...ser('2026-09-07',5,18.988)]).applied, true);

  L.push('CONDITION HOLD');
  const up=[...prev,...ser('2026-09-07',7,+(18.80*1.015).toFixed(3))];
  const dn=[...prev,...ser('2026-09-07',7,+(18.80*0.985).toFixed(3))];
  ok('BCS 4.3 holds', adjust(up,{bcs7dMean:4.3}).held, true);
  ok('BCS 5.0 holds', adjust(up,{bcs7dMean:5.0}).held, true);
  ok('BCS 5.07 releases', adjust(up,{bcs7dMean:5.07}).applied, true);
  ok('increases never held', adjust(dn,{bcs7dMean:4.3}).applied, true);

  L.push('FIX 1, the clamp never reverses');
  [45,50,60].forEach(o=>ok(`offset ${o}`, adjust(dn,{currentOffsetG:o}).adjustmentG>=0, true));
  L.push('FIX 2, the hold outranks the cap');
  ok('reports the hold', adjust(up,{currentOffsetG:-40,bcs7dMean:4.3}).held, true);
  L.push('CLAMP, normal');
  ok('offset 35 to +5', adjust(dn,{currentOffsetG:35}).adjustmentG, 5);
  ok('offset 40 nothing', adjust(dn,{currentOffsetG:40}).applied, false);
  L.push('WEEK KEYING');
  ok('Monday of a Sunday', toIso(mondayOf('2026-09-20')), '2026-09-14');
  ok('already fired', adjust(up,{lastAdjustmentWeek:'2026-09-16',bcs7dMean:6}).applied, false);
  ok('regime change suppresses', adjust(up,{bcs7dMean:6,regimeChanges:['2026-09-09']}).applied, false);

  L.push('ATTRIBUTION, 6 hour floor');
  const meals=[{date:'2026-09-09',fedAt:'19:00',recipe:'beef'},{date:'2026-09-10',fedAt:'19:00',recipe:'turkey'},{date:'2026-09-11',fedAt:'19:00',recipe:'lamb'}];
  ok('morning to last night', attributionFor('2026-09-12','07:10',meals,s).primary.date, '2026-09-11');
  ok('21:30 skips tonight', attributionFor('2026-09-11','21:30',meals,s).primary.date, '2026-09-10');
  ok('01:30 to the evening before', attributionFor('2026-09-12','01:30',meals,s).primary.date, '2026-09-11');
  ok('override wins', attributionFor('2026-09-12','00:30',meals,s,'2026-09-11').primary.date, '2026-09-11');

  L.push('PRO-FIBRE');
  const mk=o=>{const d={};Object.entries(o).forEach(([k,v])=>{d[k]=v===null?{}:{stools:v.map(b=>({bristol:b,mucus:false,blood:false}))}});return d;};
  const d1=mk({'2026-09-05':[4],'2026-09-06':[3],'2026-09-07':null,'2026-09-08':[4],'2026-09-09':[5],'2026-09-10':[4],'2026-09-11':[3],'2026-09-12':[4],'2026-09-13':[4],'2026-09-14':[3],'2026-09-15':[4],'2026-09-16':[4]});
  const F={...s,fibreSchedule:[{from:'2026-09-04',g:2.5}]};
  ok('no stool pauses', fibreStreak(d1,'2026-09-04','2026-09-08').count, 3);
  ok('a 5 breaks it', fibreStreak(d1,'2026-09-04','2026-09-09').count, 0);
  ok('mucus breaks a day', dayVerdict({stools:[{bristol:4,mucus:true}]}), 'broken');
  ok('7 clean advises 5 g', fibreAdvice(d1,'2026-09-16',F).advice.toG, 5);
  ok('6 clean does not', fibreAdvice(d1,'2026-09-15',F).advice, null);
  const F5={...s,fibreSchedule:[{from:'2026-09-04',g:2.5},{from:'2026-09-17',g:5}]};
  const clean=(f,n)=>{const d={};for(let i=0;i<n;i++)d[toIso(toDay(f)+i)]={stools:[{bristol:4,mucus:false,blood:false}]};return d;};
  ok('never above 5 g', fibreAdvice(clean('2026-09-18',30),'2026-10-17',F5).advice, null);
  const loose={};[18,19,20].forEach((dd,i)=>{loose['2026-09-'+dd]={stools:[{bristol:i===0?4:5,mucus:false,blood:false}]}});
  ok('step back to 2.5 g', fibreAdvice(loose,'2026-09-20',F5).advice.toG, 2.5);
  const bad={};for(let i=0;i<20;i++){bad[toIso(toDay('2026-09-18')+i)]={stools:[{bristol:i%2?5:4,mucus:false,blood:false}]}}
  ok('review flag raised', fibreAdvice(bad,'2026-10-07',F5).review, true);
  ok('and still no step', fibreAdvice(bad,'2026-10-07',F5).advice, null);

  L.push('VET ITEMS');
  const vd={'2026-09-10':{stools:[{bristol:4,blood:true}]},'2026-09-12':{events:['vomited']},'2026-09-13':{events:['vomited']}};
  ok('blood listed', vetItems(vd,'2026-09-14',[],s).some(x=>/Blood/.test(x.title)), true);
  ok('blood never ages out', vetItems(vd,'2027-09-14',[],s).some(x=>/Blood/.test(x.title)), true);
  ok('lethargy ages out', vetItems({'2026-01-01':{events:['lethargic']}},'2026-09-14',[],s).length, 0);

  L.push('SCALES');
  ok('BCS steps', BCS_STEPS.map(x=>x.v), [3,4,4.5,5,5.5,6,7]);
  ok('BCS colours', BCS_STEPS.map(x=>x.band).join(''), 'ragggar');
  ok('Bristol colours', BRISTOL.slice(1).map(x=>x.band).join(''), 'raggaar');
  const bd={};[4,4,4.5,4,4.5,4,4.5].forEach((v,i)=>bd[toIso(toDay('2026-09-08')+i)]={bcs:v});
  ok('half points average', +bcsMean(bd,'2026-09-14',7).mean.toFixed(3), 4.214);

  S.testOut = `${p} passed, ${f} failed\n\n` + L.join('\n');
  render();
}

/* EVENTS */
let stoolDraft=null;
const entryDate=el=>el.dataset.date||(S.tab==='day'?S.cursor:localToday());
function finishInput(form,keep){
  const input=$('input,textarea',form);
  if (keep) input.defaultValue=input.value; else input.value=input.defaultValue;
  form.removeAttribute('data-dirty'); $('[data-confirm]',form)?.remove();
  if(renderPending) render();
  if(document.activeElement.id!==input.id) refocus(input.id);
}
async function confirmInput(form){
  if (!form.hasAttribute('data-dirty')) return;
  const el=$('input,textarea',form), k=form.dataset.key, iso=form.dataset.date, v=el.value;
  if (!el.reportValidity()) return;
  const n=v===''?null:Number(v);
  if (k!=='notes' && v!=='' && !Number.isFinite(n)) return;
  if (k==='weight'&&n!==null){
    const m=windowMean(weightsList(),toDay(iso)-1,7);
    if (m.mean&&Math.abs(n-m.mean)/m.mean>.05&&!confirm(`${n} kg differs by over 5% from the recent mean. Keep it?`)) return;
  }
  const patch=k==='notes'?{notes:v}:k==='weight'?{weight:n,weightMissed:null}:k==='darfFed'?{meal:{darfFed:n}}:{[k]:n};
  const saved=k==='setnum'?saveSettings({[form.dataset.setting]:n}):saveDay(iso,patch);
  if (await saved) finishInput(form,true);
}

document.addEventListener('click', async (ev)=>{
  const el=ev.target.closest('[data-act]'); if (!el) return;
  const a=el.dataset.act, iso=entryDate(el);
  if (['go','openday','swapcard','jump','dayshift','range','signout'].includes(a)&&!leaveDraft()) return;
  const d=S.days[iso]||{};

  if (a==='signin'){ return doSignIn(); }
  if (a==='signout'){ await signOut(auth); location.reload(); return; }
  if (a==='go'){ S.tab=el.dataset.tab; render(); return; }
  if (a==='openday'){ S.cursor=el.dataset.date; S.tab='day'; render(); return; }
  if (a==='dismiss-banner'){ S.banner=null; render(); return; }
  if (a==='swapcard'){ const wasEve=isEvening(); S.forceCard=wasEve?'morning':'evening';
    if ((S.forceCard==='evening')===(new Date().getHours()>=(S.settings.handoverHour??16))) S.forceCard=null;
    render(); return; }
  if (a==='jump'){ const k=el.dataset.k;
    if (k==='bowl'){ S.forceCard='evening'; S.cursor=toIso(toDay(localToday())-1); S.tab='day'; }
    else { S.forceCard='morning'; }
    render(); return; }
  if (a==='dayshift'){ const n=Number(el.dataset.n);
    const next=toIso(toDay(S.cursor)+n);
    if (toDay(next)>=toDay(S.settings.startDate) && toDay(next)<=toDay(localToday())) S.cursor=next;
    render(); return; }
  if (a==='range'){ S.range=Number(el.dataset.r); render(); return; }
  if (a==='theme'){ saveSettings({theme:el.dataset.t}); applyTheme(); return; }

  if (a==='bcs'){ const v=Number(el.dataset.v); saveDay(iso,{bcs: d.bcs===v?null:v}); return; }
  if (a==='event'){ const id=el.dataset.id; const cur=d.events||[];
    saveDay(iso,{events: cur.includes(id)?cur.filter(x=>x!==id):[...cur,id]}); return; }

  if (a==='saveinput'){
    if (el.disabled) return; el.disabled=true;
    await confirmInput(el.closest('[data-form]')); el.disabled=false; return;
  }
  if (a==='cancelinput'){ finishInput(el.closest('[data-form]')); return; }
  if (a==='retrysync'){ flushWrites(); return; }
  if (a==='missed'){
    if (Number.isFinite(d.weight)&&!confirm('Replace this recorded weight with a missed marker?')) return;
    saveDay(iso,{weightMissed:d.weightMissed?null:true,weight:null}); return;
  }
  if (a==='openstool'||a==='editstool'){
    if (!leaveDraft()) return;
    const old=(d.stools||[]).find(x=>x.id===el.dataset.id);
    stoolDraft=old?{...old}:{id:'s'+crypto.randomUUID(),time:nowHHMM(),mucus:false,blood:false};
    S.adding=iso; render(true); $('#st-t')?.focus(); return;
  }
  if (a==='cancelstool'){ S.adding=null; stoolDraft=null; render(true); return; }
  if (a==='stooltype'){
    if (!stoolDraft) return;
    stoolDraft.bristol=Number(el.dataset.b);
    $$('.bristol button').forEach(b=>{const on=Number(b.dataset.b)===stoolDraft.bristol;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)}); return;
  }
  if (a==='tog-mucus'||a==='tog-blood'){
    if (!stoolDraft) return; const k=a.slice(4);
    stoolDraft[k]=!stoolDraft[k];el.classList.toggle('on',stoolDraft[k]);el.setAttribute('aria-pressed',stoolDraft[k]);return;
  }
  if (a==='savestool'){
    if (el.disabled||!stoolDraft) return;
    if (!stoolDraft.bristol){setStatus('Choose a Bristol type first','warn');return;}
    const time=$('#st-t');if (!time.reportValidity()) return;
    el.disabled=true;
    const date=S.adding, list=S.days[date]?.stools||[], next={...stoolDraft,time:time.value};
    const st=list.some(x=>x.id===next.id)?list.map(x=>x.id===next.id?next:x):[...list,next];
    if (await saveDay(date,{stools:st})){S.adding=null;stoolDraft=null;render(true);}else el.disabled=false;
    return;
  }
  if (a==='delstool'){ saveDay(iso,{stools:(d.stools||[]).filter(x=>x.id!==el.dataset.id)}); return; }
  if (a==='swapattr'){
    saveDay(iso,{stools:(d.stools||[]).map(x=>x.id===el.dataset.id?{...x,mealOverride:el.dataset.to||null}:x)}); return;
  }


  if (a==='extra'){
    const k=el.dataset.k;
    if (!Object.hasOwn(MEAL_FLAGS,k)) return;
    const meal={...d.meal,[k]:d.meal?.[k]!==true};
    if (meal.recipe) meal.darfPlanned=bowlFor(iso,meal.recipe,S.settings,S.changes,meal)?.darfG??meal.darfPlanned;
    saveDay(iso,{meal}); return;
  }
  if (a==='fed'){
    const meal=d.meal||{}, r=meal.recipe;
    if (!r||meal.fedAt) return;
    const b=bowlFor(iso,r,S.settings,S.changes,meal);
    saveDay(iso,{meal:{recipe:r,fedAt:nowHHMM(),darfPlanned:b.darfG,darfFed:b.darfG,oilMl:b.oilMl,fibreG:b.fibreG}}); return;
  }
  if (a==='unfeed'){ saveDay(iso,{meal:{fedAt:null}}); return; }
  if (a==='bowl'){
    if (!d.meal?.fedAt&&S.tab==='today'&&iso===localToday()) return;
    saveDay(iso,{meal:{bowl:d.meal?.bowl===el.dataset.k?null:el.dataset.k}}); return;
  }


  if (a==='applyadv'){
    const adv=weeklyAdvice(); if (!adv.applied) return;
    await saveChange({date:localToday(), deltaG:adv.adjustmentG, source:'rule', reason:adv.reason});
    S.banner={kind:'good',title:'Applied',text:`DARF moves ${adv.adjustmentG>0?'up':'down'} ${Math.abs(adv.adjustmentG)} g from tonight. The rule will not fire again until next Monday.`};
    render(); return; }
  if (a==='refuseadv'){
    await saveChange({date:localToday(), deltaG:0, source:'refused', refused:true, reason:'Refused: '+weeklyAdvice().reason});
    S.banner={kind:'plain',title:'Refused',text:'Nothing changed. The rule will look again next Monday.'};
    render(); return; }
  if (a==='applyfibre'){
    const g=Number(el.dataset.g);
    saveSettings({fibreSchedule:[...(S.settings.fibreSchedule||[]), {from:localToday(), g}]});
    S.banner={kind:'good',title:`Pro-Fibre now ${g} g`,text:'The streak restarts from tomorrow.'};
    render(); return; }
  if (a==='dismissfibre'){ S.banner={kind:'plain',title:'Left as it is',text:'It will come back tomorrow.'}; render(); return; }
  if (a==='setfibre'){
    const g=Number(el.dataset.g);
    if (g>S.settings.fibreRestG && !confirm(`${g} g is above the ${S.settings.fibreRestG} g ceiling the audit set. Stool that does not settle at ${S.settings.fibreRestG} g is a clinical question rather than a dose question. Set it anyway?`)) return;
    saveSettings({fibreSchedule:[...(S.settings.fibreSchedule||[]), {from:localToday(), g}]}); return; }
  if (a==='addregime'){ saveSettings({regimeChanges:[...(S.settings.regimeChanges||[]), localToday()]}); return; }
  if (a==='delregime'){ saveSettings({regimeChanges:(S.settings.regimeChanges||[]).filter(x=>x!==el.dataset.d)}); return; }
  if (a==='delchange'){ removeChange(el.dataset.id); return; }

  if (a==='exportmonth'){ exportMonthCsv(); return; }
  if (a==='exportmd'){ exportMonthMd(); return; }
  if (a==='exportall'){ exportAll(); return; }
  if (a==='selftest'){ selfTest(); return; }
  if (a==='erase'){
    if (!confirm('Delete every day and every recorded change? Settings are kept. Export first.')) return;
    if (prompt('Type ERASE to confirm')!=='ERASE') return;
    for (const k of Object.keys(S.days)) await deleteDoc(doc(db,'days',k));
    for (const c of S.changes) await deleteDoc(doc(db,'changes',c.id));
    S.banner={kind:'plain',title:'Erased',text:'Settings were kept.'}; render(); return; }
});

document.addEventListener('input',ev=>{
  const form=ev.target.closest('[data-form]');
  if (form&&!form.hasAttribute('data-dirty')){
    form.setAttribute('data-dirty','');
    form.insertAdjacentHTML('beforeend',`<div class="btnrow" data-confirm><button class="btn sm" data-act="saveinput" aria-label="Save ${esc($('label',form).textContent)}">Save</button><button class="btn ghost sm" data-act="cancelinput">Cancel</button></div>`);
  }
});


document.addEventListener('change', (ev)=>{
  const el=ev.target.closest('[data-act]');
  if (el && el.dataset.act==='import' && el.files && el.files[0]) importJson(el.files[0]);
  if(el?.dataset.act==='recipe'){
    const iso=el.dataset.date,meal=S.days[iso]?.meal||{},r=el.value;
    if(meal.recipe===r||!RECIPES.some(x=>x.id===r))return;
    const b=bowlFor(iso,r,S.settings,S.changes,meal);
    saveDay(iso,{meal:{recipe:r,darfPlanned:b.darfG,oilMl:meal.oilMl??b.oilMl,fibreG:meal.fibreG??b.fibreG}});
  }
});

$('#tabbar').addEventListener('click', (ev)=>{
  const b=ev.target.closest('button[data-tab]'); if (!b) return;
  if (!leaveDraft()) return;
  S.tab=b.dataset.tab; S.forceCard=null; if (S.tab==='day'&&!S.cursor) S.cursor=localToday();
  render();
});

/* AUTH AND BOOT */
async function doSignIn(){
  const em=$('#em').value.trim(), pw=$('#pw').value;
  const err=$('#gate-err'); err.classList.add('hide');
  if (!em||!pw){ err.textContent='Enter both an email address and a password.'; err.classList.remove('hide'); return; }
  $('#signin').disabled=true; $('#signin').textContent='Signing in…';
  try { await signInWithEmailAndPassword(auth, em, pw); }
  catch(e){
    const map={
      'auth/invalid-credential':'Sign-in details not recognised.',
      'auth/invalid-email':'That does not look like an email address.',
      'auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.',
      'auth/network-request-failed':'No connection. A first sign-in on a device needs one.'
    };
    err.textContent = map[e.code] || 'Sign-in failed. Check your details and connection, then retry.';
    err.classList.remove('hide');
  }
  finally { $('#signin').disabled=false; $('#signin').textContent='Sign in'; }
}
$('#pw').addEventListener('keydown', e=>{ if (e.key==='Enter') doSignIn(); });

onAuthStateChanged(auth, (u)=>{
  S.user=u;
  $('#gate').classList.toggle('hide', !!u);
  $('#app').classList.toggle('hide', !u);
  if (u && S.subscribed!==u.uid){ S.subscribed=u.uid; S.cursor=localToday(); subscribe(); }
  if (u) render();
});

window.addEventListener('online', ()=>flushWrites());
window.addEventListener('offline', ()=>setStatus('Offline, queued','warn'));

if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
