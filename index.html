function viewReview(){
  const today=localToday(), s=S.settings;
  const {vet,fib}=insights(), adv=weeklyAdvice();
  const off=offsetNow();
  const {range,isos,chartRange}=rangeDates(today);

  const vetHtml = vet.length
    ? vet.map(v=>`<div class="note ${v.sev==='r'?'bad':'warn'}"><b>${esc(v.title)}</b> <span class="alert-dates">${esc(formatAlertDates(v.dates,today))}</span>${v.text?`<p class="alert-detail">${esc(v.text)}</p>`:''}</div>`).join('')
    : `<p class="muted">None flagged as of ${fmtShortYear(today)}.</p>`;

  const rationDateInfo = rationAlertDateText(adv, s.regimeChanges||[]);
  let advResult;
  if (adv.applied){
    advResult = `<div class="note warn"><b>${adv.adjustmentG>0?'Increase':'Reduce'} DARF by ${Math.abs(adv.adjustmentG)} g on every recipe</b> <span class="alert-dates">${esc(rationDateInfo)}</span><p class="alert-detail">${esc(adv.reason)}</p></div>
      <div class="btnrow"><button class="btn sm" id="review-apply-ration" data-act="applyadv">Apply</button>
      <button class="btn ghost sm" id="review-keep-ration" data-act="refuseadv">Keep current ration this week</button></div>`;
  } else if (adv.held){
    advResult = `<div class="note hold"><b>Ration reduction held</b> <span class="alert-dates">${esc(rationDateInfo)}</span><p class="alert-detail">${esc(adv.reason)}</p></div>`;
  } else {
    advResult = `<div class="note plain"><b>No ration change</b> <span class="alert-dates">${esc(rationDateInfo)}</span><p class="alert-detail">${esc(adv.reason||'Not enough data yet.')}</p></div>`;
  }
  const windows = (adv.currentMean!=null&&adv.previousMean!=null) ? `
    ${row(`${fmtShortYear(adv.currentWindow[0])} to ${fmtShortYear(adv.currentWindow[1])}`,`${adv.currentMean.toFixed(2)} kg`)}
    ${row(`${fmtShortYear(adv.previousWindow[0])} to ${fmtShortYear(adv.previousWindow[1])}`,`${adv.previousMean.toFixed(2)} kg`)}
    <p class="sub">Weekly weight change: ${adv.percentChange==null?'unavailable':(adv.percentChange>=0?'+':'')+adv.percentChange.toFixed(2)+'%'} &middot; ${adv.previousN} and ${adv.currentN} weigh-ins${adv.fullCorrectionG!=null?` &middot; full correction ${Math.abs(adv.fullCorrectionG).toFixed(0)} g, damped to ${Math.abs(Math.round(adv.rawStepG))} g`:''}</p>` : '';
  const pct=Math.min(Math.abs(off)/s.maxCumulativeG,1)*50;
  const gauge=`<div class="gauge"><div class="mid"></div><div class="fill" style="${off>=0?`left:50%;width:${pct}%`:`right:50%;width:${pct}%`}"></div></div>`;
  const rationExplain = `<details class="review-disclosure" id="review-ration-details"><summary>How this ration result was calculated (${off>=0?'+':'−'}${Math.abs(off)} g current adjustment)</summary>
    <p class="sub">${esc(adv.reason||'Not enough data yet.')}</p>${windows}
    <div class="review-subsec"><p class="lab">Current DARF adjustment</p>${gauge}
      <p class="sub">${off>=0?'+':'&minus;'}${Math.abs(off)} g of the plus or minus ${s.maxCumulativeG} g cap</p>
      ${S.changes.length?S.changes.slice(-4).reverse().map(c=>`${row(`${fmtShortYear(c.date)} &middot; ${esc(c.source||'manual')}`,`${c.deltaG>=0?'+':'&minus;'}${Math.abs(c.deltaG)} g`)}`).join(''):'<p class="muted">No changes recorded.</p>'}
      <p class="sub">Oil changes adjust the base ration, not this adjustment.</p></div></details>`;

  const streakChips = fib.chips.length ? `<div class="streak">${
    Array.from({length:s.fibreStreakDays},(_,i)=>{
      const c=fib.chips[i];
      if (!c) return '<span></span>';
      return `<span class="${c.verdict}" title="${fmtShortYear(c.date)}">${c.verdict==='clean'?'&check;':c.verdict==='broken'?'&times;':'&ndash;'}</span>`;
    }).join('')}</div>` : '';

  let fibResult = row('Current dose',`${fib.dose} g${fib.since?` · since ${fmtShortYear(fib.since)}`:''}`);
  if (fibreAdviceVisible(fib)) fibResult += `<div class="note warn" style="margin-top:9px"><b>${fib.advice.kind==='up'?'Step up':'Step back'}</b> <span class="alert-dates">${fmtShortYear(today)}${fib.since?` · dose since ${fmtShortYear(fib.since)}`:''}</span><p class="alert-detail">${esc(fib.advice.text)}</p></div>
    <div class="btnrow"><button class="btn sm" id="review-apply-fibre" data-act="applyfibre" data-g="${fib.advice.toG}">Apply</button>
    <button class="btn ghost sm" id="review-postpone-fibre" data-act="dismissfibre">Not now</button></div>`;
  else if(fib.advice)fibResult+=`<p class="sub">Advice postponed until ${fmtShortYear(S.fibreSnoozedUntil||shiftDate(today,1))}. The current dose is unchanged.</p>`;
  if (fib.review) fibResult += `<div class="note bad" style="margin-top:9px"><b>Review with the vet</b> <span class="alert-dates">${fmtShortYear(today)}${fib.since?` · dose since ${fmtShortYear(fib.since)}`:''}</span><p class="alert-detail">${esc(fib.note)}</p></div>`;
  const fibExplain = `<details class="review-disclosure" id="review-fibre-details"><summary>Clean-day streak and Pro-Fibre rules</summary>
    ${streakChips}
    ${fib.dose < s.fibreRestG && fib.since ? `<p class="sub">${fib.streak} of ${s.fibreStreakDays} clean days since ${fmtShortYear(fib.since)}. A day with no stool pauses rather than resets.</p>` : ''}
    ${fib.note && !fib.advice && !fib.review ? `<p class="sub">${esc(fib.note)}</p>` : ''}
    ${!fib.since ? '<p class="muted">No Pro-Fibre schedule recorded.</p>' : ''}</details>`;

  // Keep observations before the displayed interval available for the first
  // partial calendar week's mean. No future measurements enter either graph.
  const W=weightsList().filter(w=>validDate(w.date)&&w.date<=today);
  const B=Object.entries(S.days).filter(([date,d])=>validDate(date)&&date<=today&&Number.isFinite(d.bcs)&&d.bcs>=1&&d.bcs<=9)
    .map(([date,d])=>({date,v:d.bcs})).sort((a,b)=>a.date.localeCompare(b.date));
  const ctx=weekContext(today);
  const tonight=RECIPES.map(r=>{const b=bowlFor(today,r.id,s,S.changes,mealDefaults(S.days[today]?.meal));
    return row(r.short,b.darfG+' g');}).join('');
  const rangeLabel=range===9999?'All recorded days':`Last ${range} days`;

  return '<h2 class="screen">Review</h2><p class="sub range-note" id="review-data-context">Based on records available on this device. Missing records or changes waiting to sync can change these results.</p>'+
    panel('Vet items',vetHtml)+
    panel("This week’s ration",`<div id="review-ration-result" data-review-result role="group" aria-label="This week’s ration result" tabindex="-1">${advResult}</div>`+rationExplain)+
    panel('Pro-Fibre',`<div id="review-fibre-result" data-review-result role="group" aria-label="Pro-Fibre result" tabindex="-1">${fibResult}</div>`+fibExplain)+
    `<details class="card weight-condition" id="review-weight-condition"><summary class="sec">Weight &amp; condition <span class="assessment-strip" data-weight-strip data-date="${today}">${weightConditionStrip(today)}</span></summary><div class="sec"><div data-weight-summary="body" data-date="${today}">${weightConditionContent(today,false)}</div><div class="review-subsec"><p class="lab">Weight averages</p>${meanRows(today,true,[14,28])||'<p class="muted">No readings in the last 28 days.</p>'}</div><div class="review-subsec"><p class="lab">Condition averages</p>${meanRows(today,false,[14,28])||'<p class="muted">No readings in the last 28 days.</p>'}<p class="sub">Excellent range 4.5–5.5; ideal centre 5.0. Body Condition Score (BCS) directly governs weekly DARF ration adjustments, while weight trends and the 5-entry mean are tracked for ongoing health monitoring.</p></div></div></details>`+
    `<details class="card" id="review-week-context"><summary class="sec">This week against last <span class="fold-strip">Walks, bowl, treats and extras</span></summary><div class="sec">${ctx}</div></details>`+
    `<details class="card" id="review-trends"><summary class="sec">Trends &amp; charts <span class="fold-strip">${rangeLabel} · weight, condition and stools</span></summary><div class="sec"><div class="chips data-range" role="group" aria-label="Trend range" aria-describedby="trend-range-note">${rangeChips(range,'range')}</div><p class="sub range-note" id="trend-range-note">Applies to History and Review.</p><p class="lab">Weight, kg</p><p class="chart-summary">Target ${WEIGHT_TARGET_TEXT} · acceptable range ${WEIGHT_RANGE_TEXT}.</p>${lineChart(W.map(w=>({x:toDay(w.date),y:w.kg})),'kg',null,null,chartRange)}</div><div class="sec"><p class="lab">Condition</p>${lineChart(B.map(b=>({x:toDay(b.date),y:b.v})),'bcs',[3,7],5.0,chartRange)}</div><div class="sec"><p class="lab">Stools</p>${stoolChart(isos)}</div></details>`+
    `<details class="card" id="review-comparisons"><summary class="sec">Food &amp; recipe comparisons <span class="fold-strip">${rangeLabel} · by recipe, extra and tonight’s DARF</span></summary><div class="sec"><div class="chips data-range" role="group" aria-label="Comparison range" aria-describedby="comp-range-note">${rangeChips(range,'comp-range')}</div><p class="sub range-note" id="comp-range-note">Applies to History and Review.</p><p class="lab">By recipe</p>${foodTable(isos,false)}</div><div class="sec"><p class="lab">By extra</p>${foodTable(isos,true)}</div><div class="sec"><p class="lab">Tonight by recipe</p>${tonight}</div></details>`;
}

function weekContext(today){
  const end=toDay(today);
  const agg=(from,to)=>{
    let wm=0,wk=0,am=0,n=0,kn=0,an=0,cl=0,lf=0,rf=0,tr=0,tn=0,eg=0,br=0,fi=0,oi=0;
    for (let d=from;d<=to;d++){
      const day=S.days[toIso(d)]; if (!day) continue;
      if (Number.isFinite(day.walkMin)){wm+=day.walkMin;n++;}
      if (Number.isFinite(day.walkKm)){wk+=day.walkKm;kn++;}
      if (Number.isFinite(day.activeMin)){am+=day.activeMin;an++;}
      if (Number.isFinite(day.treats)){tr+=day.treats;tn++;}
      const m=day.meal||{};
      if (m.bowl==='cleared')cl++; else if (m.bowl==='left')lf++; else if (m.bowl==='refused')rf++;
      if (m.egg)eg++; if (m.broth)br++; if (m.fibreGiven===true)fi++; if (m.oilGiven===true)oi++;
    }
    return {wm:n?wm/n:null,wk:kn?wk/kn:null,am:an?am/an:null,n,cl,lf,rf,tr:tn?tr/tn:null,eg,br,fi,oi};
  };
  const a=agg(end-6,end), b=agg(end-13,end-7);
  const d=(x,y)=> (x!=null&&y!=null&&y>0)?` &middot; ${x>=y?'+':''}${((x-y)/y*100).toFixed(0)}%`:'';
  return `
    ${row(`Walk minutes`,`${a.wm!=null?a.wm.toFixed(0):'--'}${d(a.wm,b.wm)}`)}
    ${row(`Kilometres`,`${a.wk!=null?a.wk.toFixed(1):'--'}${d(a.wk,b.wk)}`)}
    ${row(`Active minutes`,`${a.am!=null?a.am.toFixed(0):'--'}${d(a.am,b.am)}`)}
    ${row(`Bowl`,`${a.cl} cleared, ${a.lf} left, ${a.rf} refused`)}
    ${row(`Treats a day`,`${a.tr!=null?a.tr.toFixed(1):'--'}`)}
    ${row(`Egg / broth nights`,`${a.eg} / ${a.br}`)}
    ${row(`Fibre / oil confirmed`,`${a.fi} / ${a.oi}`)}
    <p class="sub">Context for reading a drift. None of it is ever an input to the advice.</p>`;
}

/* HISTORY */
function dateHasHiddenDraft(iso){
  if(!S.user||draftUser!==S.user.uid)return false;
  return draftFields.some(f=>f.key!=='setnum'&&f.date===iso)||draftStools.some(s=>s.date===iso);
}
function viewHistory(){
  const today=localToday(), yesterday=shiftDate(today,-1), tomorrow=shiftDate(today,1);
  const {range,isos}=rangeDates(today);
  const displayIsos=isos.slice();
  // Today's confirmed meal belongs to tomorrow's tracking group. This is only
  // a display row; it must not create or open a future daily record.
  if(trackingMeal(tomorrow)) displayIsos.push(tomorrow);
  // Imported date mistakes must remain inspectable without being moved or
  // silently corrected. Only All includes saved dates beyond today.
  if(range===9999){
    const dates=Object.keys(S.days);
    displayIsos.push(...dates.filter(validDate),...dates.filter(i=>isFedMeal(S.days[i].meal)).map(i=>shiftDate(i,1)));
  }

  const cards=[...new Set(displayIsos)].sort().reverse().map(i=>{
    const canOpen=i<=today||Object.hasOwn(S.days,i), d=S.days[i]||{}, st=(d.stools||[]);
    const scores=st.map(x=>x.bristol).filter(Number.isFinite),lo=scores.length?Math.min(...scores):null,hi=scores.length?Math.max(...scores):null;
    const prevIso=shiftDate(i,-1), m=trackingMeal(i), r=m?RECIPES.find(x=>x.id===m.recipe):null;
    const blood=st.some(x=>x.blood),mucus=st.some(x=>x.mucus),band=blood||scores.some(n=>n===1||n===7)?'r':mucus||scores.some(n=>n<3||n>4)?'a':scores.length?'g':'';
    const stoolText=!st.length?'<span class="diary-empty">No stools logged</span>':
      `<span class="diary-val"><span class="dot ${band}" aria-hidden="true"></span>${st.length} ${st.length===1?'stool':'stools'} · ${lo===null?'type not recorded':lo===hi?`Type ${lo}`:`Types ${lo}–${hi}`}</span>`;
    const stoolFlags=blood||mucus?` <span class="diary-flags">${blood?'<strong class="flag-blood">Blood</strong>':''}${blood&&mucus?' · ':''}${mucus?'<strong class="flag-mucus">Mucus</strong>':''}</span>`:'';
    const weightVal=d.weightMissed===true?'<span class="diary-val">Missed</span>':recordedWeight(d)!==null?
      `<span class="diary-val">${weightNumber(d.weight)} kg</span> <span class="diary-flags" data-weight-status="${weightAssessment(d.weight).status}">${weightAssessment(d.weight).label}</span>`:'<span class="diary-empty">Not recorded</span>';
    const bcsVal=Number.isFinite(d.bcs)?`<span class="diary-val">BCS ${d.bcs}</span>`:'<span class="diary-empty">Not recorded</span>';
    const events=(d.events||[]).map(id=>EVENTS.find(e=>e.id===id)?.label||id).join(' · ');
    const previewTag=i===tomorrow?'Tomorrow’s tracking':'Future tracking';
    const previewMuted=i===tomorrow?'Opens tomorrow':'Future date';
    const relTag=i===today?'Today':i===yesterday?'Yesterday':!canOpen?previewTag:'';
    const draftBadge=canOpen&&dateHasHiddenDraft(i)?' <span class="diary-draft">Unsaved changes</span>':'';
    const head=canOpen
      ?`<button class="diary-open" id="open-day-${i}" data-act="openday" data-date="${i}" aria-label="Open log for ${historyDateLabel(i)}${draftBadge?', has unsaved changes':''}"><span class="diary-date">${historyDateLabel(i)}${relTag?` <span class="diary-tag">${relTag}</span>`:''}${draftBadge}</span> <span class="diary-action" aria-hidden="true">Open ›</span></button>`
      :`<div class="diary-open"><span class="diary-date">${historyDateLabel(i)} <span class="diary-tag">${previewTag}</span></span> <span class="diary-muted">${previewMuted}</span></div>`;
    const mealAmount=m?(m.darfFed!=null?`${esc(m.darfFed)} g DARF`:m.darfPlanned!=null?`${esc(m.darfPlanned)} g DARF planned`:'Amount not recorded'):'';
    const bowlText=m?(m.bowl?`Bowl: ${esc(bowlLabel(m.bowl))}`:'Bowl not recorded'):'';
    const mealBlock=m
      ?`<div class="diary-meal" data-meal-date="${m.date}"><span class="diary-meal-k">Preceding meal · ${fmtShortYear(m.date)} at ${esc(m.fedAt)}</span> <span class="diary-meal-v">${esc(r?.short||m.recipe)} · ${mealAmount} · ${bowlText}</span><details class="meal-disclosure" id="meal-detail-${i}"><summary>Meal details</summary>${mealSummary(m)}<button class="link" data-act="openday" data-date="${m.date}" data-target="#meal-section-${m.date}" aria-label="Edit ${esc(r?.short||m.recipe)} meal fed on ${historyDateLabel(m.date)}">Edit ${fmtShortYear(m.date)} meal</button></details></div>`
      :`<div class="diary-meal"><p class="diary-meal-empty">Preceding meal (${fmtShortYear(prevIso)}): Not recorded as fed</p></div>`;
    return `<article class="card diary-card" data-date="${i}">${head}<div class="diary-body"><dl class="diary-metrics"><div data-stool-summary><dt>Stools</dt> <dd class="${band}">${stoolText}${stoolFlags}</dd></div><div data-weight-reading><dt>Weight</dt> <dd>${weightVal}</dd></div><div data-bcs-reading><dt>Condition</dt> <dd>${bcsVal}</dd></div></dl>${events?`<p class="diary-events">Observations: <strong class="watch-text">${esc(events)}</strong></p>`:''}${mealBlock}</div></article>`;

  return `<h2 class="screen" id="history-list-heading">History</h2>

    <p class="field-error history-date-error hide" id="history-date-error" role="alert"></p>

}

function chartFrame(yLabels, drawing, marks, dates, description){
  return `<div class="chart-frame" role="img" aria-label="${esc(description)}"><div class="chart-axis" aria-hidden="true">${yLabels.map(({label,position})=>`<span style="top:${position}%">${esc(label)}</span>`).join('')}</div><div class="chart-plot" aria-hidden="true"><svg class="chart" viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false">${drawing}</svg>${marks}</div><div class="chart-dates" aria-hidden="true"><span>${fmtShortYear(dates[0])}</span><span>${fmtShortYear(dates[1])}</span></div></div>`;
}
function chartValues(kind,headers,rows){
  const label=`View ${kind} values`,id=`chart-values-${kind.replace(/\s/g,'-')}`;
  return `<details class="chart-values" id="${id}"><summary>${label}</summary><div class="tw" tabindex="0" role="region" aria-label="${esc(kind)} values"><table><caption class="hide">${esc(kind)} by date</caption><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(value=>`<td>${esc(value)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
}
function calendarWeekMeans(pts,from,to){
  const weeks=new Map();
  for(const p of pts){
    if(!Number.isInteger(p.x)||!Number.isFinite(p.y))continue;
    // x encodes a stored local YYYY-MM-DD calendar label, not a timestamp.
    // mondayOf uses that label's weekday; timezone/DST cannot shift its day.
    const start=mondayOf(toIso(p.x));
    if(start>to||start+6<from)continue;
    const week=weeks.get(start)||{start,end:start+6,sum:0,n:0};
    week.sum+=p.y;week.n++;weeks.set(start,week);
  }
  return [...weeks.values()].sort((a,b)=>a.start-b.start).map(w=>({...w,mean:w.sum/w.n}));
}
function lineChart(allPts,kind,forceRange,targetLine,dateRange){
  const weight=kind==='kg';
  if(weight)targetLine=WEIGHT_TARGET.kg;
  if(kind==='bcs')targetLine=5.0;
  const valid=allPts.filter(p=>Number.isInteger(p.x)&&Number.isFinite(p.y)).sort((a,b)=>a.x-b.x);
  const from=dateRange?.[0]??valid[0]?.x,to=dateRange?.[1]??valid.at(-1)?.x;
  const pts=valid.filter(p=>p.x>=from&&p.x<=to);
  if(!pts.length)return '<p class="muted">No readings in this range.</p>';
  const name=weight?'weight':'condition',unit=weight?' kg':'',format=v=>weight?weightNumber(v):v.toFixed(1);
  const values=chartValues(name,['Date',weight?'Weight, kg':'Condition',...(weight?['Target range']:[])],pts.map(p=>[historyDateLabel(toIso(p.x)),format(p.y),...(weight?[weightAssessment(p.y).label]:[])]));
  const weeks=calendarWeekMeans(valid,from,to),ys=pts.map(p=>p.y),minimum=Math.min(...ys),maximum=Math.max(...ys);
  const plotted=[...ys,...weeks.map(w=>w.mean),...(weight?[WEIGHT_TARGET.lowerKg,WEIGHT_TARGET.upperKg]:[])],plotMin=Math.min(...plotted),plotMax=Math.max(...plotted);
  // Half-day bounds give every date its own width, even a single recorded day.
  const x0=from-.5,x1=to+.5;
  let lo=forceRange?Math.min(forceRange[0],plotMin):plotMin,hi=forceRange?Math.max(forceRange[1],plotMax):plotMax;
  if(!forceRange){const pad=Math.max((hi-lo)*.18,kind==='kg'?.15:.4);lo-=pad;hi+=pad;}
  const px=x=>((x-x0)/Math.max(x1-x0,1))*100,py=y=>(1-(y-lo)/Math.max(hi-lo,.0001))*100;
  const ticks=[hi,(lo+hi)/2,lo],yLabels=ticks.map(y=>({label:format(y),position:py(y)}));
  const grid=ticks.map(y=>`<line x1="0" x2="100" y1="${py(y)}" y2="${py(y)}" stroke="var(--rule)" stroke-width="1"/>`).join('');
  const target=targetLine==null?'':`<line x1="0" x2="100" y1="${py(targetLine)}" y2="${py(targetLine)}" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="4 3"/>`;
  const band=weight?`<rect class="weight-target-band" x="0" y="${py(WEIGHT_TARGET.upperKg)}" width="100" height="${py(WEIGHT_TARGET.lowerKg)-py(WEIGHT_TARGET.upperKg)}"/>`:'';
  const changes=S.changes.filter(c=>toDay(c.date)>=x0&&toDay(c.date)<=x1).map(c=>`<line x1="${px(toDay(c.date))}" x2="${px(toDay(c.date))}" y1="0" y2="100" stroke="var(--watch)" stroke-width="1.5" stroke-dasharray="3 3"/>`).join('');
  const weekly=weeks.map(w=>`<line class="weekly-mean" x1="${px(Math.max(x0,w.start-.5))}" x2="${px(Math.min(x1,w.end+.5))}" y1="${py(w.mean)}" y2="${py(w.mean)}" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="7 4"/>`).join('');
  const path=pts.map((p,i)=>`${i?'L':'M'}${px(p.x).toFixed(3)},${py(p.y).toFixed(3)}`).join('');
  const points=pts.map(p=>`<span class="chart-point${weight&&weightAssessment(p.y).status!=='within'?' weight-outside':''}" title="${esc(`${historyDateLabel(toIso(p.x))}: ${format(p.y)}${unit}${weight?' · '+weightAssessment(p.y).label:''}`)}" style="left:${px(p.x)}%;top:${py(p.y)}%"></span>`).join('');
  const summary=pts.length===1?`${historyDateLabel(toIso(pts[0].x))}: ${format(pts[0].y)}${unit}. Add another reading to see a trend.`:`${pts.length} readings. ${format(pts[0].y)}${unit} on ${fmtShortYear(toIso(pts[0].x))}, ${format(pts.at(-1).y)}${unit} on ${fmtShortYear(toIso(pts.at(-1).x))}. Recorded range ${format(minimum)}–${format(maximum)}${unit}.`;
  const weeklySummary=weeks.map(w=>`${fmtShortYear(toIso(w.start))}–${fmtShortYear(toIso(w.end))}: ${format(w.mean)}${unit} from ${w.n} reading${w.n===1?'':'s'}`).join('; ');
  const targetDescription=weight?`Shaded band: ${WEIGHT_RANGE_TEXT}. Short horizontal dashes: ${WEIGHT_TARGET.kg} kg target. Square markers: outside range (${pts.filter(p=>weightAssessment(p.y).status!=='within').length} readings). `:targetLine!=null?'Short horizontal dashes mark the ideal centre. Excellent range: 4.5–5.5. ':'';
  return `<p class="chart-summary">${esc(summary)}</p>`+chartFrame(yLabels,band+grid+target+changes+`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`+weekly,points,[toIso(from),toIso(to)],`${weight?'Weight':'Body condition'} over time. ${summary} ${targetDescription}Monday–Sunday weekly means: ${weeklySummary}.`)+
    `<p class="legend"><span class="chart-key" aria-hidden="true"></span>Recorded · <span class="chart-key weekly" aria-hidden="true"></span>Weekly average (Mon–Sun). Uses recorded values for each calendar week, including days outside this view. ${targetDescription}Vertical dashes mark a recorded ration change.</p>`+values+
    chartValues(name+' weekly average',['Week, Mon–Sun',weight?'Mean, kg':'Mean BCS','Readings',...(weight?['Target range']:[])],weeks.map(w=>[`${fmtShortYear(toIso(w.start))}–${historyDateLabel(toIso(w.end))}`,format(w.mean),w.n,...(weight?[weightAssessment(w.mean).label]:[])]));
}
function stoolChart(isos){
  const all=[];
  isos.forEach(iso=>(S.days[iso]?.stools||[]).forEach(s=>all.push({iso,time:s.time||'Not recorded',minute:validTime(s.time)?minsOf(s.time):null,b:s.bristol,mucus:s.mucus,blood:s.blood})));
  if(!all.length)return '<p class="muted">No stools logged in this range.</p>';
  const dated=all.filter(s=>s.minute!==null),x0=toDay(isos[0]),x1=toDay(isos.at(-1));
  const px=iso=>x0===x1?50:(toDay(iso)-x0)/(x1-x0)*100,py=minute=>minute/1440*100;
  const yLabels=[0,6,12,18,24].map(h=>({label:String(h).padStart(2,'0')+':00',position:h/24*100}));
  const grid=yLabels.map(t=>`<line x1="0" x2="100" y1="${t.position}" y2="${t.position}" stroke="var(--rule)" stroke-width="1"/>`).join('');
  const marks=dated.map(s=>`<span class="chart-mark${s.blood?' blood':''}${s.mucus?' mucus':''}" style="left:${px(s.iso)}%;top:${py(s.minute)}%"><span class="chart-point stool-point ${bandOfBristol(s.b)}"></span></span>`).join('');
  const summary=`${all.length} stools across ${new Set(all.map(s=>s.iso)).size} days. ${all.filter(s=>s.b<3).length} hard (types 1–2), ${all.filter(s=>s.b===3||s.b===4).length} types 3–4, ${all.filter(s=>s.b>=5).length} loose (types 5–7). ${all.filter(s=>s.mucus).length} with mucus; ${all.filter(s=>s.blood).length} with blood.`;
  return `<p class="chart-summary">${esc(summary)}${dated.length<all.length?' Entries without a time appear in the values list.':''}</p>`+
    (dated.length?chartFrame(yLabels,grid,marks,[isos[0],isos.at(-1)],`Stools by date and time. ${summary}`):'')+
    `<p class="legend">● Types 3–4; ◆ types 2, 5 and 6; ■ types 1 and 7. Dashed ring: mucus. Solid ring: blood.</p>`+
    chartValues('stool',['Date','Time','Bristol','Flags'],all.map(s=>[historyDateLabel(s.iso),s.time,s.b,[s.mucus?'Mucus':'',s.blood?'Blood':''].filter(Boolean).join(', ')||'None']));
}
function foodStats(isos){
  return cached('food-'+isos[0]+'-'+isos.at(-1),()=>{
    const stats=Object.create(null);
    const get=k=>stats[k]??={n:0,sum:0,cnt:0,loose:0,hard:0,mucus:0,blood:0};
    const keys=m=>[m.recipe,...['egg','broth','fibreGiven','oilGiven'].filter(k=>m[k]===true),...(m.egg===false&&m.broth===false?['none']:[])];
    for(const iso of isos){
      const m=trackingMeal(iso);
      if(!m) continue;
      const mealKeys=keys(m);
      // Count each confirmed meal once in its tracking date, including nights
      // with no stools. Every stool on that date uses this same meal.
      for(const k of mealKeys) get(k).n++;
      for(const stool of S.days[iso]?.stools||[]) for(const k of mealKeys){
        const x=get(k);x.sum+=stool.bristol;x.cnt++;
        if(stool.bristol>=5)x.loose++;if(stool.bristol<3)x.hard++;if(stool.mucus)x.mucus++;if(stool.blood)x.blood++;
      }
    }
    return {get};
  });
}
function foodTable(isos,extras){
  const {get}=foodStats(isos), labels=extras?[...Object.entries(MEAL_FLAGS),['none','Neither egg nor broth']]:RECIPES.map(r=>[r.id,r.short]);
  const rows=labels.map(([k,label])=>{
    const x=get(k), mean=x.cnt?x.sum/x.cnt:null;
    const findings=[x.hard?'Hard stools':'',x.loose>1?'Repeated loose stools':x.loose?'Loose stool':'',x.mucus?'Mucus':'',x.blood?'Blood':''].filter(Boolean);
    const read=!x.n?'Not yet fed':!x.cnt?'No stool observations':findings.length?findings.join(' · '):'Types 3–4 only';
    return `<tr><td>${label}</td><td>${x.n}</td><td>${mean?.toFixed(1)??'—'}</td><td>${x.loose}</td>${extras?'':`<td>${x.mucus}</td><td style="white-space:normal;min-width:12rem">${read}</td>`}</tr>`;
  }).join('');
  return `<div class="tw" tabindex="0" role="region" aria-label="Stool observations by ${extras?'extra':'recipe'}"><table><thead><tr><th scope="col">${extras?'Extra':'Recipe'}</th><th scope="col">Nights</th><th scope="col">Mean stool</th><th scope="col">Types 5–7</th>${extras?'':'<th scope="col">Mucus</th><th scope="col">Observations</th>'}</tr></thead><tbody>${rows}</tbody></table></div><p class="legend">${extras?'Unknown historical flags are excluded. Neither requires a confirmed No for both egg and broth.':'Counts describe recorded observations; they do not establish that a recipe caused them.'}</p>`;
}

function exportMonthOptions(){
  const cur=localToday().slice(0,7), prev=previousMonth(), months=new Set([cur,prev]);
  for(const d of Object.keys(S.days))if(validDate(d))months.add(d.slice(0,7));
  for(const c of S.changes)if(validDate(c?.date))months.add(c.date.slice(0,7));
  const candidates=[...months];
  if(validDate(S.settings?.startDate)&&S.settings.startDate.slice(0,7)<=cur)candidates.push(S.settings.startDate.slice(0,7));
  const [cy,cm]=cur.split('-').map(Number);
  const minFill=`${String(cy-10).padStart(4,'0')}-${String(cm).padStart(2,'0')}`;
  const past=candidates.filter(ym=>ym<=cur&&ym>=minFill).sort()[0];
  if(past){
    let [y,m]=past.split('-').map(Number);
    while(y<cy||(y===cy&&m<=cm)){
      months.add(`${String(y).padStart(4,'0')}-${String(m).padStart(2,'0')}`);
      if(++m>12){m=1;y++;}
    }
  }
  return [...months].sort((a,b)=>b.localeCompare(a)).map(ym=>({
    ym,
    label:`${MON[Number(ym.slice(5,7))-1]} ${ym.slice(0,4)}${ym===cur?' (this month)':ym===prev?' (last month)':''}`
  }));
}

// Sync & storage (CR-05, FR-04): what is waiting, what the server last confirmed,

function syncSectionBody(){
  let queued=[];try{queued=queuedWrites();}catch{}
  const n=queued.length+unreadableOutbox.length,held=unreadableOutbox.length>0,setAside=setAsideOutbox().length;
  const stamps=[...queued.map(([key])=>key),...unreadableOutbox.map(u=>u.key)].map(key=>Number(queueOrder(key).split('-')[0])).filter(t=>Number.isFinite(t)&&t>0);
  const oldest=stamps.sort((a,b)=>a-b)[0];
  const waiting=n?`<b>${n} change${n===1?'':'s'} waiting</b> on this device${oldest?`, the oldest saved at ${clockText(oldest)}`:''}. `+
    (held?`<b>Sending is held</b> because ${unreadableOutbox.length===1?'one change can’t':unreadableOutbox.length+' changes can’t'} be read. Save a recovery file, then set ${unreadableOutbox.length===1?'it':'them'} aside to let the rest sync.`:
      'Keep the app open while connected to finish syncing. If it was closed, reopen it and check the sync status.'):'No changes are waiting on this device.';
  const recovery=held||setAside?`<div class="btnrow"><button class="btn ghost sm" id="settings-outbox-recovery" data-act="outboxrecovery">Save recovery file</button>${held?'<button class="btn ghost sm" id="settings-outbox-set-aside" data-act="outboxsetaside">Set aside and continue syncing</button>':''}</div>`+
    (setAside?`<p class="sub">${setAside} unreadable change${setAside===1?' is':'s are'} set aside on this device. ${setAside===1?'It is':'They are'} never sent, and ${setAside===1?'is':'are'} included in recovery files and Full backup.</p>`:''):'';
  const confirmed=S.lastConfirmed?`Last confirmed with the server at ${clockText(S.lastConfirmed)}.`:'Not yet confirmed with the server on this device.';
  const storage={persisted:'Storage is protected from automatic browser clearing. Space is still limited, and clearing website data removes local records. Save a Full backup regularly.',
    'best-effort':'Storage is not protected: this browser may clear local data under storage pressure. Keep the app on the Home Screen and save a Full backup regularly.',
    unsupported:'Storage protection cannot be checked in this browser.',unknown:'Storage protection could not be checked.'}[S.storageProtection]||'Checking storage protection…';
  const old=S.undo&&!undoSticky(S.undo)&&!S.undoBusy?`<div class="review-subsec"><h5 class="lab">Recently removed</h5>${undoNote(S.undo)}</div>`:'';
  return `<p class="chart-summary" id="settings-sync-status">${esc(S.status)}</p><p class="sub">${waiting}</p><p class="sub">${confirmed}</p><p class="sub">${storage}</p>`+
    (n&&!held?`<div class="btnrow"><button class="btn ghost sm" id="settings-retry-sync" data-act="retrysync">Retry sync now</button></div>`:'')+recovery+old;
}

function download(name, text, type){
  const blob=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

const quarantinePrefix=()=>`murphy-outbox-quarantine:${S.user.uid}:`;
// Set-aside entries: never replayed or sent, always exportable and in Full backup (R4).
function setAsideOutbox(){
  if(!S.user)return [];
  const prefix=quarantinePrefix(),out=[];
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);if(!key?.startsWith(prefix))continue;
    const raw=localStorage.getItem(key);let envelope=null;try{envelope=JSON.parse(raw);}catch{}
    out.push(object(envelope)&&typeof envelope.key==='string'?{...envelope,storedAt:key}:{storedAt:key,raw});
  }
  return out.sort((a,b)=>a.storedAt.localeCompare(b.storedAt));
}
// A raw copy of everything still queued, including entries the app cannot read (CR-09).
function exportOutboxRecovery(){
  let queued=[];try{queued=queuedWrites();}catch{}
  download(`Murphy_Log_outbox_recovery_${localToday()}.json`,JSON.stringify({exported:new Date().toISOString(),version:APP_VERSION,
    unreadable:unreadableOutbox,setAside:setAsideOutbox(),pending:queued.map(([key])=>({key,raw:localStorage.getItem(key)}))},null,2),'application/json');
}
// Copy first, verify the whole envelope, then remove the original (R3). The destination
// carries the complete original key, so equal suffixes under different queue prefixes
// cannot collide, and a different envelope already stored there is never overwritten.
function setAsideUnreadable(){
  const entries=[...unreadableOutbox];let moved=0;
  try{
    for(const {key,raw} of entries){
      if(localStorage.getItem(key)!==raw)throw Error('An unreadable change was modified while it was being set aside');
      const base=quarantinePrefix()+encodeURIComponent(key),same=v=>{try{const e=JSON.parse(v);return e?.key===key&&e?.raw===raw;}catch{return false;}};
      let target=base;
      for(let n=2;localStorage.getItem(target)!==null&&!same(localStorage.getItem(target));n++)target=base+'~'+n;
      if(localStorage.getItem(target)===null)localStorage.setItem(target,JSON.stringify({key,raw,setAsideAt:new Date().toISOString()}));
      if(!same(localStorage.getItem(target)))throw Error('The copy could not be verified');
      if(localStorage.getItem(key)!==raw)throw Error('An unreadable change was modified while it was being set aside');
      localStorage.removeItem(key);moved++;
    }
    queuedWrites();replayQueuedWrites();return true;
  }catch(e){
    queuedWrites();
    S.banner={kind:'bad',title:'Could not set every change aside',text:String(e.message||e)+`. ${moved} of ${entries.length} ${entries.length===1?'was':'were'} set aside; the rest ${entries.length-moved===1?'is':'are'} still in place and nothing was lost.`};
    setStatus(recordStatus.text,recordStatus.cls);render();return false;
  }
}

function validateBackup(data){
  const check=(ok,where)=>{if(!ok) throw Error('Invalid backup: '+where+'. Nothing was imported.');};
  const date=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&Number.isFinite(toDay(v))&&toIso(toDay(v))===v;
  const id=v=>typeof v==='string'&&v.length>0&&v.length<1500&&!/[\/]/.test(v)&&v!=='.'&&v!=='..';
  const visit=(v,depth=0)=>{
    check(depth<32,'nesting too deep');
    if(v&&typeof v==='object') for(const [k,x] of Object.entries(v)){
      check(!['__proto__','constructor','prototype'].includes(k),'unsafe field name'); visit(x,depth+1);
    }
  };
  const fields=(v,names,test,where)=>{
    for(const k of names.split(' ')) if(v[k]!=null) check(test(v[k]),where+'.'+k);
  };
  const num=v=>Number.isFinite(v)&&v>=0, bool=v=>typeof v==='boolean', str=v=>typeof v==='string';
  visit(data); check(object(data)&&object(data.days),'days');
  for(const [iso,d] of Object.entries(data.days)){
    check(date(iso)&&object(d),'day '+iso);
    fields(d,'date',v=>v===iso,iso); fields(d,'updatedAt',v=>str(v)&&Number.isFinite(Date.parse(v)),iso);
    fields(d,'notes',str,iso); fields(d,'weightMissed',bool,iso);
    // Older databases sometimes stored zero for a missing measurement. Preserve
    // their backup verbatim; recordedWeight excludes zero everywhere it is used.
    fields(d,'weight',num,iso);
    fields(d,'bcs',v=>Number.isFinite(v)&&v>=1&&v<=9,iso);
    fields(d,'walkMin walkKm activeMin treats',num,iso);
    if(d.events!=null) check(Array.isArray(d.events)&&d.events.every(str),iso+'.events');
    if(d.stools!=null){
      check(Array.isArray(d.stools),iso+'.stools'); const ids=new Set();
      for(const [i,s] of d.stools.entries()){
        check(object(s)&&Number.isInteger(s.bristol)&&s.bristol>=1&&s.bristol<=7,iso+'.stool');
        const where=`stool ${i+1} on ${iso}`;
        // HTML attributes normalize CR and NUL; such IDs cannot round-trip to Edit/Delete.
        check(id(s.id)&&s.id.trim().length>0&&!/[\u0000\r]/.test(s.id),where+' needs a valid ID; try a fresh JSON export');
        check(!ids.has(s.id),where+' repeats a stool ID'); ids.add(s.id);
        fields(s,'time',v=>str(v)&&/^([01]\d|2[0-3]):[0-5]\d$/.test(v),iso);
        fields(s,'mucus blood',bool,iso); fields(s,'mealOverride',date,iso);
      }
    }
    if(d.meal!=null){
      check(object(d.meal),iso+'.meal');
      fields(d.meal,'recipe bowl fedAt',str,iso+'.meal');
      fields(d.meal,'darfPlanned darfFed oilMl fibreG',num,iso+'.meal');
      fields(d.meal,'egg broth fibreGiven oilGiven',bool,iso+'.meal');
    }
  }
  if(data.changes!=null){
    check(Array.isArray(data.changes),'changes'); const ids=new Set();
    for(const c of data.changes){
      check(object(c)&&id(c.id)&&date(c.date)&&!ids.has(c.id),'change');
      check(Number.isFinite(c.deltaG)&&Math.abs(c.deltaG)<=10000,'change '+c.id+'.deltaG must be a number from -10000 to 10000');ids.add(c.id);
      fields(c,'reason source',str,'change'); fields(c,'refused',bool,'change');
    }
  }
  if(data.settings!=null){
    check(object(data.settings),'settings');
    for(const [k,spec] of Object.entries({...settingsSpec,...backupNumberSpec})) if(Object.hasOwn(data.settings,k))
      check(validSettingNumber(data.settings[k],spec),`settings.${k} must be a number ${spec.exclusiveMin?`greater than ${spec.min} and at most ${spec.max}`:`from ${spec.min} to ${spec.max}`}${spec.step!=null?`, in steps of ${spec.step}`:''}`);
    // These legacy fields are unused, or overridden by mealSettings. Retain
    // their previous finite-or-null acceptance, including old zero calories.
    fields(data.settings,'attributionMinH handoverHour eggKcal brothKcal',Number.isFinite,'settings');
    // Omitted settings keep their defaults; explicit nulls must not erase them.
    if(Object.hasOwn(data.settings,'startDate')) check(date(data.settings.startDate),'settings.startDate must be a valid YYYY-MM-DD date');
    if(Object.hasOwn(data.settings,'suppressOnRegimeChange')) check(bool(data.settings.suppressOnRegimeChange),'settings.suppressOnRegimeChange must be true or false');
    if(Object.hasOwn(data.settings,'theme')) check(['system','light','dark'].includes(data.settings.theme),'settings.theme must be system, light or dark');
    for(const [key,unit] of [['oilSchedule','ml'],['fibreSchedule','g']]) if(Object.hasOwn(data.settings,key)){
      check(Array.isArray(data.settings[key]),'settings.'+key+' must be an array');
      for(const [i,v] of data.settings[key].entries())
        check(object(v)&&date(v.from)&&num(v[unit])&&v[unit]<=10000,`settings.${key}[${i}] needs a valid from date and ${unit} from 0 to 10000`);
    }
    if(Object.hasOwn(data.settings,'regimeChanges')) check(Array.isArray(data.settings.regimeChanges)&&data.settings.regimeChanges.every(date),'settings.regimeChanges must be an array of valid dates');
  }
  return data;
}
let importing=false;
async function importJson(file){
  if(eraseBlocksChanges())return;
  if(importing) return; importing=true;
  try{
    if(file.size>10*1024*1024) throw Error('Backup exceeds 10 MB; split it into smaller backups.');
    const data=validateBackup(JSON.parse(await file.text())), items=[];
    for(const [iso,day] of Object.entries(data.days)){
      const cur=S.days[iso];
      if(!cur||(day.updatedAt||'')>(cur.updatedAt||'')) items.push({col:'days',id:iso,patch:day,restore:true});
    }
    const n=items.length;
    for(const c of data.changes||[]) if(!S.changes.some(x=>x.id===c.id)) items.push({col:'changes',id:c.id,patch:c,restore:true});
    const settings=Object.fromEntries(Object.entries(data.settings||{}).filter(([k])=>!Object.hasOwn(S.savedSettings||{},k)));
    if(Object.keys(settings).length) items.push({col:'settings',id:'main',patch:settings,restore:true});
    if(items.length&&!await write({items})) return;
    S.banner={kind:'good',title:'Import saved locally',text:`${n} days accepted. Existing newer days, change IDs and settings were kept. Sync will check the server again before merging.`};
    render();
  }catch(e){S.banner={kind:'bad',title:'Import failed',text:String(e.message||e)};render();}
  finally{importing=false;}
}

/* EVENTS */
let stoolDraft=null, stoolOriginal=null, stoolReturnFocus=null;
let draftSession, draftPriorSession, draftUser=null, draftTimer, pendingDraft=null, draftRecovery=null, draftToday=null;
let draftFields=[],draftStools=[],draftExpanded=[],activeStoolKey=null,draftTransfer=null,draftResume=null;
const fieldDraftId=f=>f.key+':'+(f.key==='setnum'?'':f.date+':')+f.id;
const stoolDraftId=s=>s.date+':'+s.record.id;
function mergeDrafts(older,newer,id){
  const drafts=new Map(older.map(d=>[id(d),d]));
  // Keep newer entries at the end, including identities also present in recovery.
  for(const draft of newer){const key=id(draft);drafts.delete(key);drafts.set(key,draft);}
  return [...drafts.values()];
}
function draftKey(){
  if(!draftSession){
    // Duplicate tabs can copy sessionStorage. Use its session only as a recovery
    // candidate; each document writes to its own key so two live tabs never share it.
    draftSession=crypto.randomUUID();
    try{
      draftPriorSession=sessionStorage.getItem('murphy-draft-session');
      sessionStorage.setItem('murphy-draft-session',draftSession);
    }catch{}
    void holdDraftLock(draftSession);
  }
  // Older app versions must not overwrite a multi-view ledger as a one-page draft.
  return `murphy-draft-v2:${S.user.uid}:${draftSession}`;
}
function captureDrafts(){
  const visible=$$('#main [data-form],#main [data-feeding]').map(form=>{
    const input=$('input,textarea',form), parts=weighInParts(form);
    return input?{form,field:{id:input.id,date:form.dataset.date,key:form.dataset.key||'feeding',value:input.value,
      ...(parts?{solo:parts[0].value,combined:parts[1].value}:{}),
      ...(input.type==='number'&&(input.validity.badInput||input.dataset.incompleteNumber)?{incomplete:true}:{})}}:null;
  }).filter(Boolean);
  const represented=new Set(visible.map(v=>fieldDraftId(v.field)));
  const fields=visible.filter(v=>v.form.hasAttribute('data-dirty')).map(v=>v.field);
  draftFields=draftFields.filter(f=>!represented.has(fieldDraftId(f))).concat(fields);
  const stool=stoolDraft&&S.adding?{date:S.adding,record:stoolDraft,original:stoolOriginal,
    time:$('#st-t')?.value??stoolDraft.time,selectedDate:$('#st-date')?.value??S.adding,returnFocus:stoolReturnFocus}:null;
  if(activeStoolKey)draftStools=draftStools.filter(s=>stoolDraftId(s)!==activeStoolKey);
  activeStoolKey=stool?stoolDraftId(stool):null;
  if(stool)draftStools=mergeDrafts(draftStools,[stool],stoolDraftId);
  const details=$$('#main details[id]'),shown=new Set(details.map(el=>el.id));
  draftExpanded=draftFields.length||draftStools.length?
    draftExpanded.filter(id=>!shown.has(id)).concat(details.filter(el=>el.open).map(el=>el.id)):[];
  if(draftToday&&!fields.length&&!stool){draftToday=null;rendered='';renderPending=true;}
  return draftFields.length||draftStools.length?{version:2,savedAt:Date.now(),ownerLock:heldDraftLocks.has(draftSession),tab:S.tab,cursor:S.cursor,fields:draftFields,stools:draftStools,stool,
    viewDate:$('#main [data-stool-log]')?.dataset.stoolLog||null,
    expanded:draftExpanded}:null;
}
function persistDrafts(){
  clearTimeout(draftTimer);
  if(!S.user||!S.ready||draftUser!==S.user.uid||pendingDraft)return false;
  // Capture first: memory retains every view even when device storage is full.
  const data=captureDrafts(),key=draftKey();
  try{
    // Weigh-in readings stay in this page's memory; device storage only ever
    // holds Murphy's net weight, exactly as the single weight field did.
    if(data)localStorage.setItem(key,JSON.stringify({...data,fields:data.fields.map(({solo,combined,...field})=>field)}));else localStorage.removeItem(key);
    if(draftTransfer){
      // Existence of an older destination copy is not proof of a successful transfer.
      if(localStorage.getItem(draftTransfer.key)===draftTransfer.raw)localStorage.removeItem(draftTransfer.key);
      draftTransfer=null;
    }
    if(S.banner?.source==='draft'){S.banner=null;renderFeedback();}
    return true;
  }catch{
    S.banner={kind:'warn',source:'draft',title:'Unfinished entries are only open in this app',text:'Device storage is unavailable. You can move between screens, but keep this app open until you save your entries or draft storage works again.'};
    renderFeedback();
    return false;

  }
  if(ev.target.dataset?.act==='historydate')$('#history-date-error')?.classList.add('hide');
  const form=ev.target.closest('[data-form]'), fresh=!!form&&!form.hasAttribute('data-dirty');
  markInputDirty(ev.target);
  // Only a newly typed entry scrolls; recovered drafts never move the page.
  if(fresh)revealAboveKeyboard($('[data-confirm]',form));
  if(ev.target.closest('[data-form],[data-feeding],[data-stool]'))scheduleDrafts();
});
// iOS keeps the layout viewport full height behind the keyboard; only the visual
// viewport shrinks. Scroll just enough for the new Save row to clear the keyboard
// (and the tab bar when no keyboard is shown).
function revealAboveKeyboard(el){
  const view=window.visualViewport;if(!el||!view)return;
  const limit=Math.min(view.offsetTop+view.height,$('#tabbar').getBoundingClientRect().top);
  const overlap=el.getBoundingClientRect().bottom+12-limit;
  if(overlap>0)window.scrollBy(0,overlap);
}
window.visualViewport?.addEventListener('resize',()=>revealAboveKeyboard(document.activeElement?.closest?.('[data-dirty]')?.querySelector('[data-confirm]')));
// Numeric Return/Enter is handled above. Escape cancels a draft field; Return in
// the stool time/date saves through the same Save control and its checks.
document.addEventListener('keydown',ev=>{
  if(ev.isComposing||typeof ev.target?.closest!=='function')return;
  const t=ev.target, form=t.closest('[data-form]');
  if(form&&t.matches('input')){
    if(ev.key==='Escape'&&form.hasAttribute('data-dirty')){ev.preventDefault();finishInput(form);}
  }else if(ev.key==='Enter'&&t.matches('#st-t,#st-date')){ev.preventDefault();$('#main [data-act="savestool"]')?.click();}
  else if(t.id==='history-date'||t.id==='history-list-date'){
    if(ev.key==='Enter'){ev.preventDefault();chooseHistoryDate(t,'#'+t.id);}
    else if(ev.key.length===1||ev.key.startsWith('Arrow')||ev.key==='Backspace')historyDateTyped=true;
  }
});
document.addEventListener('focusout',ev=>{if((ev.target?.id==='history-date'||ev.target?.id==='history-list-date')&&historyDateTyped)chooseHistoryDate(ev.target);});


document.addEventListener('change', async (ev)=>{
  const el=ev.target.closest('[data-act]');
  if(el&&el.dataset.act==='import'&&el.files&&el.files[0]){
    if(eraseBlocksChanges())return;
    importJson(el.files[0]);
  }
  if(el?.dataset.act==='exportmonthselect'){
    if(validYm(el.value)){S.exportMonth=el.value;rendered='';refreshExportControls();}
    return;
  }
  if(el?.dataset.act==='historydate'&&!historyDateTyped)chooseHistoryDate(el);
  if(el?.dataset.act==='recipe'){
    const iso=el.dataset.date,meal=S.days[iso]?.meal||{},r=el.value;
    if(meal.recipe===r||!RECIPES.some(x=>x.id===r))return;
    if(!await saveMeal(iso,{recipe:r}))el.value=meal.recipe||'';
  }
});

$('#tabbar').addEventListener('click', (ev)=>{
  const b=ev.target.closest('button[data-tab]'); if (!b) return;
  navigateTo(b.dataset.tab);
});

/* AUTH AND BOOT */
// The tab bar can wrap with large text. Reserve its actual height, including the
// home-indicator safe area, so the last control always scrolls clear of it.
if ('ResizeObserver' in window){
  new ResizeObserver(entries=>{
    const height=entries[0].target.getBoundingClientRect().height;
    if(height) document.documentElement.style.setProperty('--tabh',height+'px');
  }).observe(document.getElementById('tabbar'));
}
applyTheme();
async function doSignIn(){
  const em=$('#em').value.trim(), pw=$('#pw').value;
  const err=$('#gate-err'); err.classList.add('hide');
  if (!em||!pw){ err.textContent='Enter both an email address and a password.'; err.classList.remove('hide'); return; }
  $('#signin').disabled=true; $('#signin').textContent='Signing in…';
  try { await signInWithEmailAndPassword(auth, em, pw); }
  catch(e){
    const map={
      'auth/invalid-credential':'Sign-in details not recognised.',
      'auth/invalid-email':'That does not look like an email address.',
      'auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.',
      'auth/network-request-failed':'No connection. A first sign-in on a device needs one.'
    };
    err.textContent = map[e.code] || 'Sign-in failed. Check your details and connection, then retry.';
    err.classList.remove('hide');
  }
  finally { $('#signin').disabled=false; $('#signin').textContent='Sign in'; }
}
$('#pw').addEventListener('keydown', e=>{ if (e.key==='Enter') doSignIn(); });
$('#em').addEventListener('keydown', e=>{ if (e.key==='Enter'){ e.preventDefault(); $('#pw').focus(); } });
// iOS applies :active only when a touch listener exists; this gives taps visible feedback.
document.addEventListener('touchstart',()=>{},{passive:true});

// The sign-in form appears only once Auth reports no signed-in user (CR-01); the
// shell offers it after a few seconds if Auth never reports at all.
function revealSignIn(){
  for(const id of ['gate-form','gate-help'])$('#'+id).classList.remove('hide');
  $('#gate-opening').classList.add('hide');
}
onAuthStateChanged(auth, (u)=>{
  window.appAuthKnown=true;
  if(!u)revealSignIn();
  S.user=u;
  $('#gate').classList.toggle('hide', !!u);
  $('#app').classList.toggle('hide', !u);
  if (u && S.subscribed!==u.uid){ S.subscribed=u.uid; subscribe(); }
  if (u) render();
});

window.addEventListener('online', ()=>void resyncIfPending());
window.addEventListener('offline', ()=>{
  const pending=pendingCount()>0;
  setStatus(pending?'Offline · saved on this device':'Offline · saved records available',pending?'warn':'');
});

// Refresh the local feeding day after midnight, including a suspended/reopened tab.
// Date-keyed choices are never copied or reset, and render keeps open drafts intact.
let renderedLocalDay=localToday();
function refreshLocalDay(){
  const today=localToday();
  if(today===renderedLocalDay) return;
  renderedLocalDay=today;
  rendered='';
  render();
}
function resyncIfPending(){
  try{
    if(S.user&&!flushTask&&queuedWrites().length>0&&navigator.onLine!==false) void flushWrites();
  }catch{}
}
function onResumeOrReconnect(){
  // A timer may not have fired while the app was suspended: re-evaluate time-based notices.
  renderFeedback();refreshSyncSection();
  refreshLocalDay();
  resyncIfPending();
}
setInterval(refreshLocalDay,60000);
setInterval(()=>{if(Date.now()>=retryAfter)resyncIfPending();},15000);
window.addEventListener('focus',onResumeOrReconnect);
document.addEventListener('visibilitychange',()=>{if(document.hidden)persistDrafts();else onResumeOrReconnect();});
window.addEventListener('pagehide',persistDrafts);

window.appCanUpdate=()=>!draftFields.length&&!draftStools.length&&!S.undoBusy&&!S.erasing&&!importing&&!$('#main [data-act="saveinput"]:disabled,#main [data-act="savestool"]:disabled');
window.addEventListener('app-shell-status',()=>{renderFeedback();if(normalizeTab(S.tab)==='settings')render()});
for(const [selector,property]of [['.topbar','--headerh'],['#feedback','--feedbackh']]){
  new ResizeObserver(entries=>document.documentElement.style.setProperty(property,entries[0].target.getBoundingClientRect().height+'px')).observe($(selector));
}
window.AppShell.ready();
</script>
