  }

  if (a==='saveinput'){
    if (el.disabled) return; el.disabled=true;
    await confirmInput(el.closest('[data-form]')); el.disabled=false; return;
  }
  if (a==='cancelinput'){ finishInput(el.closest('[data-form]')); return; }
  if (a==='cancelfeedingtime'){
    const form=el.closest('[data-feeding]'), input=$('input',form);
    input.value=input.defaultValue; form.removeAttribute('data-dirty'); render();focusAfterRender('#'+input.id);return;
  }
  if (a==='retrysync'){ flushWrites(); return; }
  if (a==='missed'){
    if(el.disabled||$(`[data-form][data-key="weight"][data-date="${iso}"][data-dirty]`)) return;
    const focus=el.id;
    if(await saveDay(iso,weightMissedPatch(d))){
      // Other forms may have drafts, so update this safe section immediately
      // even when a full page render is deferred to protect those drafts.
      if(renderPending) document.getElementById(focus)?.closest('section').replaceWith((()=>{
        const template=document.createElement('template');template.innerHTML=weightCard(iso);return template.content.firstElementChild;
      })());
      refocus(focus);
    }
    return;
  }
  if (a==='openstool'||a==='editstool'){
    if (!leaveDraft()) return;
    const old=(d.stools||[]).find(x=>x.id===el.dataset.id);
    stoolReturnFocus=el.id?'#'+CSS.escape(el.id):old?`[data-act="editstool"][data-id="${CSS.escape(old.id)}"][data-date="${iso}"]`:`[data-act="openstool"][data-date="${iso}"]`;
    stoolOriginal=old?{...old}:null;
    stoolDraft=old?{...old}:{id:'s'+crypto.randomUUID(),time:nowHHMM(),mucus:false,blood:false};
    S.adding=iso; render(true); $('#st-t')?.focus(); return;
  }
  if(a==='cancelstool'){
    const target=stoolReturnFocus,date=S.adding;S.adding=null;stoolDraft=null;stoolOriginal=null;
    if($('#main [data-dirty]'))refreshStoolLog(date);else render(true);
    focusAfterRender(target);return;
  }
  if (a==='stooltype'){
    if (!stoolDraft) return;
    stoolDraft.bristol=Number(el.dataset.b);
    $$('.bristol button').forEach(b=>{const on=Number(b.dataset.b)===stoolDraft.bristol;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)}); return;
  }
  if (a==='tog-mucus'||a==='tog-blood'){
    if (!stoolDraft) return; const k=a.slice(4);
    stoolDraft[k]=!stoolDraft[k];el.classList.toggle('on',stoolDraft[k]);el.setAttribute('aria-pressed',stoolDraft[k]);return;
  }
  if (a==='savestool'){
    if (el.disabled||!stoolDraft) return;
    if (!stoolDraft.bristol){setStatus('Choose a Bristol type first','warn');return;}
    const time=$('#st-t'), dateInput=$('#st-date');
    if (!time.reportValidity()||!dateInput.reportValidity()||!validDate(dateInput.value)||dateInput.value>localToday()) return;
    if(stoolOriginal&&!(S.days[S.adding]?.stools||[]).some(s=>s.id===stoolOriginal.id)){
      storeError(Error('This stool was removed or moved elsewhere. Cancel this draft and review its saved date.'));return;
    }
    el.disabled=true;
    const originalDate=S.adding, date=dateInput.value, list=S.days[date]?.stools||[], edited={...stoolDraft,time:time.value};
    const moving=date!==originalDate&&!!stoolOriginal;
    const changes=stoolOriginal?Object.fromEntries(['time','bristol','mucus','blood'].filter(k=>edited[k]!==stoolOriginal[k]).map(k=>[k,edited[k]])):{};
    const next=stoolOriginal&&!moving?{...list.find(s=>s.id===stoolOriginal.id),...changes}:edited;
    const st=list.some(x=>x.id===next.id)?list.map(x=>x.id===next.id?next:x):[...list,next];
    const saved=moving?moveStool(originalDate,date,next,stoolOriginal):saveDay(date,{stools:st});
    if (await saved){
      S.adding=null;stoolDraft=null;stoolOriginal=null;
      const otherDrafts=!!$('#main [data-dirty]');
      if(date!==originalDate&&!otherDrafts){S.cursor=date;S.tab='day';}
      if(otherDrafts){
        if(date!==originalDate)S.banner={kind:'plain',title:`Stool saved for ${fmtDate(date)}`,text:'Your other unfinished entries stay open. The stool is listed on that date in History.'};
        refreshStoolLog(originalDate);
      }else render(true);
      focusAfterRender(date!==originalDate&&otherDrafts?'#add-stool-'+originalDate:`[data-act="editstool"][data-id="${CSS.escape(next.id)}"][data-date="${date}"]`);
    }else el.disabled=false;
    return;
  }
  if(a==='delstool'){
    const record=(d.stools||[]).find(x=>x.id===el.dataset.id);if(!record)return;
    el.disabled=true;
    await removeWithUndo({kind:'stool',date:iso,record,index:d.stools.indexOf(record),label:`Stool removed · ${fmtShort(iso)} at ${record.time||'time not recorded'}`},
      {col:'days',id:iso,patch:{date:iso,updatedAt:new Date().toISOString()},stools:{put:[],drop:[record.id]}});
    el.disabled=false;return;
  }


  if (a==='extra'){
    const k=el.dataset.k;
    if (!Object.hasOwn(MEAL_FLAGS,k)) return;
    // Recalculate editable plans only. A fed or historical record keeps amounts.
    const focus=el.id;
    if(await saveMeal(iso,{[k]:plannedMeal(iso)[k]!==true,...(k==='oilGiven'&&isEditablePlan(iso,d.meal)?{oilDefaultMode:'manual'}:{})})){
      if(renderPending){
        const current=document.getElementById(focus), m=S.days[iso].meal;
        if(current) current.outerHTML=switchRow(focus,MEAL_FLAGS[k],m[k],mealFlagDetail(m,k,isEditablePlan(iso,m)),`data-act="extra" data-k="${k}" data-date="${iso}"`);
      }
      refocus(focus);
    }
    return;
  }
  if (a==='fed'||a==='savefeedingtime'){
    const meal=plannedMeal(iso), r=meal.recipe;
    if (!r||el.disabled) return;
    if (el.dataset.fedTime==='explicit'){
      const form=el.closest('[data-feeding]'), input=$('input',form);
      if (!input.reportValidity()||!isFedMeal({recipe:r,fedAt:input.value})) return;
      el.disabled=true;
      if (await saveMeal(iso,{fedAt:input.value,...(isEditablePlan(iso,meal)?{darfFed:meal.darfFed??meal.darfPlanned}:{})})){
        input.defaultValue=input.value; form.removeAttribute('data-dirty'); el.disabled=false; render();
      } else el.disabled=false;
      return;
    }
    if (a!=='fed'||isFedMeal(meal)||iso!==localToday()) return;
    const b=bowlFor(iso,r,S.settings,S.changes,meal);
    if (!b) return;
    saveMeal(iso,{fedAt:nowHHMM(),darfFed:meal.darfFed??b.darfG}); return;
  }
  if (a==='unfeed'){
    if (el.disabled) return; el.disabled=true;
    if (await saveDay(iso,{meal:{fedAt:null}})){
      el.closest('[data-feeding]')?.removeAttribute('data-dirty'); el.disabled=false; render();
    } else el.disabled=false;
    return;
  }
  if (a==='bowl'){
    if (!d.meal?.fedAt&&S.tab==='today'&&iso===localToday()) return;
    if(await saveDay(iso,{meal:{bowl:d.meal?.bowl===el.dataset.k?null:el.dataset.k}}))refreshSelectionStates();return;
  }


  if (a==='applyadv'){
    const adv=weeklyAdvice(); if (!adv.applied) return;
    if(!await saveChange({date:localToday(), deltaG:adv.adjustmentG, source:'rule', reason:adv.reason}))return;
    S.banner={kind:'good',title:'Applied and saved on this device',text:`DARF moves ${adv.adjustmentG>0?'up':'down'} ${Math.abs(adv.adjustmentG)} g from tonight. The rule will not fire again until next Monday.`};
    render(); return; }
  if (a==='refuseadv'){
    if(!weeklyAdvice().applied)return;
    if(!await saveChange({date:localToday(), deltaG:0, source:'refused', refused:true, reason:'Refused: '+weeklyAdvice().reason}))return;
    S.banner={kind:'plain',title:'Decision saved on this device',text:'The ration is unchanged. The rule will look again next Monday.'};
    render(); return; }
  if (a==='applyfibre'){
    const g=Number(el.dataset.g),fib=insights().fib;
    if(!fib.advice||fib.advice.toG!==g)return;
    if(!await saveSettings({fibreSchedule:[...(S.settings.fibreSchedule||[]),{from:localToday(),g}]}))return;
    S.banner={kind:'good',title:`Pro-Fibre now ${g} g`,text:'Saved on this device. The streak restarts from tomorrow.'};
    render(); return; }
  if(a==='dismissfibre'){
    const fib=insights().fib;if(!fib.advice)return;
    const snooze={until:shiftDate(localToday(),1),advice:fibreAdviceKey(fib)};
    try{localStorage.setItem(deviceKey('fibre-snooze'),JSON.stringify(snooze));}
    catch(e){S.banner={kind:'warn',title:'Could not postpone this advice',text:'Your dose is unchanged. Device storage is unavailable; try Not now again.'};render();return;}
    S.fibreSnooze=snooze;S.fibreSnoozedUntil=snooze.until;
    S.banner={kind:'plain',title:'Advice postponed until tomorrow',text:'Your dose is unchanged. This advice is hidden on this device until the next day, unless the advice changes.'};render();return;
  }
  if (a==='setfibre'){
    const g=Number(el.dataset.g);
    if (g>S.settings.fibreRestG && !confirm(`${g} g is above the ${S.settings.fibreRestG} g ceiling the audit set. Stool that does not settle at ${S.settings.fibreRestG} g is a clinical question rather than a dose question. Set it anyway?`)) return;
    saveSettings({fibreSchedule:[...(S.settings.fibreSchedule||[]), {from:localToday(), g}]}); return; }
  if(a==='addregime'){await write({regime:{date:localToday(),count:1}});return;}
  if(a==='delregime'){
    const date=el.dataset.d,count=(S.settings.regimeChanges||[]).filter(x=>x===date).length;if(!count)return;
    if(!confirm(`Remove the regime change on ${fmtDate(date)}? This can allow ration advice to resume for weeks containing this date. Undo will be available.`))return;
    const indices=(S.settings.regimeChanges||[]).flatMap((d,i)=>d===date?[i]:[]);
    el.disabled=true;await removeWithUndo({kind:'regime',date,count,indices,label:`Regime change removed · ${fmtShort(date)}`},{regime:{date,drop:true}});el.disabled=false;return;
  }
  if(a==='delchange'){
    const record=S.changes.find(c=>c.id===el.dataset.id);if(!record)return;
    const effect=record.refused?'This lets the weekly rule consider advice again.':`This removes its ${record.deltaG>=0?'+':''}${record.deltaG} g adjustment from plans from that date onwards. Saved historical meals keep their recorded amounts.`;
    if(!confirm(`Remove the ration entry on ${fmtDate(record.date)}? ${effect} Undo will be available.`))return;
    el.disabled=true;await removeWithUndo({kind:'change',record,label:`Ration adjustment removed · ${fmtShort(record.date)}`},{col:'changes',id:record.id,erase:true});el.disabled=false;return;
  }

  if (a==='exportmonth'){ exportMonthCsv(); return; }
  if (a==='exportmd'){ exportMonthMd(); return; }
  if (a==='exportall'){ exportAll(); return; }
  if (a==='selftest'){ selfTest(); return; }
  if (a==='erase'){
    if(S.erasing)return;
    if (!confirm('Delete every day and every recorded change? Settings are kept. Export first.')) return;
    if (prompt('Type ERASE to confirm')!=='ERASE') return;
    S.erasing=true;S.localSaveError=null;el.disabled=true;el.textContent='Erasing log data…';
    eraseBlocksChanges();setStatus('Erasing log data…');
    try{
      await flushWrites();
      // Both queue types must finish first: a later replay must not recreate a
      // record the user has just explicitly erased.
      if(queuedWrites().length){
        S.banner={kind:'warn',source:'sync',retry:true,title:'Sync before erasing',text:'Some confirmed entries are still waiting to sync. Nothing has been erased. Connect and retry sync before erasing the log.'};
        return;
      }
      for(const k of Object.keys(S.days))await deleteDoc(doc(db,'days',k));
      for(const c of S.changes)await deleteDoc(doc(db,'changes',c.id));
      S.undo=null;try{localStorage.removeItem(deviceKey('undo'));}catch{}
      S.banner={kind:'plain',title:'Erased',text:'Settings were kept.'};
    }catch(e){S.banner={kind:'bad',title:'Erase stopped',text:'Some records may already have been erased. Check the remaining log before trying again. '+String(e.message||e)};}
    finally{
      S.erasing=false;el.disabled=false;
      setStatus(S.banner?.kind==='bad'?'Erase stopped':S.banner?.source==='sync'?'Saved locally; retry sync':'Synced',S.banner?.kind==='bad'?'bad':S.banner?.source==='sync'?'warn':'');
      render();
    }
    return;
  }
});

document.addEventListener('input',ev=>{
  if(ev.target.matches('input,textarea'))clearFieldError(ev.target);
  const feeding=ev.target.closest('[data-feeding]');
  if(feeding){feeding.setAttribute('data-dirty','');return;}
  const form=ev.target.closest('[data-form]');
  if (form&&!form.hasAttribute('data-dirty')){
    form.setAttribute('data-dirty','');
    form.insertAdjacentHTML('beforeend',`<div class="btnrow" data-confirm><button class="btn sm" data-act="saveinput" aria-label="Save ${esc($('label',form).textContent)}">Save</button><button class="btn ghost sm" data-act="cancelinput">Cancel</button></div>`);
    if(form.dataset.key==='weight'){
      const toggle=document.getElementById('weight-missed-'+form.dataset.date);
      if(toggle){toggle.disabled=true;$('.switch-detail',toggle).textContent='Save or cancel the weight entry before marking it missed.';}
    }
  }
});


document.addEventListener('change', async (ev)=>{
  const el=ev.target.closest('[data-act]');
  if(el&&el.dataset.act==='import'&&el.files&&el.files[0]){
    if(eraseBlocksChanges())return;
    importJson(el.files[0]);
  }
  if(el?.dataset.act==='historydate'){
    const next=el.value;
    if(!next||!el.reportValidity()||next<earliestHistoryDate()||(next>localToday()&&!Object.hasOwn(S.days,next))){el.value=S.cursor;return;}
    if(!leaveDraft()){el.value=S.cursor;return;}
    navigateTo('day',{date:next,target:'#history-date'});return;
  }
  if(el?.dataset.act==='recipe'){
    const iso=el.dataset.date,meal=S.days[iso]?.meal||{},r=el.value;
    if(meal.recipe===r||!RECIPES.some(x=>x.id===r))return;
    if(!await saveMeal(iso,{recipe:r}))el.value=meal.recipe||'';
  }
});

$('#tabbar').addEventListener('click', (ev)=>{
  const b=ev.target.closest('button[data-tab]'); if (!b) return;
  if (!leaveDraft()) return;
  navigateTo(b.dataset.tab);
});

/* AUTH AND BOOT */
// The tab bar can wrap with large text. Reserve its actual height, including the
// home-indicator safe area, so the last control always scrolls clear of it.
if ('ResizeObserver' in window){
  new ResizeObserver(entries=>{
    const height=entries[0].target.getBoundingClientRect().height;
    if(height) document.documentElement.style.setProperty('--tabh',height+'px');
  }).observe(document.getElementById('tabbar'));
}
applyTheme();
async function doSignIn(){
  const em=$('#em').value.trim(), pw=$('#pw').value;
  const err=$('#gate-err'); err.classList.add('hide');
  if (!em||!pw){ err.textContent='Enter both an email address and a password.'; err.classList.remove('hide'); return; }
  $('#signin').disabled=true; $('#signin').textContent='Signing in…';
  try { await signInWithEmailAndPassword(auth, em, pw); }
  catch(e){
    const map={
      'auth/invalid-credential':'Sign-in details not recognised.',
      'auth/invalid-email':'That does not look like an email address.',
      'auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.',
      'auth/network-request-failed':'No connection. A first sign-in on a device needs one.'
    };
    err.textContent = map[e.code] || 'Sign-in failed. Check your details and connection, then retry.';
    err.classList.remove('hide');
  }
  finally { $('#signin').disabled=false; $('#signin').textContent='Sign in'; }
}
$('#pw').addEventListener('keydown', e=>{ if (e.key==='Enter') doSignIn(); });

onAuthStateChanged(auth, (u)=>{
  S.user=u;
  $('#gate').classList.toggle('hide', !!u);
  $('#app').classList.toggle('hide', !u);
  if (u && S.subscribed!==u.uid){ S.subscribed=u.uid; S.cursor=localToday(); subscribe(); }
  if (u) render();
});

window.addEventListener('online', ()=>flushWrites());
window.addEventListener('offline', ()=>{
  let pending=false;try{pending=queuedWrites().length>0;}catch{}
  setStatus(pending?'Offline · entries saved on this device':'Offline · saved records available',pending?'warn':'');
});

// Refresh the local feeding day after midnight, including a suspended/reopened tab.
// Date-keyed choices are never copied or reset, and render keeps open drafts intact.
let renderedLocalDay=localToday();
function refreshLocalDay(){
  const today=localToday();
  if(today===renderedLocalDay) return;
  renderedLocalDay=today;
  render();
}
setInterval(refreshLocalDay,1000);
window.addEventListener('focus',refreshLocalDay);
document.addEventListener('visibilitychange',()=>{if(!document.hidden) refreshLocalDay();});

window.appCanUpdate=()=>!S.undoBusy&&!S.erasing&&!importing&&!$('#main [data-act="saveinput"]:disabled,#main [data-act="savestool"]:disabled');
window.addEventListener('app-shell-status',()=>{renderFeedback();if(S.tab==='more')render()});
for(const [selector,property]of [['.topbar','--headerh'],['#feedback','--feedbackh']]){
  new ResizeObserver(entries=>document.documentElement.style.setProperty(property,entries[0].target.getBoundingClientRect().height+'px')).observe($(selector));
}
window.AppShell.ready();
</script>
