<!doctype html>
<html lang="en-GB" data-version="3.12.3">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://www.gstatic.com">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101010">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Murphy’s Logs">
<title>Murphy’s Logs</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23161616'/%3E%3Cg fill='%23ddd'%3E%3Cellipse cx='64' cy='62' rx='14' ry='19'/%3E%3Cellipse cx='97' cy='54' rx='14' ry='20'/%3E%3Cellipse cx='128' cy='68' rx='13' ry='18'/%3E%3Cpath d='M96 88c19 0 34 14 34 29 0 13-11 20-24 20-8 0-12-3-20-3s-12 3-20 3c-13 0-24-7-24-20 0-15 15-29 34-29z'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  color-scheme:dark;
  --paper:#101010; --surface:#1e1e1e; --surface-2:#292929;
  --ink:#f5f5f5; --ink-2:#d0d0d0; --ink-3:#b2b2b2;
  --rule:#454545; --rule-2:#858585;
  --accent:#ededed; --accent-ink:#f0f0f0; --accent-soft:#303030;
  --good:#78c886; --good-soft:var(--surface-2);
  --watch:#e7b45a; --watch-soft:var(--surface-2);
  --alert:#ffaaa0; --alert-soft:var(--surface-2); --on-accent:#101010;
  --switch-on:#ededed; --switch-off:#757575; --switch-thumb-on:#101010;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --compact:"SF Compact Text","SF Compact",var(--sans);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --sl:max(20px,env(safe-area-inset-left)); --sr:max(20px,env(safe-area-inset-right));
  --tabh:5rem; --headerh:3rem; --feedbackh:0px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --paper:#f4f4f4; --surface:#fff; --surface-2:#eee;
  --ink:#171717; --ink-2:#444; --ink-3:#595959;
  --rule:#d4d4d4; --rule-2:#808080;
  --accent:#262626; --accent-ink:#1f1f1f; --accent-soft:#e5e5e5;
  --good:#276e30; --good-soft:var(--surface-2);
  --watch:#805109; --watch-soft:var(--surface-2);
  --alert:#a12c24; --alert-soft:var(--surface-2); --on-accent:#fff;
  --switch-on:#262626; --switch-off:#757575; --switch-thumb-on:#fff;
}
@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --paper:#f4f4f4; --surface:#fff; --surface-2:#eee;
    --ink:#171717; --ink-2:#444; --ink-3:#595959;
    --rule:#d4d4d4; --rule-2:#808080;
    --accent:#262626; --accent-ink:#1f1f1f; --accent-soft:#e5e5e5;
    --good:#276e30; --good-soft:var(--surface-2);
    --watch:#805109; --watch-soft:var(--surface-2);
    --alert:#a12c24; --alert-soft:var(--surface-2); --on-accent:#fff;
    --switch-on:#262626; --switch-off:#757575; --switch-thumb-on:#fff;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font:-apple-system-body;scroll-padding-top:calc(var(--headerh) + var(--feedbackh) + 1rem);scroll-padding-bottom:calc(var(--tabh) + 1rem)}
html,body{margin:0;padding:0;touch-action:manipulation}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:1rem; line-height:1.5;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:contain;
}
button,input,select,textarea,summary,a,.btn,.link,.switch-row,[role="button"]{touch-action:manipulation}
button,summary,.tabbar,.moment,.scale button,.btn,.link,[role="button"]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input,select,textarea{font:inherit;color:inherit;accent-color:var(--accent);caret-color:var(--ink)}
/* iOS zooms into a focused field under 16px. 1rem follows Dynamic Type and can be
   14–15px at smaller text sizes, so fields never drop below 16px. */
input,select,textarea{font-size:max(16px,1rem)}
/* Neutral browser-owned text selection and form chrome where CSS is supported. */
::selection{background:var(--accent);color:var(--on-accent)}
input::file-selector-button{color:var(--ink);background:var(--surface-2);border-color:var(--rule-2)}
option{color:var(--ink);background:var(--surface)}
option:checked{color:var(--on-accent);background:var(--accent)}
button{background:none;border:0;cursor:pointer;padding:0;text-align:left;min-width:44px;min-height:44px;overflow-wrap:anywhere}
input,select,.btn{min-height:44px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:5px}
button:disabled{cursor:default}
button:disabled:not(.btn){color:var(--ink-3)}
.switch-row:disabled .switch-track{border:1px dashed currentColor;box-shadow:none;opacity:.5}
button:not(:disabled):active{opacity:.78;box-shadow:inset 0 0 0 2px var(--ink-3)}
input,select,textarea,[tabindex="-1"]{scroll-margin-block:calc(var(--headerh) + var(--feedbackh) + 1rem) calc(var(--tabh) + 2rem)}
.hide{display:none !important}
.num,.row .v,.field input,.scale button,.bristol b{font-variant-numeric:tabular-nums}
.g{--tone:var(--good)} .a{--tone:var(--watch)} .r{--tone:var(--alert)}

/* shell */
#gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:var(--s5)}
.gate-card{width:100%;max-width:380px}
.gate-card h1{font-size:1.625rem;font-weight:650;letter-spacing:-.02em;margin:0 0 4px}
.gate-card p.sub{color:var(--ink-2);font-size:.9rem;margin:0 0 26px}

#app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule);
  padding:calc(env(safe-area-inset-top) + var(--s3)) var(--sr) var(--s2) var(--sl);
  display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:var(--s2) var(--s3);
}
.topbar .who{font-size:1rem;font-weight:650;letter-spacing:-.02em}
.topbar .state{font-size:.875rem;font-weight:600;color:var(--ink-2)}
/* The sync state is the owner's main signal in poor coverage: readable, tappable, with a count. */
.sync-chip{display:inline-flex;flex-wrap:wrap;align-items:baseline;justify-content:flex-end;gap:0 8px;min-height:44px;margin-block:-10px -6px;padding:6px 0 6px 8px;text-align:right;max-width:100%}
.sync-count{font-size:.875rem;font-weight:650;color:var(--watch);font-variant-numeric:tabular-nums}
.sync-count:empty{display:none}
.topbar .state.warn{color:var(--watch)}
.topbar .state.bad{color:var(--alert)}

main{flex:1;padding:var(--s5) var(--sr) calc(var(--tabh) + var(--s4)) var(--sl);max-width:42rem;width:100%;margin:0 auto;min-width:0}
.feedback-region{position:sticky;top:var(--headerh);z-index:19;width:100%;max-width:42rem;margin-inline:auto;padding-inline:var(--sl) var(--sr);background:var(--paper);max-height:45dvh;overflow-y:auto}
.feedback-region:empty{display:none}
.feedback-region .note{margin:12px 0;padding:12px 16px;border:1px solid var(--rule-2);border-left-width:3px}
.feedback-actions{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:4px}
.feedback-actions .link{font-size:.875rem}
.feedback-region .note b{margin-bottom:2px}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(max(25%,8ch),1fr));font:.75rem/1.5 var(--sans);
  background:var(--surface);border-top:1px solid var(--rule-2);
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.tabbar button{
  position:relative;text-align:center;padding:10px 2px;font:inherit;color:var(--ink-3);white-space:normal;
  min-height:60px;min-width:0;outline-offset:-4px;
}
.tabbar button.on{color:var(--accent-ink);font-weight:650;background:var(--accent-soft);box-shadow:inset 0 2px 0 var(--accent)}
.tabbar svg{display:block;width:22px;height:22px;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar .dotmark{position:absolute;top:7px;left:calc(50% + 13px);width:6px;height:6px;border-radius:50%;background:var(--ink)}

/* pieces */
.moment{
  display:inline-block;font-size:.8125rem;font-weight:650;
  letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);
  margin-bottom:var(--s2);
}
h2.screen{font-size:2rem;font-weight:700;letter-spacing:-.035em;margin:0 0 var(--s5);line-height:1.15;overflow-wrap:anywhere}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;margin-bottom:var(--s5);overflow:hidden;min-width:0}
.sec{padding:20px}
.card>.sec+.sec{border-top:1px solid var(--rule)}
.lab{font-size:1rem;font-weight:650;letter-spacing:-.01em;color:var(--ink);margin:0 0 var(--s4);line-height:1.35}
.sec>.lab:not(:first-child){margin-top:var(--s4)}
.activity-period+.activity-period{border-top:1px solid var(--rule);margin-top:var(--s4);padding-top:var(--s4)}
.activity-period>.lab{font-size:.9375rem;margin-bottom:var(--s2)}
summary{min-height:44px;cursor:pointer;font-weight:600;list-style-position:inside;overflow-wrap:anywhere}
details[open]>summary{margin-bottom:var(--s3)}
details.card>summary{padding:var(--s4);margin:0;outline-offset:-4px}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;margin-bottom:10px}
.row:last-child{margin-bottom:0}
.row .k{color:var(--ink-2);font-size:.9375rem;min-width:0;overflow-wrap:anywhere}
.row .v{font-size:1rem;font-weight:600;overflow-wrap:anywhere}
.sub{font-size:.875rem;color:var(--ink-3);margin:8px 0 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.weight-condition{border-color:var(--rule-2)}
.weight-condition>.lab{margin-bottom:8px}
.assessment-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:20px;margin-top:20px}
.assessment-grid>div{min-width:0}
.assessment-grid h4{margin:0 0 4px;font-size:1rem}
.assessment-value{font-size:2rem;font-weight:700;letter-spacing:-.03em;line-height:1.2;margin:8px 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.assessment-value small{font-size:1rem;font-weight:500;letter-spacing:0}
.weight-state{display:inline-block;font-size:.875rem;font-weight:650;padding:3px 8px;border:1px solid var(--rule-2);border-radius:5px}
.weight-state[data-weight-status="above"],.weight-state[data-weight-status="below"]{border:2px solid var(--watch);color:var(--watch)}
.weight-mean{border-top:1px solid var(--rule);margin-top:12px;padding-top:10px;font-size:.875rem;color:var(--ink-2);line-height:1.6}
.weight-mean .weight-state{margin-top:4px}
.weight-hint{margin-top:12px}
.weight-hint>.sub:first-child{margin-top:0}
.chart-point.weight-outside{width:.625rem;height:.625rem;border:2px solid var(--watch);border-radius:0;background:var(--surface)}
.weight-target-band{fill:var(--accent);fill-opacity:.08;stroke:var(--rule-2);stroke-width:1;stroke-dasharray:2 3;vector-effect:non-scaling-stroke}
.diary-flags[data-weight-status="above"],.diary-flags[data-weight-status="below"]{color:var(--watch);font-weight:650}

/* buttons */
.btn{display:block;width:100%;text-align:center;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:1rem;padding:var(--s3) var(--s4);border-radius:10px;min-height:48px}
.btn[disabled]{opacity:.4}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--rule-2)}
.btn.sm{font-size:.875rem;padding:var(--s2)}
.btn.danger{background:var(--alert);color:var(--on-accent)}
.btnrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,8rem),1fr));gap:var(--s3);margin-top:var(--s4)}
[data-form]+.chip{margin-top:var(--s3)}
.link{color:var(--accent-ink);font-weight:600;font-size:.9375rem;padding-block:8px}

/* inputs */
.field{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3);padding:var(--s2) 0}
.field label{flex:1 1 8rem;font-size:.9375rem;color:var(--ink-2)}
.field input{
  border:1px solid var(--rule-2);border-radius:8px;background:var(--surface-2);text-align:right;
  font-size:max(16px,1.0625rem);font-weight:600;width:7.5rem;max-width:100%;min-width:0;padding:var(--s2);
}
[aria-invalid="true"]{border-color:var(--alert)!important;outline-color:var(--alert)}
.field-help,.field-error{font-size:.875rem;line-height:1.5;margin:4px 0 0;color:var(--ink-3)}
.field-error{color:var(--alert)}
input:disabled{color:var(--ink-3);opacity:1;border-style:dashed}
.tin{width:100%;max-width:100%;border:1px solid var(--rule-2);border-radius:8px;padding:var(--s3);background:var(--surface);font-size:max(16px,1rem)}
/* iOS native date/time chrome overrides border-box sizing; keep the native pickers. */
.tin[type="date"],.tin[type="time"]{min-width:0;-webkit-appearance:none;appearance:none}
textarea.tin{min-height:64px;resize:vertical;font-family:var(--sans)}
.inline-lab{display:block;font-size:.9375rem;color:var(--ink-2);margin:0 0 var(--s2)}
/* Weigh-in by difference: two readings, one live net figure for Murphy. */
.weigh-result{display:block;margin-top:var(--s1);padding:6px var(--s3);
  border:1px solid var(--rule);border-radius:8px;background:var(--surface-2);font-size:.9375rem;color:var(--ink-2);line-height:1.45;overflow-wrap:anywhere;transition:border-color .15s ease}
.weigh-result b{font-size:1.0625rem;font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums}
.weigh-note{display:block;font-size:.875rem;font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums}
.weigh-result[data-state="ready"]{border-color:var(--accent)}
.weigh-result[data-state="invalid"]{border:2px dashed var(--watch);color:var(--watch);font-weight:600}
/* After a blocked Save the field error says it once; the live hint returns on the next keystroke. */
[data-form]:has(.field-error:not(.hide)) .weigh-result[data-state="invalid"]{display:none}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chips,.meal-flags,.seg{margin-block:var(--s3)}
.meal-flags{display:grid;grid-template-columns:minmax(0,1fr);gap:0;margin-block:var(--s5)}
.switch-row{display:flex;align-items:center;gap:var(--s4);width:100%;min-height:64px;padding:14px 0;border-block-end:1px solid var(--rule);text-align:left;outline-offset:-3px}
.switch-row:first-child{border-block-start:1px solid var(--rule)}
.switch-copy{flex:1;min-width:0}
.switch-label{display:block;font-size:1rem;font-weight:600;line-height:1.35}
.switch-detail{display:block;font-size:.8125rem;line-height:1.5;color:var(--ink-3);margin-top:4px}
.switch-control{display:flex;flex:none;align-items:center;gap:8px}
.switch-state{font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.switch-track{display:block;position:relative;width:51px;height:31px;border-radius:20px;background:var(--switch-off);box-shadow:inset 0 0 0 1px var(--switch-off);transition:background-color .15s ease}
.switch-thumb{position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:transform .15s ease}
.switch-row[aria-checked="true"] .switch-track{background:var(--switch-on)}
.switch-row[aria-checked="true"] .switch-thumb{transform:translateX(20px);background:var(--switch-thumb-on)}
.chip{font-size:.9375rem;padding:var(--s2) var(--s3);border:1px solid var(--rule-2);border-radius:9px;color:var(--ink-2);background:transparent}
.chip.on,.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip.on.ev{background:var(--accent);border-color:var(--accent)}
.unsaved-chip{border:2px solid var(--watch);color:var(--ink);font-weight:650}
.unsaved-chips+.chips{margin-top:var(--s2)}

/* segmented */
.seg{display:flex;border:1px solid var(--rule-2);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-width:0;text-align:center;padding:var(--s2);font-size:.9375rem;color:var(--ink-2);border-right:1px solid var(--rule-2)}
.seg button:last-child{border-right:0}
.seg button:disabled{background:var(--surface-2);color:var(--ink-3);opacity:.65}

/* bristol + bcs scales */
.bristol,.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(max(44px,3.5rem),1fr));gap:var(--s2);margin-block:var(--s3)}
:is(.bristol,.scale) button{text-align:center;border:1px solid var(--rule-2);border-radius:6px;background:var(--surface)}
.bristol button{padding:9px 1px 7px;line-height:1.1}
.bristol b{display:block;font-size:.9375rem;font-weight:600;color:var(--tone)}
.bristol i{display:block;font-style:normal;font-size:.75rem;color:var(--ink-3);margin-top:5px}

.scale button{
  padding:11px 0;font-size:.9375rem;font-weight:600;color:var(--tone);
}
@media(max-width:600px) and (orientation:portrait){
  .bcs-scale{grid-template-columns:repeat(8,minmax(0,1fr));max-width:calc(14rem + 3 * var(--s2));margin-inline:auto}
  .bcs-scale button{grid-column:span 2;white-space:nowrap}
  .bcs-scale button:nth-child(5){grid-column:2 / span 2}
}
.sr-only,#bcs-announcement,#weight-announcement,#history-announcement{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.bristol button.on b,.bristol button.on i,.scale button.on{color:var(--on-accent)}
:is(.bristol,.scale) .on{background:var(--tone);border-color:var(--tone)}

/* stool entries */
.stool{display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s2) 0;border-bottom:1px solid var(--rule)}
.stool:last-of-type{border-bottom:0}
.dot{width:9px;height:9px;border-radius:2px;flex:none;margin-top:5px;background:var(--tone)}
.stool .body{flex:1;min-width:0}
.stool .t{display:block;font-size:1rem;padding-top:var(--s2)}
.stool .dot{margin-top:15px}
.stool-meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 var(--s3)}
.stool .attr{font-size:.875rem;color:var(--ink-3)}
.stool-actions{display:flex;gap:var(--s3);margin-left:auto}
.link.danger-link{color:var(--alert)}
/* Logging starts from the type: one tap opens a prefilled entry, then Save. */
.quick-stool{margin-top:var(--s3);border-radius:8px;outline-offset:4px}
.quick-stool .bristol{margin-block:var(--s2) 0}
.stool-form{margin-top:var(--s3)}
.stool-when{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3);margin-top:var(--s3)}
.todo .chips{margin-block:0}
.bowl-prompt{margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--rule)}
.bowl-prompt .seg{margin-bottom:0}
.assessment-strip,.fold-strip{display:block;font-size:.9375rem;font-weight:500;color:var(--ink-2);margin-top:2px}
/* Weight as well as colour: forced colours replace the warning colour. */
.fold-strip .watch-text{font-weight:650}
/* A collapsed section still says it holds an unfinished entry. Bold survives forced colours. */
.draft-mark{display:block;font-size:.875rem;font-weight:650;color:var(--watch);margin-top:2px}
.condition-entry{margin-top:var(--s4);border-radius:8px;outline-offset:4px}
.condition-entry .inline-lab{margin-bottom:0}
.weight-hint:empty{display:none}

/* callouts */
.note{border-radius:10px;padding:var(--s4);font-size:.9375rem;line-height:1.5;margin-bottom:var(--s4);color:var(--ink-2);overflow-wrap:anywhere}
.note b{display:block;color:var(--ink);font-weight:650;font-size:1rem;margin-bottom:4px}
.note.hold{background:var(--accent-soft);border-left:3px solid var(--accent)}
.note.good{background:var(--good-soft);border-left:3px solid var(--good)}
.note.warn{background:var(--watch-soft);border-left:3px solid var(--watch)}
.note.bad{background:var(--alert-soft);border-left:3px solid var(--alert)}
.note.plain{background:var(--surface-2);border-left:3px solid var(--rule-2)}

/* streak */
.streak{display:flex;gap:4px}
.streak span{flex:1;min-height:26px;border-radius:4px;border:1px solid var(--rule-2);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--ink-3);background:var(--surface)}
.streak span.clean{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.streak span.broken{background:var(--alert);border-color:var(--alert);color:var(--on-accent)}

// Independent of the data modules: a failed download must still offer recovery.
(() => {
  const pageVersion=document.documentElement.dataset.version;

  let registration=null,started=false,startupFailed=false,requestedReload=false,lastCheck=0,checking=false;

  const canReload=()=>!document.querySelector('#main [data-dirty],#main [data-stool]')&&(!window.appCanUpdate||window.appCanUpdate());
  function startupFailure(){
    if(started)return;
    startupFailed=true;const error=document.getElementById('gate-err');
    error.textContent='Murphy’s Logs could not finish loading. Check your connection, then try again. Retrying does not reset your log.';
    error.classList.remove('hide');document.getElementById('boot-retry').classList.remove('hide');
    // The form region holds the retry button; never leave a failed start-up on "Opening".
    for(const id of ['gate-form','gate-help'])document.getElementById(id).classList.remove('hide');
    document.getElementById('gate-opening').classList.add('hide');
    document.getElementById('signin').textContent='App unavailable';
  }
  const deadline=setTimeout(startupFailure,20000);
  function message(worker,type,timeout=2500){
    if(!worker)return Promise.resolve(null);
    return new Promise(resolve=>{
      const channel=new MessageChannel();
      const finish=value=>{clearTimeout(timer);channel.port1.close();resolve(value)};
      const timer=setTimeout(()=>finish(null),timeout);
      channel.port1.onmessage=event=>finish(event.data?.type==='MURPHY_STATUS'?event.data:null);
      try{worker.postMessage({type},[channel.port2])}catch{finish(null)}
    });
  }
  async function inspect(){
    if(!registration)return;
    const [active,waiting]=await Promise.all([message(registration.active,'MURPHY_STATUS'),message(registration.waiting,'MURPHY_STATUS')]);
    state.activeVersion=active?.version||null;
    state.offlineReady=active?.version===pageVersion?active.offlineReady:null;
    state.updateReady=!!registration.waiting||!!(active&&active.version!==pageVersion);
    state.waitingReady=waiting?.offlineReady===true;
    emit();
  }
  function watch(reg){
    registration=reg;
    const track=()=>{
      const worker=reg.installing;if(!worker)return;
      worker.addEventListener('statechange',()=>{
        if(worker.state==='installed'||worker.state==='activated')void inspect();
        if(worker.state==='redundant'){state.message='The update could not be prepared. Your current app and saved records are kept.';emit();}
      });
    };
    if(!reg.__murphyWatched){reg.__murphyWatched=true;reg.addEventListener('updatefound',track);}
    track();void inspect();
  }
  async function check(repair=false){
    if(!state.available||checking)return;
    checking=true;state.busy=true;state.message='';emit();lastCheck=Date.now();
    try{
      if(!registration||!registration.active&&!registration.waiting&&!registration.installing)watch(await navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}));

        }

        const worker=registration.waiting||registration.active;
        const result=await message(worker,'MURPHY_REPAIR',25000);
        state.message=result?.error||(result?.offlineReady?'App files are ready for offline opening.':worker?'Offline opening could not be confirmed. Reconnect and try again.':'Preparing offline opening. Check again once the app finishes downloading.');
      }

    }finally{await inspect();checking=false;state.busy=false;emit();}
  }
  async function update(){
    if(state.busy)return;
    if(!canReload()){state.message='Save or cancel unfinished entries before updating.';emit();return;}
    if(!registration){await check();return;}
    if(!registration.waiting){
      if(state.activeVersion&&state.activeVersion!==pageVersion&&canReload())location.reload();
      else await check();
      return;
    }
    state.busy=true;state.message='';requestedReload=true;emit();
    const result=await message(registration.waiting,'MURPHY_ACTIVATE');
    if(!result?.offlineReady){requestedReload=false;state.busy=false;state.message='The update files are not ready. Use Check offline access in Settings when connected.';emit();}
  }
  window.AppShell={state,check,update,ready(){
    started=true;clearTimeout(deadline);document.getElementById('boot-retry').classList.add('hide');
    if(startupFailed){document.getElementById('gate-err').classList.add('hide');document.getElementById('gate-err').textContent='';startupFailed=false;}
    document.getElementById('signin').disabled=false;document.getElementById('signin').textContent='Sign in';
    // If Auth never reports a state, still offer the form rather than "Opening" forever.
    setTimeout(()=>{if(!window.appAuthKnown){
      for(const id of ['gate-form','gate-help'])document.getElementById(id).classList.remove('hide');
      document.getElementById('gate-opening').classList.add('hide');
    }},4000);
  }};
  document.getElementById('boot-retry').addEventListener('click',()=>location.reload());
  document.addEventListener('click',event=>{
    const action=event.target.closest('[data-shell-act]')?.dataset.shellAct;
    if(action==='update')void update();if(action==='check')void check(true);
  });
  window.addEventListener('error',startupFailure,true);
  window.addEventListener('unhandledrejection',startupFailure);
  if(state.available){
    navigator.serviceWorker.addEventListener('message',event=>{if(event.data?.type==='MURPHY_STATUS')void inspect()});
    navigator.serviceWorker.addEventListener('controllerchange',async()=>{
      await inspect();
      if(requestedReload){
        requestedReload=false;state.busy=false;
        if(canReload())location.reload();
        else{state.updateReady=true;state.message='The update is ready. Save or cancel the entry you started, then choose Update app.';emit();}
      }
    });
    window.addEventListener('load',()=>void check());
    window.addEventListener('online',()=>void check());
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastCheck>60000)void check()});
  }
})();

const mealSettings = saved => ({...DEFAULTS,...saved,eggKcal:DEFAULTS.eggKcal,brothKcal:DEFAULTS.brothKcal});

const DAY_MS = 86400000;
const dateDays = new Map();
function toDay(iso){
  if (!dateDays.has(iso)){
    if (dateDays.size > 4096) dateDays.clear();
    dateDays.set(iso, Math.floor(Date.parse(iso + 'T00:00:00Z') / DAY_MS));
  }
  return dateDays.get(iso);
}
const esc = (s)=> String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toIso = (d) => new Date(d * DAY_MS).toISOString().slice(0, 10);
// Calendar labels, not elapsed hours: safe across London midnight and BST changes.
const shiftDate = (iso, days) => toIso(toDay(iso) + days);
const validDate = iso => typeof iso==='string' && /^\d{4}-\d{2}-\d{2}$/.test(iso) && Number.isFinite(toDay(iso)) && toIso(toDay(iso))===iso;
const validTime = time => typeof time==='string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(time);
const cleanIsoDate = iso => { if (typeof iso!=='string') return ''; const clean=esc(iso.trim()); return validDate(clean)?clean:''; };
const cleanTime = time => { if (typeof time!=='string') return ''; const clean=esc(time.trim()); return validTime(clean)?clean:''; };
const isFedMeal = meal => !!meal?.recipe && validTime(meal.fedAt);
function mondayOf(iso){ const d = toDay(iso); const w = new Date(d*DAY_MS).getUTCDay(); return d - ((w+6)%7); }
const minsOf = (t) => { const [h,m] = String(t||'00:00').split(':').map(Number); return h*60+m; };
const round1 = (x) => Math.round(x*10)/10;

function inForce(sch, iso, key){
  let val=null, best=-Infinity;
  for (const e of (sch||[])){ const d=toDay(e.from); if (d<=toDay(iso) && d>=best){ best=d; val=e[key]; } }
  return val;
}
const oilMlOn  = (iso,s) => { const v=inForce(s.oilSchedule,iso,'ml');  return v===null?0:v; };
const fibreGOn = (iso,s) => { const v=inForce(s.fibreSchedule,iso,'g'); return v===null?0:v; };
const adjustmentOn = (iso, ch) => (ch||[]).reduce((a,c)=> toDay(c.date)<=toDay(iso) ? a+(c.deltaG||0) : a, 0);

function bowlFor(iso, recipeId, s, changes, extras){
  const r = RECIPES.find(x=>x.id===recipeId); if (!r) return null;
  s = mealSettings(s);
  const ex = mealDefaults({...extras,recipe:recipeId});
  const bdKcal = r.kcal100 * (s.bdGrams/100);
  const oilMl = ex.oilGiven ? oilMlOn(iso,s) : 0;
  const oilKcal = round1(oilMl * s.kcalPerMlOil);
  const fibreG = ex.fibreGiven ? fibreGOn(iso,s) : 0;
  const eggKcal = ex.egg ? s.eggKcal : 0, brothKcal = ex.broth ? s.brothKcal : 0;
  const extrasKcal = eggKcal + brothKcal;
  const adjustment = adjustmentOn(iso, changes);
  const darfBase = (s.targetKcal - bdKcal - oilKcal - extrasKcal) / s.kcalPerGDarf;
  const overTarget = bdKcal + oilKcal + extrasKcal > s.targetKcal;
  let darfG = Math.round(darfBase + adjustment), floored = false;
  if (darfBase <= 0) darfG = 0;
  else if (darfG < s.darfMinG){ darfG = s.darfMinG; floored = true; }
  darfG = Math.max(0,darfG);
  return { recipe:r, bdGrams:s.bdGrams, bdKcal, oilMl, oilKcal, fibreG, eggKcal, brothKcal, extrasKcal,
    adjustment, darfBase:round1(darfBase), darfG, floored, overTarget,
    totalKcal: Math.round(bdKcal + oilKcal + extrasKcal + darfG*s.kcalPerGDarf) };
}

function mealDefaults(meal={}){
  // An older saved boolean is an explicit choice, even when it is false.
  const oilDefaultMode = meal.oilDefaultMode!=='auto'&&typeof meal.oilGiven==='boolean' ? 'manual' : 'auto';
  return {...meal,egg:meal.egg??false,broth:meal.broth??false,fibreGiven:meal.fibreGiven??true,
    oilDefaultMode,oilGiven:oilDefaultMode==='auto'? !RECIPES.find(r=>r.id===meal.recipe)?.noOil : meal.oilGiven};
}
const isEditablePlan = (iso,meal) => iso>=localToday()&&!isFedMeal(meal);
function calculatedMeal(iso,meal){

      Math.round(b.bdKcal+b.oilKcal+b.extrasKcal+m.darfFed*S.settings.kcalPerGDarf):b.totalKcal}:m;
}

function windowMean(weights, endDay, len){
  const start = endDay - len + 1, seen = new Set();
  let sum=0;
  for (const w of weights||[]){
    if (!w || !Number.isFinite(w.kg) || w.kg<=0 || w.weightMissed===true || w.missed===true) continue;
    const d=toDay(w.date);
    if (d<start || d>endDay || !Number.isFinite(d) || seen.has(d)) continue;
    seen.add(d); sum+=w.kg;
  }
  return { n:seen.size, mean:seen.size?sum/seen.size:null, from:toIso(start), to:toIso(endDay) };
}

function fiveEntryWeightMean(weights, iso){
  const valid = (weights||[]).filter(w => w && Number.isFinite(w.kg) && w.kg > 0 && w.weightMissed !== true && w.missed !== true && (!iso || w.date <= iso));
  const entries = valid.slice(-5);
  const n = entries.length;
  const mean = n ? entries.reduce((acc, w) => acc + w.kg, 0) / n : null;
  return { n, mean, from: n ? entries[0].date : null, to: n ? entries.at(-1).date : null };
}

/* Weekly ration rule: Body Condition Score (BCS) is the sole deciding factor for DARF adjustments. */
function computeDarfAdjustment({ weights=[], asOf, currentOffsetG=0, lastAdjustmentWeek=null,
  bcs7dMean=null, regimeChanges=[], settings={} } = {}){
  const cfg = { ...DEFAULTS, ...settings };
  const thisWeek = mondayOf(asOf), endDay = thisWeek - 1;
  const current = windowMean(weights, endDay, cfg.windowDays);
  const previous = windowMean(weights, endDay - cfg.windowDays, cfg.windowDays);
  const pct = (current.mean != null && previous.mean != null) ? ((current.mean - previous.mean) / previous.mean) * 100 : null;

  const out = { asOf, weekStart:toIso(thisWeek),
    currentWindow:[current.from,current.to], previousWindow:[previous.from,previous.to],
    previousMean:previous.mean, currentMean:current.mean, previousN:previous.n, currentN:current.n,
    percentChange:pct, fullCorrectionG:null, rawStepG:null,
    bcs:bcs7dMean,
    adjustmentG:0, applied:false, limitedBy:null, held:false, reason:'' };

  if (lastAdjustmentWeek && mondayOf(lastAdjustmentWeek) >= thisWeek){
    out.reason = 'Adjustment already recorded this week.'; return out; }
  if (cfg.suppressOnRegimeChange){
    const lo=toDay(previous.from), hi=toDay(current.to);
    const hit=(regimeChanges||[]).find(d=>{const n=toDay(d);return n>=lo&&n<=hi;});
    if (hit){ out.reason = `Ration changed on ${fmtDate(hit)} inside these windows; the comparison is confounded, so hold.`; return out; }
  }

  // BCS is the sole deciding factor for changing DARF ration. Weight trends are decoupled.
  // The clinical ideal reference is 5.0 on the 9-point WSAVA scale, decoupled from legacy chart settings.
  const BCS_RATION_TARGET = 5.0;
  if (bcs7dMean === null || !Number.isFinite(bcs7dMean)){
    out.reason = 'No Body Condition Score (BCS) recorded in the assessment period: ration held.';
    return out;
  }

  const bcs = bcs7dMean;
  // Discretize to clinical half-point steps (e.g. 5.0 -> 0 g, 5.5 -> -5 g, 6.0 -> -10 g, 4.5 -> +5 g, 4.0 -> +10 g).
  // Deviations within +/-0.25 of ideal 5.0 fall in the deadband and hold current ration.
  // Symmetric tie-breaking: round magnitude, then restore direction.
  const bcsDelta = BCS_RATION_TARGET - bcs;
  const bcsStep = Math.sign(bcsDelta) * Math.round(Math.abs(bcsDelta) * 2) / 2;
  if (Math.abs(bcsStep) < 0.25){
    out.reason = `Body condition score is ideal (${bcs.toFixed(1)} / 9): hold current ration.`;
    return out;
  }

  const rawStep = bcsStep * 10;
  out.rawStepG = rawStep;
  let step = Math.round(rawStep);

  const direction = Math.sign(step);
  if (Math.abs(step) > cfg.maxStepG){ step = Math.sign(step) * cfg.maxStepG; out.limitedBy = 'maxStepG'; }
  const projected = currentOffsetG + step;
  if (Math.abs(projected) > cfg.maxCumulativeG){
    step = Math.trunc(Math.sign(projected) * cfg.maxCumulativeG - currentOffsetG);
    if (Math.sign(step) !== direction) step = 0;   // Never reverse advice.
    out.limitedBy = 'maxCumulativeG';
  }
  if (Math.abs(step) > cfg.maxStepG){
    step = Math.sign(step) * cfg.maxStepG;
    out.limitedBy = 'maxStepG';
  }
  if (step === 0){
    out.reason = `Mean condition score ${bcs.toFixed(1)} calls for a change, but the ±${cfg.maxCumulativeG} g cumulative cap is reached.`;
    return out;
  }

  out.adjustmentG = step; out.applied = true;
  out.reason = `Mean condition score ${bcs.toFixed(1)} is ${bcs > BCS_RATION_TARGET ? 'above' : 'below'} ideal (${BCS_RATION_TARGET.toFixed(1)}): `
    + `${step > 0 ? 'increase' : 'reduce'} DARF by ${Math.abs(step)} g`
    + (out.limitedBy ? ` and held at the ${out.limitedBy==='maxStepG'?'single-step':'cumulative'} cap.` : '.');
  return out;
}

function attributionFor(stoolIso, meals){
  // Murphy's tracking convention. Legacy overrides remain stored, but cannot
  // replace the confirmed meal from exactly the preceding calendar date.
  const date=shiftDate(stoolIso,-1);
  return {primary:(meals||[]).find(m=>m.date===date&&isFedMeal(m))||null,
    secondary:null,assumed:false,overridden:false};
}

function dayVerdict(day){
  const st = (day && day.stools) || [];
  if (!st.length) return 'pause';
  return st.some(s => s.bristol<3 || s.bristol>4 || s.mucus || s.blood) ? 'broken' : 'clean';
}
function fibreStreak(days, sinceIso, todayIso){
  const out=[]; let count=0;
  for (let d=toDay(sinceIso)+1; d<=toDay(todayIso); d++){
    const iso=toIso(d), v=dayVerdict(days[iso]);
    if (v==='clean') count++; else if (v==='broken') count=0;
    out.push({date:iso, verdict:v});
  }
  return { count, days:out };
}
function fibreAdvice(days, todayIso, s){
  const dose = fibreGOn(todayIso,s), since = inForce(s.fibreSchedule,todayIso,'from');
  const res = { dose, since, streak:0, chips:[], advice:null, review:false, note:'' };
  if (!since) return res;
  const st = fibreStreak(days, since, todayIso);
  res.streak = st.count;
  res.chips = st.days.slice(-s.fibreStreakDays);
  const daysAtDose = toDay(todayIso) - toDay(since);

  const prior = (s.fibreSchedule||[]).filter(e=>toDay(e.from)<toDay(since)).sort((a,b)=>toDay(a.from)-toDay(b.from));
  const previousDose = prior.length ? prior[prior.length-1].g : null;
  if (previousDose !== null && dose > previousDose && daysAtDose <= s.fibreStepBackDays){
    // Rolling three-day flags; 3, 5, 6 and 7 contain at least two loose days.
    let bits=0, seen=0;
    for(let d=toDay(since)+1;d<=toDay(todayIso);d++){
      const loose=(days[toIso(d)]?.stools||[]).some(x=>x.bristol>=5);
      bits=((bits<<1)|Number(loose))&7; seen++;
      if(seen>=3&&[3,5,6,7].includes(bits)){
        res.advice={kind:'down',toG:previousDose,text:`Loose stools since the step to ${dose} g. Return to ${previousDose} g.`};
        return res;
      }
    }
  }
  if (dose < s.fibreRestG && res.streak >= s.fibreStreakDays){
    const toG = Math.min(dose + s.fibreStepG, s.fibreRestG);
    res.advice = { kind:'up', toG, text:`${res.streak} clean days. Step Pro-Fibre from ${dose} g to ${toG} g.` };
    return res;
  }
  if (dose >= s.fibreRestG){
    res.note = `Resting at ${dose} g. This is the advice ceiling.`;
    if (daysAtDose >= s.fibreReviewMinDays){
      let bad=0;
      for (let d=toDay(todayIso)-s.fibreReviewWindow+1; d<=toDay(todayIso); d++){
        const st2=(days[toIso(d)]||{}).stools||[];
        if (st2.length && st2.some(x=>x.bristol<3||x.bristol>4||x.mucus)) bad++;
      }
      if (bad >= s.fibreReviewBadDays){
        res.review = true;
        res.note = `${bad} of the last ${s.fibreReviewWindow} logged days were outside Bristol 3 to 4 or carried mucus, after ${daysAtDose} days at ${dose} g. Stool not settling at ${s.fibreRestG} g needs vet review: faecal pathogens, pancreatic lipase and raw handling. Settings allows manual doses up to ${s.fibreCapG} g; the app never advises an increase above the ceiling.`;
      }
    }
  }
  return res;
}

function bcsMean(days,todayIso,n){
  let sum=0,count=0;
  for(let d=toDay(todayIso)-n+1;d<=toDay(todayIso);d++){
    const value=days[toIso(d)]?.bcs;
    if(Number.isFinite(value)){sum+=value;count++;}
  }
  return {mean:count?sum/count:null,n:count};
}

function vetItems(days, todayIso, weights, s){
  const items=[], within=(iso,n)=>toDay(iso)>toDay(todayIso)-n;
  const all=Object.keys(days).sort();
  const blood=all.filter(d=>(days[d].stools||[]).some(x=>x.blood)||(days[d].events||[]).includes('blood'));
  if (blood.length) items.push({sev:'r',title:'Blood recorded',dates:blood,text:'Never aged out of this list.'});
  const vacant=all.filter(d=>within(d,s.vetWindowDays)&&(days[d].events||[]).includes('vacant'));
  if (vacant.length) items.push({sev:'r',title:'Vacant episode',dates:vacant,text:'Video it if it happens again. For an episodic neurological sign a video is the single most useful thing a vet can be given.'});
  const leth=all.filter(d=>within(d,s.vetWindowDays)&&(days[d].events||[]).includes('lethargic'));
  if (leth.length) items.push({sev:'a',title:'Lethargy',dates:leth,text:''});
  const vom=all.filter(d=>within(d,7)&&(days[d].events||[]).includes('vomited'));
  if (vom.length>=2) items.push({sev:'a',title:'Vomited on two or more days this week',dates:vom,text:''});
  const six=[];
  for (let i=1;i<all.length;i++){
    const a=all[i-1], b=all[i];
    if (toDay(b)-toDay(a)!==1) continue;
    const bad=d=>(days[d].stools||[]).some(x=>x.bristol>=6);
    if (bad(a)&&bad(b)&&within(b,s.vetWindowDays)) six.push(b);
  }
  if (six.length) items.push({sev:'a',title:'Bristol 6 or 7 on consecutive days',dates:six,text:''});
  const ref=all.filter(d=>within(d,7)&&days[d].meal&&days[d].meal.bowl==='refused');
  if (ref.length>=2) items.push({sev:'a',title:'Bowl refused twice this week',dates:ref,text:''});
  const end=toDay(todayIso);
  const w2=windowMean(weights,end,14), w2p=windowMean(weights,end-14,14);
  if (w2.mean&&w2p.mean&&(w2.mean-w2p.mean)/w2p.mean<=-0.02){
    const nights=all.filter(d=>within(d,14)&&days[d].meal&&days[d].meal.bowl);
    if (nights.length>=4&&nights.every(d=>days[d].meal.bowl==='cleared'))
      items.push({sev:'a',title:'Losing weight with a cleared bowl',dates:[],
        text:'Down 2% or more over a fortnight while eating everything put down. Loss with a normal appetite is a vet question rather than a ration question.'});
  }
  return items;
}

const localClock = new Intl.DateTimeFormat('en-GB', {timeZone:'Europe/London',
  year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
let clockMinute, clockValue;
function londonNow(){
  const now=Date.now(),minute=Math.floor(now/60000);
  if(minute!==clockMinute){
    const p=Object.fromEntries(localClock.formatToParts(new Date(now)).map(x=>[x.type,x.value]));
    clockValue={date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour}:${p.minute}`,hour:Number(p.hour)};
    clockMinute=minute;
  }
  return clockValue;
}

const refocus=id=>document.getElementById(id)?.focus({preventScroll:true});
function replaceRenderedHtml(target,html,outer=false){
  const active=document.activeElement;
  const recipe=active?.matches('select[data-act="recipe"],select[data-act="exportmonthselect"]')&&target.contains(active)?active:null;
  const replace=()=>{if(outer)target.outerHTML=html;else target.innerHTML=html;};
  if(!recipe){replace();return;}
  const template=document.createElement('template');template.innerHTML=html;
  const replacement=template.content.querySelector('select[id="'+recipe.id+'"]');
  if(!replacement){replace();return;}
  const nextRoot=outer?template.content.firstElementChild:template.content;
  const ancestors=(node,root)=>{
    const path=[];
    for(let parent=node.parentElement;parent&&parent!==root;parent=parent.parentElement){
      const attrs=Array.from(parent.attributes,a=>[a.name,a.value]).filter(([name])=>name!=='open').sort(([a],[b])=>a.localeCompare(b));
      path.push([parent.tagName,attrs]);
    }
    return path;
  };
  // Navigation can show the same date in a different editor structure.
  if(JSON.stringify(ancestors(recipe,target))!==JSON.stringify(ancestors(replacement,nextRoot))){replace();return;}
  // Keep the native select AND its ancestor chain connected during saves/sync.
  // Replacing it then calling focus() can reopen iOS's just-dismissed picker.
  // Only the surrounding content changes; keyboard focus stays on the same node.
  const update=(current,next)=>{
    const kept=Array.from(current.children).find(el=>el.contains(recipe));
    const incoming=Array.from(next.children).find(el=>el.contains(replacement));
    if(kept!==recipe)update(kept,incoming);
    const before=[],after=[];let passed=false;
    for(const node of Array.from(next.childNodes)){
      if(node===incoming){passed=true;continue;}
      (passed?after:before).push(node);
    }
    while(kept.previousSibling)kept.previousSibling.remove();
    while(kept.nextSibling)kept.nextSibling.remove();
    kept.before(...before);kept.after(...after);
  };
  update(target,nextRoot);
  const value=replacement.value;
  const optionShape=select=>Array.from(select.options,option=>[option.value,option.text,option.disabled]);
  // A remote/legacy recipe can add an unknown option; ordinary saves keep options too.
  if(JSON.stringify(optionShape(recipe))!==JSON.stringify(optionShape(replacement)))recipe.replaceChildren(...replacement.childNodes);
  if(recipe.value!==value)recipe.value=value;
}
function focusAfterRender(selector,fallback='#main h2.screen'){
  const target=$(selector)||(fallback&&$(fallback)); if(!target)return;
  for(let parent=target.parentElement;parent;parent=parent.parentElement)if(parent.tagName==='DETAILS')parent.open=true;
  if(!target.matches('input,select,textarea,button,a,summary,[tabindex]'))target.tabIndex=-1;
  target.focus({preventScroll:true});
  target.scrollIntoView({block:'start',behavior:'instant'});
}

  if(tab==='day')announceHistoryDate();
}

// Feedback has its own persistent region, including while a form defers rendering.
function renderFeedback(){
  const region=$('#feedback');if(!region||!S.user)return;
  const b=S.banner,u=S.undo,app=window.AppShell?.state;
  let html=b?`<div class="note ${esc(b.kind)}" ${b.kind==='bad'?'role="alert"':''}><b>${esc(b.title)}</b>${b.compact?'':esc(b.text)}<div class="feedback-actions">${b.retry?'<button id="retry-sync" class="link" data-act="retrysync">Retry sync</button>':''}${b.view&&validDate(b.view)?`<button id="view-saved-day" class="link" data-act="openday" data-date="${b.view}">View in History</button>`:''}${b.compact?'':'<button id="dismiss-notice" class="link" data-act="dismiss-banner">Dismiss</button>'}</div></div>`:'';
  // Another notice can replace the detailed sync error without resolving it.
  if(recordStatus.text==='Saved locally; retry sync'&&!b?.retry)
    html+='<div class="note warn"><b>Sync pending</b><div class="feedback-actions"><button id="retry-sync" class="link" data-act="retrysync">Retry sync</button></div></div>';
  if(draftRecovery&&draftUser===S.user.uid)html+=`<div class="note plain"><b>Unfinished entries available</b><span>A previous app session left entries on this device. Restore them to review before saving.</span><div class="feedback-actions"><button id="recover-draft" class="link" data-act="recoverdraft">Restore entries</button><button id="dismiss-draft" class="link" data-act="dismissdraft">Later</button></div></div>`;
  html+=hiddenDraftLinks();
  if(u&&(undoSticky(u)||S.undoBusy))html+=undoNote(u);
  scheduleUndoExpiry(u);
  if(unreadableOutbox.length)html+=`<div class="note warn" role="alert"><b>${unreadableOutbox.length===1?'One saved change can’t be read':unreadableOutbox.length+' saved changes can’t be read'}</b><span>Your other entries are shown and kept on this device. Changes saved after it are held back from syncing until you deal with it.</span><div class="feedback-actions"><button class="link" id="outbox-recovery-file" data-act="outboxrecovery">Save recovery file</button><button class="link" id="outbox-set-aside" data-act="outboxsetaside">Set aside and continue syncing</button></div></div>`;
  if(app?.updateReady)html+=`<div class="note plain"><b>A new app version is ready</b><span>Your saved records are kept. Save or cancel unfinished entries before updating.</span><div class="feedback-actions"><button id="update-app" class="link" data-shell-act="update" ${app.busy?'disabled':''}>${app.busy?'Preparing update…':'Update app'}</button></div>${app.message?`<p class="sub">${esc(app.message)}</p>`:''}</div>`;
  if(region.innerHTML!==html){const focused=region.contains(document.activeElement)?document.activeElement.id:null;region.innerHTML=html;if(focused)refocus(focused);}
}
let renderPending=false,rendered='';
function render(force=false){
  if (!S.user) return;
  if(S.ready&&draftUser!==S.user.uid){
    loadDrafts();force=true;
    if(draftRecovery)void autoRestoreDraft();
  }
  renderFeedback();
  if (!S.ready){rendered='';$('#main').innerHTML='<p role="status">Loading saved records…</p>';return;}
  // Saved assessments refresh even while unrelated drafts defer the editable page.
  refreshWeightConditionViews();
  const overview=weightOverview(localToday()),outside=kg=>['above','below'].includes(weightAssessment(kg).status);
  const needs=outside(overview.latest?.kg)||outside(overview.mean.mean)||currentVetItems(insights().vet,localToday()).length||weeklyAdvice().applied||fibreAdviceVisible(insights().fib);
  $('#tabbar .dotmark')?.classList.toggle('hide',!needs);
  $('#review-attention')?.classList.toggle('hide',!needs);
  syncBcsGuidance();
  if (!force && $('#main [data-dirty],#main [data-stool]')){renderPending=true;refreshTodoCard();refreshMealPlans();refreshSelectionStates();restoreDraftInputs();renderFeedback();return;}
  renderPending=false;
  S.tab=normalizeTab(S.tab);
  // The cursor belongs to History's day editor; other screens leave its selection untouched.
  if(S.tab==='day'&&!S.cursor)S.cursor=shiftDate(localToday(),-1);
  const dest=navDestination(S.tab);
  $$('#tabbar button').forEach(b=>{
    const active=b.dataset.tab===dest;
    b.classList.toggle('on',active);
    if (b.dataset.tab===S.tab) b.setAttribute('aria-current','page');
    else if (active) b.setAttribute('aria-current','true');
    else b.removeAttribute('aria-current');
  });
  $('#main').className=['today','day','history','review'].includes(S.tab)?'wide':'';
  const html=S.tab==='today'?viewToday():S.tab==='day'?viewDay():S.tab==='review'?viewReview():S.tab==='history'?viewHistory():viewSettings();
  // Unchanged markup skips replacement, but a handler may just have cleared a draft (CX-05).
  if(!force&&html===rendered){syncDraftMarkers();return;}
  rendered=html;
  const active=document.activeElement, focus=active?.id, summaryId=!focus&&active?.tagName==='SUMMARY'?active.parentElement?.id:'', staged=!!pendingDraft;
  // Review actions disappear after a decision. Keep keyboard focus on their
  // updated result, while a still-available action (including a failed save)
  // keeps its own focus. This is presentation only; saving is unchanged.
  const focusResult=active?.closest?.('[data-review-result]')?.id;
  const expanded=$$('#main details[id]').map(e=>[e.id,e.open]);
  replaceRenderedHtml($('#main'),html);
  for(const [id,open] of expanded){const e=document.getElementById(id);if(e)e.open=open;}
  if(!staged){
    if(focus&&document.activeElement?.id!==focus)refocus(document.getElementById(focus)?focus:focusResult);
    else if(summaryId)document.getElementById(summaryId)?.querySelector(':scope > summary')?.focus({preventScroll:true});
  }
  restoreDraftInputs();
  if(!staged&&focus&&document.activeElement?.id!==focus){
    const btn=document.getElementById(focus);
    if(btn&&btn.tagName==='BUTTON')refocus(focus);
  }
  syncBcsGuidance();
  refreshWeightConditionViews();
  renderFeedback();
}
function leaveDraft(){
  if (!$('#main [data-dirty],#main [data-stool]')&&!draftFields.length&&!draftStools.length) return true;
  if (!confirm('Discard all unconfirmed drafts in this app session?')) return false;
  for(const form of $$('#main [data-dirty]')){
    const input=$('input,textarea',form);if(input)clearSaveError((form.hasAttribute('data-feeding')?'feeding:':'form:')+input.id);
    form.removeAttribute('data-dirty');
  }
  if(stoolDraft)clearSaveError('stool:'+S.adding+':'+stoolDraft.id);
  for(const field of draftFields)clearSaveError((field.key==='feeding'?'feeding:':'form:')+field.id);
  for(const stool of draftStools)clearSaveError('stool:'+stool.date+':'+stool.record.id);
  draftFields=[];draftStools=[];draftExpanded=[];activeStoolKey=null;
  S.adding=null; stoolDraft=null; stoolOriginal=null; persistDrafts(); render(true); return true;
}

const BOWLS=['cleared','left','refused'];

function refreshTodoCard(){

const UNSAVED_LABELS={weight:'Weight',walkMin:'Walk minutes',walkKm:'Walk distance',activeMin:'Active minutes',treats:'Treats',
  notes:'Notes',darfFed:'Grams fed',mealamount:'Supplement amount',feeding:'Feeding time'};
// Typed but not yet saved for this screen's dates: visible dirty fields and hidden drafts.
function unsavedEntries(today){
  const dates=new Set([today,shiftDate(today,-1)]),out=new Map();
  for(const form of $$('#main [data-dirty]')){
    const input=$('input,textarea',form),key=form.dataset.key||'feeding';
    if(input&&dates.has(form.dataset.date)&&UNSAVED_LABELS[key])out.set(input.id,{id:input.id,key,date:form.dataset.date});
  }
  if(S.user&&draftUser===S.user.uid)for(const f of draftFields)
    if(dates.has(f.date)&&UNSAVED_LABELS[f.key]&&!out.has(f.id))out.set(f.id,{id:f.id,key:f.key,date:f.date});
  if(stoolDraft&&dates.has(S.adding))out.set('stool',{id:'stool',key:'stool',date:S.adding});
  return [...out.values()];
}
function todoCard(today){
  const miss=missingFor(today), last=trackingMeal(today), meal=plannedMeal(today);
  const unsaved=unsavedEntries(today).map(u=>`<button class="chip unsaved-chip" id="todo-${today}-unsaved-${esc(u.id)}" data-act="jump" data-k="unsaved" data-field="${esc(u.id)}" data-date="${today}">${u.key==='stool'?'Stool':UNSAVED_LABELS[u.key]}${u.date!==today?` (${fmtShort(u.date)})`:''} typed, not saved</button>`).join('');
  // The evening meal's state belongs to this list too, but not to missingFor's
  // observation set, which History and its completeness note also use.
  const tonight=today===localToday()?'tonight’s':'the evening';
  if(!isFedMeal(meal))miss.push({k:'meal',t:meal.recipe?`${tonight} meal not fed yet`:`${tonight} recipe not chosen`});
  if(!miss.length&&!unsaved)return `<div class="note good" id="todo-${today}" data-todo="${today}" tabindex="-1"><b>Core observations recorded</b>Stools, weight and condition are recorded, and ${tonight} meal is marked as fed. You can keep editing throughout the day.</div>`;
  // A confirmed (Fed) meal can take its result here in one tap. A planned-only
  // meal still opens History, where its feeding time is recorded first.
  const prompt=last&&!last.bowl?`<div class="bowl-prompt" role="group" aria-labelledby="bowl-prompt-${last.date}"><p class="inline-lab" id="bowl-prompt-${last.date}">Last night’s bowl · ${esc(RECIPES.find(r=>r.id===last.recipe)?.short||last.recipe)}, fed ${esc(last.fedAt)}</p><div class="seg">${BOWLS.map(k=>`<button id="bowl-prompt-${last.date}-${k}" ${choice(false)} data-act="bowl" data-k="${k}" data-date="${last.date}">${bowlLabel(k)}</button>`).join('')}</div></div>`:'';
  const links=miss.filter(x=>!(prompt&&x.k==='bowl')).map(x=>`<button class="chip" id="todo-${today}-${x.k}" data-act="jump" data-k="${x.k}" data-date="${today}">${x.t}</button>`).join('');
  return `<section class="card sec todo" id="todo-${today}" data-todo="${today}" tabindex="-1" aria-labelledby="todo-title-${today}"><h3 class="lab" id="todo-title-${today}">Still to log</h3>${unsaved?`<div class="chips unsaved-chips">${unsaved}</div>`:''}${links?`<div class="chips">${links}</div>`:''}${prompt}</section>`;
}

const validSettingNumber=(n,spec)=>Number.isFinite(n)&&
  (spec.exclusiveMin?n>spec.min:n>=spec.min)&&n<=spec.max&&
  (!spec.integer||Number.isInteger(n))&&
  (spec.step==null||Math.abs((n-spec.min)/spec.step-Math.round((n-spec.min)/spec.step))<=1e-7);
function inputField(iso,k,label,min=0,max=600,step=1,helpText=''){
  const d=S.days[iso]||{}, value=k==='setnum'?S.settings[label]:k==='darfFed'?d.meal?.darfFed:d[k];
  const id='in-'+k+'-'+(k==='setnum'?label:iso);
  const spec=k==='setnum'?settingsSpec[label]:null,shownLabel=spec?.label||label;
  const guidance=spec?.help||helpText;
  const help=guidance?`<p class="field-help" id="${id}-help">${esc(guidance)}</p>`:'';
  const attrs=(spec?'required ':'')+(guidance?`aria-describedby="${id}-help ${id}-error"`:'');
  return `<div data-form data-date="${iso}" data-key="${k}" data-setting="${esc(label)}">
    ${k==='notes'?`<label class="inline-lab" for="${id}">Notes for ${fmtDate(iso)}</label><textarea id="${id}" class="tin" data-act="notes">${esc(value||'')}</textarea>`:
    `<div class="field"><label for="${id}">${esc(shownLabel)}</label><input id="${id}" type="number" inputmode="${(spec?.step||step)<1?'decimal':'numeric'}" enterkeyhint="done" min="${spec?.min??min}" max="${spec?.max??max}" step="${spec?.step||step}" value="${esc(value??'')}" data-act="${k}" ${attrs} placeholder="—"></div>${help}`}
    <p class="field-error hide" id="${id}-error" data-field-error role="alert"></p>
  </div>`;
}
function dailyFields(iso,{activityDate=iso,live=false}={}){
  const d=S.days[iso]||{};

  // Each form carries its rendered date through saving and midnight drafts.
  const activityHelp=`Activity date: ${fmtDate(activityDate)} ${activityDate.slice(0,4)}. `+
    (live?'Tractive completes its daily total at midnight. This value is saved against yesterday, not today. ':'This value is saved against the selected History date. ')+
    'Zero means no active minutes; leave blank if unknown.';
  const walkFields=inputField(iso,'walkMin','Minutes walked')+inputField(iso,'walkKm','Kilometres',0,80,.1);
  const activeField=inputField(activityDate,'activeMin',live?'Tractive Active Minutes':'Active minutes',0,1440,1,activityHelp);
  const activity=live?`<section class="activity-period" aria-labelledby="activity-today-${iso}"><h4 class="lab" id="activity-today-${iso}">Today</h4><div class="stack">${walkFields}</div></section><section class="activity-period" aria-labelledby="activity-yesterday-${iso}"><h4 class="lab" id="activity-yesterday-${iso}">Yesterday</h4>${activeField}</section>`:`<div class="stack">${walkFields}${activeField}</div>`;
  const events=`<div class="chips">${EVENTS.map(e=>`<button id="event-${iso}-${e.id}" ${choice((d.events||[]).includes(e.id),'chip ev')} data-act="event" data-id="${e.id}" data-date="${iso}">${e.label}</button>`).join('')}</div>`;
  // Today: daily logging and tonight's meal first; optional context folds to a summary.
  // History keeps the complete editor below for finding and correcting a day.
  if(live)return '<div class="daily">'+stoolsCard(iso,true)+weightConditionCard(iso)+liveMealEditor(iso)+
    todayFold('activity',iso,'Activity',activity)+
    todayFold('treats',iso,'Treats',inputField(iso,'treats','Dried necks and feet',0,10))+
    todayFold('events',iso,'Observations',`<p class="sub">Symptoms and events for ${fmtDate(iso)}. Tap to record or remove.</p>${events}`)+
    todayFold('notes',iso,'Notes',inputField(iso,'notes','Notes'))+'</div>';
  return '<div class="daily">'+stoolsCard(iso,live)+
    panel('Activity',activity,'activity-'+iso)+
    weightCard(iso)+
    panel('Condition',bcsScale(iso,d.bcs)+`<p class="sub" data-bcs-guidance data-date="${iso}">${bcsDescription(d.bcs)}</p>`,'condition-'+iso)+
    mealEditor(iso,live,live?`<div data-meal-plan="${iso}">${mealPlanDetails(iso)}</div>`:'')+
    panel('Treats',inputField(iso,'treats','Dried necks and feet',0,10))+
    panel('Events',events)+
    panel('Notes',inputField(iso,'notes','Notes'))+'</div>';
}
// Today keeps optional sections closed; each summary says what is recorded.
// Restored drafts open their fold (restoreDraftInputs), and
// render() keeps a fold the user opened open across saves.
function todayFold(kind,iso,title,body){
  return `<details class="card today-fold" id="${kind}-${iso}"><summary class="sec">${title} <span class="fold-strip" data-fold-summary="${kind}" data-date="${iso}">${foldSummary(kind,iso)}</span></summary><div class="sec">${body}</div></details>`;
}
function foldSummary(kind,iso){
  const d=S.days[iso]||{}, n=v=>Number.isFinite(v);
  if(kind==='activity'){
    // Tractive minutes belong to the previous day, as in the fields themselves.
    const yesterday=shiftDate(iso,-1), active=S.days[yesterday]?.activeMin;
    const parts=[n(d.walkMin)?`Walked ${d.walkMin} min`:'',n(d.walkKm)?`${d.walkKm} km`:'',n(active)?`Tractive ${fmtShort(yesterday)}: ${active} min`:''].filter(Boolean);
    return parts.length?esc(parts.join(' · ')):'Not recorded';
  }
  if(kind==='treats')return n(d.treats)?`Dried necks and feet: ${d.treats}`:'Not recorded';
  if(kind==='events'){
    const on=EVENTS.filter(e=>(d.events||[]).includes(e.id)).map(e=>e.label);
    return on.length?`<span class="watch-text">${esc(on.join(' · '))}</span>`:'None recorded · Add observation';
  }
  const note=typeof d.notes==='string'?d.notes.trim().split('\n')[0]:'';
  return note?esc(note.length>60?note.slice(0,59)+'…':note):'No notes';
}
function refreshFoldSummaries(){
  for(const el of $$('[data-fold-summary]')){
    const foldKind=esc(el.dataset.foldSummary), foldDate=esc(el.dataset.date);
    const html=foldSummary(foldKind,foldDate);if(el.innerHTML!==html)el.innerHTML=html;
  }
}
function switchRow(id,label,value,detail,attributes){
  return `<button type="button" class="switch-row" id="${id}" role="switch" aria-checked="${value===true}" aria-labelledby="${id}-label" aria-describedby="${id}-help" ${attributes}>
    <span class="switch-copy"><span class="switch-label" id="${id}-label">${esc(label)}</span><span class="switch-detail" id="${id}-help">${esc(detail)}</span></span>
    <span class="switch-control" aria-hidden="true"><span class="switch-state">${value===true?'On':value===false?'Off':'—'}</span><span class="switch-track"><span class="switch-thumb"></span></span></span></button>`;
}
function weightSwitch(iso,d){
  const previous=validWeight(d.weight)?d.weight:d.weightBeforeMissed?.kg;
  const detail=d.weightMissed===true?'Excluded from averages. Switch off '+(validWeight(previous)?`to restore ${previous} kg.`:'to enter a weight.'):'Mark this day as having no measurement.';
  return switchRow('weight-missed-'+iso,'Weight missed',d.weightMissed===true,detail,`data-act="missed" data-date="${iso}"`);
}
// The hidden #in-weight-<date> input is the form's one saved value (Murphy's net
// weight), so drafts, Save/Cancel and saveDay see the same single figure as
// before. The two visible readings only derive it (syncWeighIn).
function weighInField(iso){
  const d=S.days[iso]||{}, id='in-weight-'+iso, missed=d.weightMissed===true;
  const lock=missed?`disabled aria-describedby="weight-missed-${iso}-help ${id}-error"`:`aria-describedby="${id}-error"`;
  const reading=(part,label,hint)=>`<div class="field"><label for="in-weight${part}-${iso}">${label}</label><input id="in-weight${part}-${iso}" type="text" inputmode="decimal" enterkeyhint="${hint}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-weigh="${part}" ${lock} placeholder="—"></div>`;
  return `<div data-form data-date="${iso}" data-key="weight" data-save-label="Murphy’s weight">
    <input id="${id}" type="number" step="any" value="${esc(recordedWeight(d)??'')}" hidden ${missed?'disabled':''}>
    <div class="weigh-in" role="group" aria-label="Pre-feed weigh-in: Murphy’s weight is worked out from two readings">
      ${reading('solo','Your weight (solo), kg','next')}${reading('combined','Combined weight (holding Murphy), kg','done')}
      <output class="weigh-result" id="weigh-result-${iso}" for="in-weightsolo-${iso} in-weightcombined-${iso}" aria-live="polite" aria-atomic="true" data-weigh-result data-state="idle">${weighInIdle(iso)}</output>
    </div>
    <p class="field-error hide" id="${id}-error" data-field-error role="alert"></p>
  </div>`;
}
// draft: the unsaved net value of an open entry whose readings are blank (null if none is open).
function weighInIdle(iso,draft=null){
  if(draft!==null)return draft!==''?`Unsaved ${Number(draft).toFixed(2)} kg from an earlier entry. Enter both readings to save it.`:'Enter both readings again, or cancel this entry.';
  const kg=recordedWeight(S.days[iso]);
  return kg===null?'Before feeding: weigh alone, then holding Murphy.':`Saved ${weightNumber(kg)} kg · weigh again to replace it.`;
}
const weighInParts=form=>{
  if(form?.dataset.key!=='weight')return null;
  const parts=[$('[data-weigh="solo"]',form),$('[data-weigh="combined"]',form)];
  return parts.every(Boolean)?parts:null;
};
const readWeighIn=([solo,combined])=>weighInCheck(solo.value,combined.value);
// derive=false only refreshes the preview: a restored draft keeps its value.
function syncWeighIn(form,derive=true){
  const parts=weighInParts(form);if(!parts)return;
  const net=$('input',form), out=$('[data-weigh-result]',form), check=readWeighIn(parts);
  const untouched=parts.every(p=>p.value==='');
  if(derive){net.value=check.kg===null?'':String(check.kg);delete net.dataset.incompleteNumber;}
  // A comma is a decimal point (weighInCheck). Say how each comma reading was read,
  // so a thousands-style 1,000 shows as 1.00 kg before it can be saved.
  const commas=parts.map(p=>p.value.trim()).filter(v=>/^\d*,\d*$/.test(v)&&Number.isFinite(Number(v.replace(',','.'))));
  const note=commas.length?`<small class="weigh-note">${commas.map(v=>`${esc(v)} is read as ${Number(v.replace(',','.')).toFixed(2)} kg`).join(' · ')}</small>`:'';
  const [state,text]=check.kg!==null?['ready',`Murphy’s weight: <b>${check.kg.toFixed(2)} kg</b>`]:
    check.empty||untouched?['idle',weighInIdle(form.dataset.date,untouched&&form.hasAttribute('data-dirty')?net.value:null)]:
    ['invalid',esc(check.problem.message)];
  const html=text+note;
  if(out.dataset.state!==state)out.dataset.state=state;
  if(out.innerHTML!==html)out.innerHTML=html;
}
function weightCard(iso){
  return panel('Weight',weighInField(iso)+weightSwitch(iso,S.days[iso]||{})+weightHint(iso));
}
// Today: weight and condition are scored together. The target, range and means

const MEAL_FLAGS={egg:'Egg',broth:'Bone broth',fibreGiven:'Fibre',oilGiven:'Salmon oil'};
function mealFlagDetail(m,k,planning=false){

  const amount=k==='oilGiven'&&m.oilMl!=null?`${m.oilMl} ml ${label}`:k==='fibreGiven'&&m.fibreG!=null?`${m.fibreG} g ${label}`:
    planning&&k==='egg'?`1 egg · ${DEFAULTS.eggKcal} kcal`:planning&&k==='broth'?`50 ml · ${DEFAULTS.brothKcal} kcal`:'';
  return (m[k]===true?'Included in this meal':m[k]===false?'Not given':'Inclusion not recorded; turn on to include')+(amount?' · '+amount:'');
}
function mealFlags(iso,m){
  const planning=isEditablePlan(iso,m);
  return `<div class="meal-flags" role="group" aria-label="Included in the meal on ${fmtDate(iso)}">${Object.entries(MEAL_FLAGS).map(([k,label])=>switchRow('meal-'+k+'-'+iso,label,m[k],mealFlagDetail(m,k,planning),`data-act="extra" data-k="${k}" data-date="${iso}"`)).join('')}</div><p class="sub">For this meal only. ${planning?'Changing a switch recalculates the planned bowl; supplement schedules are kept.':'Recipe and inclusion corrections keep the original amounts and saved calorie estimate. Use Correct supplement amounts below to change a quantity explicitly.'}${Object.keys(MEAL_FLAGS).some(k=>typeof m[k]!=='boolean')?' A dash means inclusion was not recorded. Turn on, then off to confirm an item was not included.':''}</p>`;
}
function mealSummary(m){
  return `<dl class="meal-facts">${Object.entries(MEAL_FLAGS).map(([k,l])=>{
    const quantity=k==='oilGiven'&&m.oilMl!=null?`${m.oilMl} ml`:k==='fibreGiven'&&m.fibreG!=null?`${m.fibreG} g`:null;
    const inclusion=m[k]===true?'Included':m[k]===false?'Not given':'Inclusion not recorded';
    const text=quantity?(m[k]===true?quantity:`${inclusion} · ${quantity} originally recorded`):inclusion;

  }).join('')}</dl>`;

function mealAmountEditor(iso,m){
  if(isEditablePlan(iso,m)||!m.recipe)return '';

    const id=`meal-amount-${iso}-${key}`;
    return `<div data-form data-date="${iso}" data-key="mealamount" data-setting="${key}"><div class="field"><label for="${id}">${label}</label><input id="${id}" type="number" inputmode="decimal" enterkeyhint="done" min="0" step="0.1" value="${esc(m[key]??'')}" aria-describedby="${id}-help ${id}-error"></div><p class="field-help" id="${id}-help">Leave blank if the quantity is unknown. Save changes this quantity only.</p><p class="field-error hide" id="${id}-error" data-field-error role="alert"></p></div>`;

// Today's meal card. Mark as fed records the time now and the amounts shown
// directly above it; after feeding, the fed time and bowl result take its place.
function liveFeedingControls(iso,m){
  if(isFedMeal(m))return `<p class="fed-status" id="meal-fed-status-${iso}" tabindex="-1">Fed at ${esc(m.fedAt)}</p>`;
  const b=bowlFor(iso,m.recipe,S.settings,S.changes,m);
  if(!b)return '';
  // Mark as fed keeps an actual amount already saved for this meal (for example
  // after Undo Fed) rather than overwriting it, so explain it before the action.
  const kept=m.darfFed!=null&&m.darfFed!==b.darfG;
  return (kept?`<p class="sub watch-text" id="meal-fed-help-${iso}">Records the time now, the other amounts above and <b>${esc(m.darfFed)} g DARF</b> actually fed, saved earlier for this meal. The plan is ${b.darfG} g.</p><button class="link" id="meal-use-plan-${iso}" data-act="useplandarf" data-date="${iso}">Record the ${b.darfG} g plan instead</button>`:'')+
    `<button id="meal-fed-action-${iso}" class="btn" data-act="fed" data-date="${iso}" aria-describedby="meal-fed-help-${iso}">Mark as fed</button>`+
    (kept?'':`<p class="sub" id="meal-fed-help-${iso}">Records the time now and the amounts above.</p>`);
}
// Undo Fed lives under Edit meal, with the other corrections.

function todayMealAmounts(iso){
  const m=plannedMeal(iso), name=esc(RECIPES.find(x=>x.id===m.recipe)?.short||m.recipe||'');
  const item=(label,value)=>`<div><dt>${label}</dt><dd>${value}</dd></div>`;
  if(!m.recipe)return '<p class="muted">Choose a recipe under Change meal to see tonight’s amounts.</p>';
  if(isEditablePlan(iso,m)){
    const b=bowlFor(iso,m.recipe,S.settings,S.changes,m);
    if(!b)return `<p class="muted">Amounts are unavailable for ${name}. Choose a listed recipe under Change meal.</p>`;
    const kept=m.darfFed!=null&&m.darfFed!==b.darfG;
    return `<p class="meal-hero tonight"><span>${name} · ${kept?'DARF to record':'DARF Active'}</span><strong>${kept?esc(m.darfFed):b.darfG} g</strong></p><dl class="meal-amounts">`+
      (kept?item('DARF planned',b.darfG+' g'):'')+
      item('Bella &amp; Duke',b.bdGrams+' g')+item('Salmon oil',b.oilMl?b.oilMl+' ml':'None tonight')+item('Pro-Fibre',b.fibreG?b.fibreG+' g':'None tonight')+
      (m.egg?item('Egg','1'):'')+(m.broth?item('Bone broth','50 ml'):'')+'</dl>'+supplementCaution(iso)+
      (b.overTarget?'<p class="note warn">Other ingredients exceed the calorie target. Planned DARF is 0 g.</p>':'');
  }
  // Fed: the saved snapshot, never recalculated from current settings.
  const fedG=m.darfFed??m.darfPlanned;

    const quantity=amount!=null?`${esc(amount)} ${unit}`:null;
    if(m[flag]===true)return quantity??'Included';
    if(m[flag]===false)return Number(amount)>0?`Not given · ${quantity} originally recorded`:'Not given';

  };
  return `<p class="meal-hero tonight"><span>${name} · DARF fed</span><strong>${fedG!=null?esc(fedG)+' g':'Not recorded'}</strong></p><dl class="meal-amounts">`+
    (m.darfPlanned!=null&&m.darfFed!=null&&m.darfPlanned!==m.darfFed?item('DARF planned',esc(m.darfPlanned)+' g'):'')+
    item('Salmon oil',supplement('oilGiven',m.oilMl,'ml'))+item('Pro-Fibre',supplement('fibreGiven',m.fibreG,'g'))+
    (m.egg===true?item('Egg','Included'):'')+(m.broth===true?item('Bone broth','Included'):'')+'</dl>'+supplementCaution(iso);
}

function syncBcsGuidance(){

function refreshStoolLog(rawIso){
  // Completing a stool entry must not replace another section's unfinished form,
  // including the previous-meal editor nested beside this log.
  const iso=esc(rawIso);
  const log=document.querySelector(`[data-stool-log="${iso}"]`);
  if(log){
    const expanded=Array.from(log.querySelectorAll('details[id]'),el=>[el.id,el.open]), focus=document.activeElement?.id;
    const template=document.createElement('template');template.innerHTML=stoolsCard(iso);
    const next=template.content.querySelector('[data-stool-log]'), draft=log.querySelector('[data-stool]'), nextDraft=next.querySelector('[data-stool]');
    if(draft&&nextDraft){
      // Keep the live draft connected: date/time values and iPhone picker state belong to its inputs.
      for(const node of Array.from(log.childNodes))if(node!==draft)node.remove();
      for(const node of Array.from(next.childNodes))if(node!==nextDraft)draft.before(node);
    }else log.replaceWith(next);
    for(const [id,open] of expanded){const el=document.getElementById(id);if(el)el.open=open;}
    if(focus&&document.activeElement?.id!==focus)refocus(focus);
  }
  render();
}

function supplementCaution(iso){
  const s=S.settings, recent=[...(s.oilSchedule||[]),...(s.fibreSchedule||[])].map(e=>e.from).filter(d=>d<=iso&&toDay(iso)-toDay(d)<=7).sort().at(-1);
  return recent?`<p class="sub watch-text">Fibre or oil changed on ${fmtDate(recent)}. An extra now will muddy the read-out.</p>`:'';

// Supplement-change caution (unless shown elsewhere) plus the regime, recent recipes and (for a plan) the calculation.
function mealContext(iso,b,caution=true){
  const s=S.settings, oil=s.oilSchedule||[];
  const next=oil.filter(e=>e.from>iso).sort((a,b)=>a.from.localeCompare(b.from))[0];
  const last6=mealsList().filter(m=>m.date<iso).slice(-6).reverse().map(m=>RECIPES.find(r=>r.id===m.recipe)?.short||m.recipe);
  const calculation=b?`<p class="sub">${b.darfBase} g base ${b.adjustment>=0?'+':'−'} ${Math.abs(b.adjustment)} g adjustment · ${b.totalKcal} kcal${b.floored?' · at the ration floor':''}</p>`:'';
  return (caution?supplementCaution(iso):'')+
    `<details class="meal-disclosure meal-context" id="meal-context-${iso}"><summary>Regime, recent recipes${calculation?' and calculation':''}</summary>
      <p class="sub">Regime: Pro-Fibre ${fibreGOn(iso,s)} g · oil ${oilMlOn(iso,s)} ml${next?` · changes to ${next.ml} ml in ${toDay(next.from)-toDay(iso)} days`:''}</p>`+
      (last6.length?`<p class="sub">Last six: ${esc(last6.join(', '))}</p>`:'')+calculation+'</details>';

// Same markup apart from disclosure state: keep the live node, so a tap in progress
// or a screen-reader cursor on it is undisturbed (CR-08).
function sameMarkup(current,html,outer=false){
  if(!current)return false;
  const next=document.createElement('template'),live=document.createElement('template');
  next.innerHTML=html;live.innerHTML=outer?current.outerHTML:current.innerHTML;
  for(const root of [next.content,live.content])for(const d of root.querySelectorAll('details[open]'))d.removeAttribute('open');
  return next.innerHTML===live.innerHTML;
}
function refreshMealPlans(){
  // An all-day page can contain an activity draft alongside changing meal controls.
  // Refresh complete editors only when they contain no unfinished input of their own.
  const focus=document.activeElement?.id;
  const expanded=$$('#main details[id]').map(el=>[el.id,el.open]);
  for(const editor of $$('[data-meal-editor]')){
    if(editor.querySelector('[data-dirty]'))continue;
    const iso=editor.dataset.mealEditor,live=editor.dataset.mealLive==='true',previous=editor.dataset.mealPrevious==='true';
    const html=live?liveMealEditor(iso):mealEditor(iso,false,'',previous,previous?trackingMeal(shiftDate(iso,1)):null);
    if(!sameMarkup(editor,html,true))replaceRenderedHtml(editor,html,true);
  }
  // Inside an editor with a draft, these fragments contain no editable inputs.
  for(const el of $$('[data-meal-plan]')){
    const iso=el.dataset.mealPlan, html=el.hasAttribute('data-meal-brief')?todayMealAmounts(iso):mealPlanDetails(iso);
    if(el.innerHTML!==html&&!sameMarkup(el,html)) el.innerHTML=html;
    const m=plannedMeal(iso);
    for(const [k,label] of Object.entries(MEAL_FLAGS)){
      const id='meal-'+k+'-'+iso, control=document.getElementById(id);
      const next=switchRow(id,label,m[k],mealFlagDetail(m,k,isEditablePlan(iso,m)),`data-act="extra" data-k="${k}" data-date="${iso}"`);
      if(control&&!sameMarkup(control,next,true)) control.outerHTML=next;
    }
  }
  for(const el of $$('[data-meal-context]')){
    const iso=esc(el.dataset.mealContext);
    const html=todayMealContext(iso);if(el.innerHTML!==html&&!sameMarkup(el,html))el.innerHTML=html;
  }
  for(const el of $$('[data-live-unfeed]')){
    const iso=esc(el.dataset.liveUnfeed),html=liveUnfeedControl(iso,plannedMeal(iso));if(el.innerHTML!==html&&!sameMarkup(el,html))el.innerHTML=html;
  }
  for(const el of $$('[data-live-feeding]')){
    const iso=esc(el.dataset.liveFeeding),m=plannedMeal(iso),disabled=!isFedMeal(m);
    const feeding=liveFeedingControls(iso,m);if(!sameMarkup(el,feeding))el.innerHTML=feeding;
    for(const button of $$('[data-act="bowl"]',el.closest('[data-meal-editor]')))button.disabled=disabled;
    document.querySelector(`[data-bowl-help="${iso}"]`)?.classList.toggle('hide',!disabled);
  }
  // Restore after every replacement above, including the plan's own disclosure.
  for(const [id,open]of expanded){const el=document.getElementById(id);if(el)el.open=open;}
  if(focus&&document.activeElement?.id!==focus) refocus(focus);
}


/* DAY SHEET */
function earliestHistoryDate(){
  return cached('earliestHistory',()=>[S.settings.startDate,...Object.keys(S.days),localToday()].filter(d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(toDay(d))).sort()[0]);
}
function latestHistoryDate(){
  return cached('latestHistory',()=>[localToday(),...Object.keys(S.days).filter(validDate)].sort().at(-1));
}
function historyMinimumDate(){
  // Yesterday must remain viewable even on the first day of a new log.
  // Keep the Data tab's existing range calculation unchanged.
  return [earliestHistoryDate(),shiftDate(localToday(),-1)].sort()[0];
}
function permittedHistoryDate(iso){
  return validDate(iso)&&iso>=historyMinimumDate()&&iso<=latestHistoryDate()&&
    (iso<=localToday()||Object.hasOwn(S.days,iso));
}

    return m.mean===null?'':row(n+'-day mean',(weight?weightNumber(m.mean):m.mean.toFixed(1))+(weight?' kg':'')+' · '+m.n+' readings');

function rangeDates(today,range=S.range||14){
  const from=range===9999?toDay(earliestHistoryDate()):Math.max(toDay(S.settings.startDate),toDay(today)-range+1);
  const isos=[];for(let d=from;d<=toDay(today);d++)isos.push(toIso(d));
