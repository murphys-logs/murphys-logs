<!doctype html>
<html lang="en-GB" data-version="3.1.7">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Murphy">
<title>Murphy's Log</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23161616'/%3E%3Cg fill='%23ddd'%3E%3Cellipse cx='64' cy='62' rx='14' ry='19'/%3E%3Cellipse cx='97' cy='54' rx='14' ry='20'/%3E%3Cellipse cx='128' cy='68' rx='13' ry='18'/%3E%3Cpath d='M96 88c19 0 34 14 34 29 0 13-11 20-24 20-8 0-12-3-20-3s-12 3-20 3c-13 0-24-7-24-20 0-15 15-29 34-29z'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  color-scheme:dark;
  --paper:#101010; --surface:#1e1e1e; --surface-2:#292929;
  --ink:#f5f5f5; --ink-2:#d0d0d0; --ink-3:#b2b2b2;
  --rule:#454545; --rule-2:#858585;
  --accent:#ededed; --accent-ink:#f0f0f0; --accent-soft:#303030;
  --good:#78c886; --good-soft:var(--surface-2);
  --watch:#e7b45a; --watch-soft:var(--surface-2);
  --alert:#ffaaa0; --alert-soft:var(--surface-2); --on-accent:#101010;
  --switch-on:#ededed; --switch-off:#757575; --switch-thumb-on:#101010;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --compact:"SF Compact Text","SF Compact",var(--sans);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --sl:max(20px,env(safe-area-inset-left)); --sr:max(20px,env(safe-area-inset-right));
  --tabh:5rem; --headerh:3rem; --feedbackh:0px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --paper:#f4f4f4; --surface:#fff; --surface-2:#eee;
  --ink:#171717; --ink-2:#444; --ink-3:#595959;
  --rule:#d4d4d4; --rule-2:#808080;
  --accent:#262626; --accent-ink:#1f1f1f; --accent-soft:#e5e5e5;
  --good:#276e30; --good-soft:var(--surface-2);
  --watch:#805109; --watch-soft:var(--surface-2);
  --alert:#a12c24; --alert-soft:var(--surface-2); --on-accent:#fff;
  --switch-on:#262626; --switch-off:#757575; --switch-thumb-on:#fff;
}
@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --paper:#f4f4f4; --surface:#fff; --surface-2:#eee;
    --ink:#171717; --ink-2:#444; --ink-3:#595959;
    --rule:#d4d4d4; --rule-2:#808080;
    --accent:#262626; --accent-ink:#1f1f1f; --accent-soft:#e5e5e5;
    --good:#276e30; --good-soft:var(--surface-2);
    --watch:#805109; --watch-soft:var(--surface-2);
    --alert:#a12c24; --alert-soft:var(--surface-2); --on-accent:#fff;
    --switch-on:#262626; --switch-off:#757575; --switch-thumb-on:#fff;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font:-apple-system-body;scroll-padding-top:calc(var(--headerh) + var(--feedbackh) + 1rem);scroll-padding-bottom:calc(var(--tabh) + 1rem)}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:1rem; line-height:1.5;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:contain;
}
button,input,select,textarea{font:inherit;color:inherit;accent-color:var(--accent);caret-color:var(--ink)}
/* Neutral browser-owned text selection and form chrome where CSS is supported. */
::selection{background:var(--accent);color:var(--on-accent)}
input::file-selector-button{color:var(--ink);background:var(--surface-2);border-color:var(--rule-2)}
option{color:var(--ink);background:var(--surface)}
option:checked{color:var(--on-accent);background:var(--accent)}
button{background:none;border:0;cursor:pointer;padding:0;text-align:left;min-width:44px;min-height:44px;overflow-wrap:anywhere}
input,select,.btn{min-height:44px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:5px}
button:disabled{cursor:default}
button:disabled:not(.btn){color:var(--ink-3)}
.switch-row:disabled .switch-track{border:1px dashed currentColor;box-shadow:none;opacity:.5}
button:not(:disabled):active{filter:brightness(.88);box-shadow:inset 0 0 0 2px var(--ink-3)}
input,select,textarea,[tabindex="-1"]{scroll-margin-block:calc(var(--headerh) + var(--feedbackh) + 1rem) calc(var(--tabh) + 2rem)}
.hide{display:none !important}
.num,.row .v,.field input,.scale button,.bristol b{font-variant-numeric:tabular-nums}
.g{--tone:var(--good)} .a{--tone:var(--watch)} .r{--tone:var(--alert)}

/* shell */
#gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:var(--s5)}
.gate-card{width:100%;max-width:380px}
.gate-card h1{font-size:1.625rem;font-weight:650;letter-spacing:-.02em;margin:0 0 4px}
.gate-card p.sub{color:var(--ink-2);font-size:.9rem;margin:0 0 26px}

#app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule);
  padding:calc(env(safe-area-inset-top) + var(--s3)) var(--sr) var(--s2) var(--sl);
  display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:var(--s2) var(--s3);
}
.topbar .who{font-size:1rem;font-weight:650;letter-spacing:-.02em}
.topbar .state{font-size:.75rem;color:var(--ink-3)}
.topbar .state.warn{color:var(--watch)}
.topbar .state.bad{color:var(--alert)}

main{flex:1;padding:var(--s5) var(--sr) calc(var(--tabh) + var(--s6)) var(--sl);max-width:42rem;width:100%;margin:0 auto;min-width:0}
.feedback-region{position:sticky;top:var(--headerh);z-index:19;width:100%;max-width:42rem;margin-inline:auto;padding-inline:var(--sl) var(--sr);background:var(--paper);max-height:45dvh;overflow:auto}
.feedback-region:empty{display:none}
.feedback-region .note{margin:12px 0;padding:12px 16px;border:1px solid var(--rule-2);border-left-width:3px}
.feedback-actions{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:4px}
.feedback-actions .link{font-size:.875rem}
.feedback-region .note b{margin-bottom:2px}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(max(20%,8ch),1fr));font:.75rem/1.5 var(--sans);
  background:var(--surface);border-top:1px solid var(--rule-2);
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.tabbar button{
  position:relative;text-align:center;padding:10px 2px;font:inherit;color:var(--ink-3);white-space:normal;
  min-height:60px;min-width:0;outline-offset:-4px;
}
.tabbar button.on{color:var(--accent-ink);font-weight:650;background:var(--accent-soft);box-shadow:inset 0 2px 0 var(--accent)}
.tabbar svg{display:block;width:22px;height:22px;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar .dotmark{position:absolute;top:7px;left:calc(50% + 13px);width:6px;height:6px;border-radius:50%;background:var(--ink)}

/* pieces */
.moment{
  display:inline-block;font-size:.8125rem;font-weight:650;
  letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);
  margin-bottom:var(--s2);
}
h2.screen{font-size:2rem;font-weight:700;letter-spacing:-.035em;margin:0 0 var(--s5);line-height:1.15;overflow-wrap:anywhere}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;margin-bottom:var(--s5);overflow:hidden;min-width:0}
.sec{padding:20px}
.card>.sec+.sec{border-top:1px solid var(--rule)}
.lab{font-size:1rem;font-weight:650;letter-spacing:-.01em;color:var(--ink);margin:0 0 var(--s4);line-height:1.35}
.sec>.lab:not(:first-child){margin-top:var(--s4)}
summary{min-height:44px;cursor:pointer;font-weight:600;list-style-position:inside;overflow-wrap:anywhere}
details[open]>summary{margin-bottom:var(--s3)}
details.card>summary{padding:var(--s4);margin:0;outline-offset:-4px}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;margin-bottom:10px}
.row:last-child{margin-bottom:0}
.row .k{color:var(--ink-2);font-size:.9375rem;min-width:0;overflow-wrap:anywhere}
.row .v{font-size:1rem;font-weight:600;overflow-wrap:anywhere}
.sub{font-size:.875rem;color:var(--ink-3);margin:8px 0 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* buttons */
.btn{display:block;width:100%;text-align:center;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:1rem;padding:var(--s3) var(--s4);border-radius:10px;min-height:48px}
.btn[disabled]{opacity:.4}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--rule-2)}
.btn.sm{font-size:.875rem;padding:var(--s2)}
.btn.danger{background:var(--alert);color:var(--on-accent)}
.btnrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,8rem),1fr));gap:var(--s3);margin-top:var(--s4)}
[data-form]+.chip{margin-top:var(--s3)}
.link{color:var(--accent-ink);font-weight:600;font-size:.9375rem;padding-block:8px}

/* inputs */
.field{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3);padding:var(--s2) 0}
.field label{flex:1 1 8rem;font-size:.9375rem;color:var(--ink-2)}
.field input{
  border:1px solid var(--rule-2);border-radius:8px;background:var(--surface-2);text-align:right;
  font-size:1.0625rem;font-weight:600;width:7.5rem;max-width:100%;min-width:0;padding:var(--s2);
}
.field input[type="time"]{width:9rem}
[aria-invalid="true"]{border-color:var(--alert)!important;outline-color:var(--alert)}
.field-help,.field-error{font-size:.875rem;line-height:1.5;margin:4px 0 0;color:var(--ink-3)}
.field-error{color:var(--alert)}
input:disabled{color:var(--ink-3);opacity:1;border-style:dashed}
.tin{width:100%;max-width:100%;border:1px solid var(--rule-2);border-radius:8px;padding:var(--s3);background:var(--surface);font-size:1rem}
textarea.tin{min-height:64px;resize:vertical;font-family:var(--sans)}
.inline-lab{display:block;font-size:.9375rem;color:var(--ink-2);margin:0 0 var(--s2)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chips,.meal-flags,.seg{margin-block:var(--s3)}
.meal-flags{display:grid;grid-template-columns:minmax(0,1fr);gap:0;margin-block:var(--s5)}
.switch-row{display:flex;align-items:center;gap:var(--s4);width:100%;min-height:64px;padding:14px 0;border-block-end:1px solid var(--rule);text-align:left;outline-offset:-3px}
.switch-row:first-child{border-block-start:1px solid var(--rule)}
.switch-copy{flex:1;min-width:0}
.switch-label{display:block;font-size:1rem;font-weight:600;line-height:1.35}
.switch-detail{display:block;font-size:.8125rem;line-height:1.5;color:var(--ink-3);margin-top:4px}
.switch-control{display:flex;flex:none;align-items:center;gap:8px}
.switch-state{font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.switch-track{display:block;position:relative;width:51px;height:31px;border-radius:20px;background:var(--switch-off);box-shadow:inset 0 0 0 1px var(--switch-off);transition:background-color .15s ease}
.switch-thumb{position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:transform .15s ease}
.switch-row[aria-checked="true"] .switch-track{background:var(--switch-on)}
.switch-row[aria-checked="true"] .switch-thumb{transform:translateX(20px);background:var(--switch-thumb-on)}
.chip{font-size:.9375rem;padding:var(--s2) var(--s3);border:1px solid var(--rule-2);border-radius:9px;color:var(--ink-2);background:transparent}
.chip.on,.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip.on.ev{background:var(--accent);border-color:var(--accent)}

/* segmented */
.seg{display:flex;border:1px solid var(--rule-2);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-width:0;text-align:center;padding:var(--s2);font-size:.9375rem;color:var(--ink-2);border-right:1px solid var(--rule-2)}
.seg button:last-child{border-right:0}
.seg button:disabled{background:var(--surface-2);color:var(--ink-3);opacity:.65}

/* bristol + bcs scales */
.bristol,.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(max(44px,3.5rem),1fr));gap:var(--s2);margin-block:var(--s3)}
:is(.bristol,.scale) button{text-align:center;border:1px solid var(--rule-2);border-radius:6px;background:var(--surface)}
.bristol button{padding:9px 1px 7px;line-height:1.1}
.bristol b{display:block;font-size:.9375rem;font-weight:600;color:var(--tone)}
.bristol i{display:block;font-style:normal;font-size:.75rem;color:var(--ink-3);margin-top:5px}

.scale button{
  padding:11px 0;font-size:.9375rem;font-weight:600;color:var(--tone);
}
@media(max-width:600px) and (orientation:portrait){
  .bcs-scale{grid-template-columns:repeat(8,minmax(0,1fr));max-width:calc(14rem + 3 * var(--s2));margin-inline:auto}
  .bcs-scale button{grid-column:span 2;white-space:nowrap}
  .bcs-scale button:nth-child(5){grid-column:2 / span 2}
}
#bcs-announcement{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.bristol button.on b,.bristol button.on i,.scale button.on{color:var(--on-accent)}
:is(.bristol,.scale) .on{background:var(--tone);border-color:var(--tone)}

/* stool entries */
.stool{display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s2) 0;border-bottom:1px solid var(--rule)}
.stool:last-of-type{border-bottom:0}
.dot{width:9px;height:9px;border-radius:2px;flex:none;margin-top:5px;background:var(--tone)}
.stool .body{flex:1;min-width:0}
.stool .t{font-size:1rem}
.stool .attr{display:block;font-size:.875rem;color:var(--ink-3);margin-top:4px}

/* callouts */
.note{border-radius:10px;padding:var(--s4);font-size:.9375rem;line-height:1.5;margin-bottom:var(--s4);color:var(--ink-2);overflow-wrap:anywhere}
.note b{display:block;color:var(--ink);font-weight:650;font-size:1rem;margin-bottom:4px}
.note.hold{background:var(--accent-soft);border-left:3px solid var(--accent)}
.note.good{background:var(--good-soft);border-left:3px solid var(--good)}
.note.warn{background:var(--watch-soft);border-left:3px solid var(--watch)}
.note.bad{background:var(--alert-soft);border-left:3px solid var(--alert)}
.note.plain{background:var(--surface-2);border-left:3px solid var(--rule-2)}

/* streak */
.streak{display:flex;gap:4px}
.streak span{flex:1;min-height:26px;border-radius:4px;border:1px solid var(--rule-2);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--ink-3);background:var(--surface)}
.streak span.clean{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.streak span.broken{background:var(--alert);border-color:var(--alert);color:var(--on-accent)}
.streak span.pause{background:var(--surface-2)}

/* gauge */
.gauge{height:9px;border-radius:5px;background:var(--surface-2);border:1px solid var(--rule-2);position:relative;overflow:hidden;margin:8px 0 5px}
.gauge .mid{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--rule-2)}
.gauge .fill{position:absolute;top:0;bottom:0;background:var(--accent)}

/* Charts keep their text in the document's text scale, outside the drawing. */
.chart-frame{display:grid;grid-template-columns:3.6rem minmax(0,1fr);gap:8px;padding-block:10px 0;margin-top:16px}
.chart-axis{position:relative;font-size:.875rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chart-axis span{position:absolute;right:0;transform:translateY(-50%);line-height:1.2}
.chart-plot{height:11rem;position:relative;min-width:0}
svg.chart{display:block;width:100%;height:100%;overflow:visible}
svg.chart :is(path,line){vector-effect:non-scaling-stroke}
.chart-point{position:absolute;width:.4375rem;height:.4375rem;border-radius:50%;background:var(--surface);border:2px solid var(--accent);transform:translate(-50%,-50%)}
.chart-point.stool-point{width:.5rem;height:.5rem;border:0;background:var(--tone)}
.chart-point.stool-point.r{border-radius:0}
.chart-point.stool-point.a{border-radius:0;transform:translate(-50%,-50%) rotate(45deg)}
.chart-mark{position:absolute;width:.5rem;height:.5rem;transform:translate(-50%,-50%)}
.chart-mark .stool-point{left:50%;top:50%}
.chart-mark.blood::before,.chart-mark.mucus::after{content:"";position:absolute;inset:-.25rem;border:1.5px solid var(--alert);border-radius:50%}
.chart-mark.mucus::after{inset:-.375rem;border-style:dashed;border-color:var(--watch)}
.chart-dates{grid-column:2;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 16px;font-size:.875rem;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:6px}
.chart-summary{font-size:.9375rem;line-height:1.6;color:var(--ink-2);margin:0 0 12px}
.legend{font-size:.875rem;line-height:1.6;color:var(--ink-3);margin:12px 0 0}
.chart-values{margin-top:12px;border-top:1px solid var(--rule);padding-top:8px}
.chart-values summary{display:flex;align-items:center;gap:8px;font-size:.9375rem;color:var(--accent-ink)}
.chart-values summary::before{content:"+";font-weight:600}
.chart-values[open] summary::before{content:"−"}
.chart-values .tw{margin-top:8px}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;outline-offset:-3px}
table{border-collapse:collapse;width:100%;font-size:.875rem}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--rule);white-space:nowrap}
thead th{font-size:.8125rem;font-weight:600;color:var(--ink-3);background:var(--surface-2)}
td{color:var(--tone,var(--ink-2));font-variant-numeric:tabular-nums}
.table-intro{padding:20px;border-bottom:1px solid var(--rule)}
.table-intro .lab{margin-bottom:4px}
.table-guide{font-size:.875rem;line-height:1.5;margin:8px 0 0;color:var(--ink-2)}
.log-table{font-size:.9375rem;--date-width:clamp(88px,26vw,112px)}
.log-table th{padding:12px;font-size:.8125rem}
.log-table td{padding:12px;vertical-align:top}
.log-table .date-column{position:sticky;left:0;z-index:2;min-width:var(--date-width);width:var(--date-width);max-width:var(--date-width);white-space:normal;overflow-wrap:anywhere;background:var(--surface);border-right:1px solid var(--rule-2)}
.log-table th.date-column{background:var(--surface-2);z-index:3}
.log-table .date-column .link{display:block;font-size:.9375rem;white-space:normal;line-height:1.4}
.log-table .meal-column{min-width:16rem;width:20rem;white-space:normal;overflow-wrap:anywhere;font-size:1rem;line-height:1.5;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.meal-title{display:block;font-size:1rem;padding-top:0;min-height:44px;line-height:1.4}
.meal-meta{font-size:.875rem;line-height:1.5;color:var(--ink-3);margin:0 0 8px}
.meal-detail{font-size:1rem;line-height:1.5;color:var(--ink-2);margin:0}
.meal-disclosure{margin-top:4px}
.meal-disclosure summary{display:flex;align-items:center;gap:8px;font-size:.875rem;color:var(--accent-ink)}
.meal-disclosure summary::before{content:"+"}
.meal-disclosure[open] summary::before{content:"−"}
.meal-facts{margin:0;display:grid;gap:8px}
.meal-facts>div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.meal-facts dt{color:var(--ink-3);font-size:.875rem}
.meal-facts dd{margin:0;font-size:.875rem;font-variant-numeric:tabular-nums}
.meal-correction{margin-top:20px;padding-top:16px;border-top:1px solid var(--rule)}
.table-flags{display:block;white-space:normal;font-size:.8125rem;margin-top:6px;max-width:12rem;color:var(--ink-2)}
.log-table .table-reading{display:block;min-height:44px;padding-top:8px}
.data-range{margin-bottom:20px}
@media(max-width:600px){
  .log-table .meal-column{min-width:calc(100vw - var(--sl) - var(--sr) - var(--date-width) - 2px);width:calc(100vw - var(--sl) - var(--sr) - var(--date-width) - 2px);max-width:calc(100vw - var(--sl) - var(--sr) - var(--date-width) - 2px)}
  .log-table td{padding:12px 10px}
  .meal-facts>div{grid-template-columns:1fr}

// Independent of the data modules: a failed download must still offer recovery.
(() => {
  const pageVersion=document.documentElement.dataset.version;
  const state={offlineReady:null,updateReady:false,busy:false,message:'',available:'serviceWorker' in navigator};
  let registration=null,started=false,startupFailed=false,requestedReload=false,lastCheck=0,checking=false;
  const emit=()=>window.dispatchEvent(new Event('app-shell-status'));
  const canReload=()=>!document.querySelector('#main [data-dirty],#main [data-stool]')&&(!window.appCanUpdate||window.appCanUpdate());
  function startupFailure(){
    if(started)return;
    startupFailed=true;const error=document.getElementById('gate-err');
    error.textContent='Murphy’s Log could not finish loading. Check your connection, then try again. Retrying does not reset your log.';
    error.classList.remove('hide');document.getElementById('boot-retry').classList.remove('hide');
    document.getElementById('signin').textContent='App unavailable';
  }
  const deadline=setTimeout(startupFailure,20000);
  function message(worker,type,timeout=2500){
    if(!worker)return Promise.resolve(null);
    return new Promise(resolve=>{
      const channel=new MessageChannel();
      const finish=value=>{clearTimeout(timer);channel.port1.close();resolve(value)};
      const timer=setTimeout(()=>finish(null),timeout);
      channel.port1.onmessage=event=>finish(event.data?.type==='MURPHY_STATUS'?event.data:null);
      try{worker.postMessage({type},[channel.port2])}catch{finish(null)}
    });
  }
  async function inspect(){
    if(!registration)return;
    const [active,waiting]=await Promise.all([message(registration.active,'MURPHY_STATUS'),message(registration.waiting,'MURPHY_STATUS')]);
    state.activeVersion=active?.version||null;
    state.offlineReady=active?.version===pageVersion?active.offlineReady:null;
    state.updateReady=!!registration.waiting||!!(active&&active.version!==pageVersion);
    state.waitingReady=waiting?.offlineReady===true;
    emit();
  }
  function watch(reg){
    registration=reg;
    const track=()=>{
      const worker=reg.installing;if(!worker)return;
      worker.addEventListener('statechange',()=>{
        if(worker.state==='installed'||worker.state==='activated')void inspect();
        if(worker.state==='redundant'){state.message='The update could not be prepared. Your current app and saved records are kept.';emit();}
      });
    };
    if(!reg.__murphyWatched){reg.__murphyWatched=true;reg.addEventListener('updatefound',track);}
    track();void inspect();
  }
  async function check(repair=false){
    if(!state.available||checking)return;
    checking=true;state.busy=true;state.message='';emit();lastCheck=Date.now();
    try{
      if(!registration||!registration.active&&!registration.waiting&&!registration.installing)watch(await navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}));
      else if(navigator.onLine){
        try{await registration.update()}catch(error){
          if(error.name==='InvalidStateError')watch(await navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}));else throw error;
        }
      }
      if(repair){
        const worker=registration.waiting||registration.active;
        const result=await message(worker,'MURPHY_REPAIR',25000);
        state.message=result?.error||(result?.offlineReady?'App files are ready for offline opening.':worker?'Offline opening could not be confirmed. Reconnect and try again.':'Preparing offline opening. Check again once the app finishes downloading.');
      }
    }catch{
      state.message=navigator.onLine?'Could not check the app files. Try again when connected.':'You are offline. Update checks will resume when connected.';
    }finally{await inspect();checking=false;state.busy=false;emit();}
  }
  async function update(){
    if(state.busy)return;
    if(!canReload()){state.message='Save or cancel unfinished entries before updating.';emit();return;}
    if(!registration){await check();return;}
    if(!registration.waiting){
      if(state.activeVersion&&state.activeVersion!==pageVersion&&canReload())location.reload();
      else await check();
      return;
    }
    state.busy=true;state.message='';requestedReload=true;emit();
    const result=await message(registration.waiting,'MURPHY_ACTIVATE');
    if(!result?.offlineReady){requestedReload=false;state.busy=false;state.message='The update files are not ready. Use Check app files in Settings when connected.';emit();}
  }
  window.AppShell={state,check,update,ready(){
    started=true;clearTimeout(deadline);document.getElementById('boot-retry').classList.add('hide');
    if(startupFailed){document.getElementById('gate-err').classList.add('hide');document.getElementById('gate-err').textContent='';startupFailed=false;}
    document.getElementById('signin').disabled=false;document.getElementById('signin').textContent='Sign in';
  }};
  document.getElementById('boot-retry').addEventListener('click',()=>location.reload());
  document.addEventListener('click',event=>{
    const action=event.target.closest('[data-shell-act]')?.dataset.shellAct;
    if(action==='update')void update();if(action==='check')void check(true);
  });
  window.addEventListener('error',startupFailure,true);
  window.addEventListener('unhandledrejection',startupFailure);
  if(state.available){
    navigator.serviceWorker.addEventListener('message',event=>{if(event.data?.type==='MURPHY_STATUS')void inspect()});
    navigator.serviceWorker.addEventListener('controllerchange',async()=>{
      await inspect();
      if(requestedReload){
        requestedReload=false;state.busy=false;
        if(canReload())location.reload();
        else{state.updateReady=true;state.message='The update is ready. Save or cancel the entry you started, then choose Update app.';emit();}
      }
    });
    window.addEventListener('load',()=>void check());
    window.addEventListener('online',()=>void check());
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastCheck>60000)void check()});
  }
})();
</script>

/* Pure calculations; see selfTest and tests/. */

const RECIPES = [

  { id:'fish',   name:'Sustainable Fish',      short:'Fish',   kcal100:94,  noOil:false },

const BRISTOL = [null,
  { n:1, word:'Pellets', band:'r' }, { n:2, word:'Lumpy', band:'a' },

const BCS_STEPS = [

  { v:3, band:'r', description:'Ribs are easy to feel with no noticeable fat and may be visible, with an obvious waist from above and a pronounced belly tuck from the side.' },

  { v:5.5, band:'g', description:'An intermediate assessment between 5 and 6: ribs can be felt under slightly fuller fat cover, with a softer waist from above and belly tuck from the side.' },
  { v:6, band:'a', description:'Ribs can be felt under slight excess fat, with a less prominent waist from above and a belly tuck from the side.' },
  { v:7, band:'r', description:'Ribs are hard to feel beneath heavy fat, with little or no waist from above and a belly tuck that may remain from the side.' }];
const BCS_GENERAL = 'An informed, subjective assessment of ribs, waist and tuck. Excellent: 4.5–5.5; ideal centre: 5.0.';
const EVENTS = [
  { id:'vomited', label:'Vomited' }, { id:'blood', label:'Blood' },
  { id:'lethargic', label:'Lethargic' }, { id:'offFood', label:'Off food' },
  { id:'vacant', label:'Vacant episode' }];

const DEFAULTS = {
  startDate:'2026-09-07', targetKcal:1240, bdGrams:500,
  kcalPerGDarf:4.62, kcalPerMlOil:7.82, kcalPerKgTissue:7000,
  damping:0.125, deadbandPct:1.0, maxStepG:15, maxCumulativeG:40,
  minWeighIns:5, windowDays:7, suppressOnRegimeChange:true,
  bcsHoldAtOrBelow:5, bcsTarget:5, darfMinG:20,
  attributionMinH:6, handoverHour:16,
  eggKcal:74, brothKcal:15, // One egg; one 50 ml serving of broth.
  fibreStepG:2.5, fibreRestG:5, fibreCapG:10, fibreStreakDays:7,
  fibreStepBackDays:14, fibreReviewMinDays:14, fibreReviewWindow:14, fibreReviewBadDays:6,
  oilSchedule:[{from:'2026-01-01', ml:8},{from:'2026-09-28', ml:4}],
  fibreSchedule:[{from:'2026-09-04', g:2.5}],
  regimeChanges:[], vetWindowDays:90, theme:'system'
};

// These two user-specified values replace legacy configuration (including zero).
// No saved meal snapshots or schedule entries are migrated.
const mealSettings = saved => ({...DEFAULTS,...saved,eggKcal:DEFAULTS.eggKcal,brothKcal:DEFAULTS.brothKcal});

const DAY_MS = 86400000;
const dateDays = new Map();
function toDay(iso){
  if (!dateDays.has(iso)){
    if (dateDays.size > 4096) dateDays.clear();
    dateDays.set(iso, Math.floor(Date.parse(iso + 'T00:00:00Z') / DAY_MS));
  }
  return dateDays.get(iso);
}
const toIso = (d) => new Date(d * DAY_MS).toISOString().slice(0, 10);
// Calendar labels, not elapsed hours: safe across London midnight and BST changes.
const shiftDate = (iso, days) => toIso(toDay(iso) + days);
const validDate = iso => typeof iso==='string' && /^\d{4}-\d{2}-\d{2}$/.test(iso) && Number.isFinite(toDay(iso)) && toIso(toDay(iso))===iso;
const validTime = time => typeof time==='string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(time);
const isFedMeal = meal => !!meal?.recipe && validTime(meal.fedAt);
function mondayOf(iso){ const d = toDay(iso); const w = new Date(d*DAY_MS).getUTCDay(); return d - ((w+6)%7); }
const minsOf = (t) => { const [h,m] = String(t||'00:00').split(':').map(Number); return h*60+m; };
const round1 = (x) => Math.round(x*10)/10;

function inForce(sch, iso, key){
  let val=null, best=-Infinity;
  for (const e of (sch||[])){ const d=toDay(e.from); if (d<=toDay(iso) && d>=best){ best=d; val=e[key]; } }
  return val;
}
const oilMlOn  = (iso,s) => { const v=inForce(s.oilSchedule,iso,'ml');  return v===null?0:v; };
const fibreGOn = (iso,s) => { const v=inForce(s.fibreSchedule,iso,'g'); return v===null?0:v; };
const adjustmentOn = (iso, ch) => (ch||[]).reduce((a,c)=> toDay(c.date)<=toDay(iso) ? a+(c.deltaG||0) : a, 0);

function bowlFor(iso, recipeId, s, changes, extras){
  const r = RECIPES.find(x=>x.id===recipeId); if (!r) return null;
  s = mealSettings(s);
  const ex = mealDefaults({...extras,recipe:recipeId});
  const bdKcal = r.kcal100 * (s.bdGrams/100);
  const oilMl = ex.oilGiven ? oilMlOn(iso,s) : 0;
  const oilKcal = round1(oilMl * s.kcalPerMlOil);
  const fibreG = ex.fibreGiven ? fibreGOn(iso,s) : 0;
  const eggKcal = ex.egg ? s.eggKcal : 0, brothKcal = ex.broth ? s.brothKcal : 0;
  const extrasKcal = eggKcal + brothKcal;
  const adjustment = adjustmentOn(iso, changes);
  const darfBase = (s.targetKcal - bdKcal - oilKcal - extrasKcal) / s.kcalPerGDarf;
  const overTarget = bdKcal + oilKcal + extrasKcal > s.targetKcal;
  let darfG = Math.round(darfBase + adjustment), floored = false;
  if (darfBase <= 0) darfG = 0;
  else if (darfG < s.darfMinG){ darfG = s.darfMinG; floored = true; }
  darfG = Math.max(0,darfG);
  return { recipe:r, bdGrams:s.bdGrams, bdKcal, oilMl, oilKcal, fibreG, eggKcal, brothKcal, extrasKcal,
    adjustment, darfBase:round1(darfBase), darfG, floored, overTarget,
    totalKcal: Math.round(bdKcal + oilKcal + extrasKcal + darfG*s.kcalPerGDarf) };
}

function mealDefaults(meal={}){
  // An older saved boolean is an explicit choice, even when it is false.
  const oilDefaultMode = meal.oilDefaultMode!=='auto'&&typeof meal.oilGiven==='boolean' ? 'manual' : 'auto';
  return {...meal,egg:meal.egg??false,broth:meal.broth??false,fibreGiven:meal.fibreGiven??true,
    oilDefaultMode,oilGiven:oilDefaultMode==='auto'? !RECIPES.find(r=>r.id===meal.recipe)?.noOil : meal.oilGiven};
}
const isEditablePlan = (iso,meal) => iso>=localToday()&&!isFedMeal(meal);
function calculatedMeal(iso,meal){
  const m=mealDefaults(meal), b=bowlFor(iso,m.recipe,S.settings,S.changes,m);
  return b?{...m,darfPlanned:b.darfG,oilMl:b.oilMl,fibreG:b.fibreG,
    eggKcal:b.eggKcal,brothKcal:b.brothKcal,oilKcal:b.oilKcal,extrasKcal:b.extrasKcal,
    totalKcal:isFedMeal(m)&&Number.isFinite(m.darfFed)?
      Math.round(b.bdKcal+b.oilKcal+b.extrasKcal+m.darfFed*S.settings.kcalPerGDarf):b.totalKcal}:m;
}
function plannedMeal(iso,meal=S.days[iso]?.meal||{}){
  // Read-only projection: opening history or rendering a view never writes data.
  return isEditablePlan(iso,meal)?calculatedMeal(iso,meal):meal;
}
function saveMeal(iso,patch){
  const saved=S.days[iso]?.meal||{};

  // follow automatic oil defaults; manual choices and all fed history survive.
  return saveDay(iso,{meal:isEditablePlan(iso,saved)?calculatedMeal(iso,{...saved,...patch}):patch});
}

function windowMean(weights, endDay, len){
  const start = endDay - len + 1, seen = new Set();
  let sum=0;
  for (const w of weights||[]){
    if (!w || !Number.isFinite(w.kg) || w.kg<=0 || w.weightMissed===true || w.missed===true) continue;
    const d=toDay(w.date);
    if (d<start || d>endDay || !Number.isFinite(d) || seen.has(d)) continue;
    seen.add(d); sum+=w.kg;
  }
  return { n:seen.size, mean:seen.size?sum/seen.size:null, from:toIso(start), to:toIso(endDay) };
}

/* Weekly ration rule: two completed windows, inclusive threshold, condition hold before caps. */
function computeDarfAdjustment({ weights=[], asOf, currentOffsetG=0, lastAdjustmentWeek=null,
  bcs7dMean=null, regimeChanges=[], settings={} } = {}){
  const cfg = { ...DEFAULTS, ...settings };
  const thisWeek = mondayOf(asOf), endDay = thisWeek - 1;
  const current = windowMean(weights, endDay, cfg.windowDays);
  const previous = windowMean(weights, endDay - cfg.windowDays, cfg.windowDays);
  const out = { asOf, weekStart:toIso(thisWeek),
    currentWindow:[current.from,current.to], previousWindow:[previous.from,previous.to],
    previousMean:previous.mean, currentMean:current.mean, previousN:previous.n, currentN:current.n,
    percentChange:null, fullCorrectionG:null, rawStepG:null,
    adjustmentG:0, applied:false, limitedBy:null, held:false, reason:'' };

  if (lastAdjustmentWeek && mondayOf(lastAdjustmentWeek) >= thisWeek){
    out.reason = 'Adjustment already recorded this week.'; return out; }
  if (cfg.suppressOnRegimeChange){
    const lo=toDay(previous.from), hi=toDay(current.to);
    const hit=(regimeChanges||[]).find(d=>{const n=toDay(d);return n>=lo&&n<=hi;});
    if (hit){ out.reason = `Ration changed on ${fmtDate(hit)} inside these windows; the comparison is confounded, so hold.`; return out; }
  }
  if (previous.n < cfg.minWeighIns || current.n < cfg.minWeighIns){
    out.reason = `Weigh-ins: ${previous.n} earlier, ${current.n} later; at least ${cfg.minWeighIns} per week required.`;
    return out;
  }
  const pct = ((current.mean - previous.mean) / previous.mean) * 100;
  out.percentChange = pct;
  const perPct = (0.01 * current.mean * cfg.kcalPerKgTissue) / (cfg.windowDays * cfg.kcalPerGDarf);
  out.fullCorrectionG = -pct * perPct;
  out.rawStepG = out.fullCorrectionG * cfg.damping;

  // Allow only floating-point roundoff at the inclusive threshold.
  if (Math.abs(pct) + 1e-10 < cfg.deadbandPct){
    out.reason = `${pct>=0?'+':''}${pct.toFixed(2)}% is within the ±${cfg.deadbandPct}% deadband: hold.`;
    return out;
  }
  let step = Math.round(out.rawStepG);

  // Apply condition hold before caps.
  if (step < 0 && bcs7dMean !== null && bcs7dMean <= cfg.bcsHoldAtOrBelow){
    out.held = true;
    out.reason = `Weight up ${pct.toFixed(2)}%; mean condition ${bcs7dMean.toFixed(1)} is at or below ${cfg.bcsHoldAtOrBelow}: hold the reduction.`;
    return out;
  }
  const direction = Math.sign(step);
  if (Math.abs(step) > cfg.maxStepG){ step = Math.sign(step)*cfg.maxStepG; out.limitedBy='maxStepG'; }
  const projected = currentOffsetG + step;
  if (Math.abs(projected) > cfg.maxCumulativeG){
    step = Math.trunc(Math.sign(projected)*cfg.maxCumulativeG - currentOffsetG);
    if (Math.sign(step) !== direction) step = 0;   // Never reverse advice.
    out.limitedBy = 'maxCumulativeG';
  }
  if (step === 0){
    out.reason = `${pct>=0?'+':''}${pct.toFixed(2)}% calls for a change, but the ±${cfg.maxCumulativeG} g cumulative cap is reached.`;
    return out;
  }
  out.adjustmentG = step; out.applied = true;
  out.reason = `${fmtDate(current.from)} to ${fmtDate(current.to)} averaged ${current.mean.toFixed(2)} kg against `

    + `Undamped: ${Math.abs(out.fullCorrectionG).toFixed(0)} g DARF; damped: `
    + `${step>0?'up':'down'} ${Math.abs(step)} g`
    + (out.limitedBy ? ` and held at the ${out.limitedBy==='maxStepG'?'single-step':'cumulative'} cap.` : '.');

}

function vetItems(days, todayIso, weights, s){

  if (blood.length) items.push({sev:'r',title:'Blood recorded',dates:blood,text:'Never aged out of this list.'});
  const vacant=all.filter(d=>within(d,s.vetWindowDays)&&(days[d].events||[]).includes('vacant'));
  if (vacant.length) items.push({sev:'r',title:'Vacant episode',dates:vacant,text:'Video it if it happens again. For an episodic neurological sign a video is the single most useful thing a vet can be given.'});
  const leth=all.filter(d=>within(d,s.vetWindowDays)&&(days[d].events||[]).includes('lethargic'));
  if (leth.length) items.push({sev:'a',title:'Lethargy',dates:leth,text:''});
  const vom=all.filter(d=>within(d,7)&&(days[d].events||[]).includes('vomited'));
  if (vom.length>=2) items.push({sev:'a',title:'Vomited on two or more days this week',dates:vom,text:''});

  if (six.length) items.push({sev:'a',title:'Bristol 6 or 7 on consecutive days',dates:six,text:''});
  const ref=all.filter(d=>within(d,7)&&days[d].meal&&days[d].meal.bowl==='refused');
  if (ref.length>=2) items.push({sev:'a',title:'Bowl refused twice this week',dates:ref,text:''});
  const end=toDay(todayIso);
  const w2=windowMean(weights,end,14), w2p=windowMean(weights,end-14,14);
  if (w2.mean&&w2p.mean&&(w2.mean-w2p.mean)/w2p.mean<=-0.02){
    const nights=all.filter(d=>within(d,14)&&days[d].meal&&days[d].meal.bowl);
    if (nights.length>=4&&nights.every(d=>days[d].meal.bowl==='cleared'))
      items.push({sev:'a',title:'Losing weight with a cleared bowl',dates:[],

}

      storeError(Error('Enter a valid '+spec.label.toLowerCase()));return false;

const deviceKey=name=>`murphy-device:${S.user.uid}:${name}`;
function regimeDates(dates=[],delta){
  if(delta.drop) return dates.filter(d=>d!==delta.date);
  const count=dates.filter(d=>d===delta.date).length,missing=Math.max(0,(delta.count||1)-count),next=[...dates];
  for(let i=0;i<missing;i++)next.splice(Math.min(delta.indices?.[count+i]??next.length,next.length),0,delta.date);
  return next;
}
function recoveryMissing(r){

}

async function removeWithUndo(recovery,operation){
  const previous=S.undo, r={...recovery,id:crypto.randomUUID(),state:'prepared'};
  try{localStorage.setItem(deviceKey('undo'),JSON.stringify(r));}
  catch(e){storeError(Error('Could not keep an Undo copy. '+String(e.message||e)));return false;}
  if(!await write(operation)){
    try{if(previous)localStorage.setItem(deviceKey('undo'),JSON.stringify(previous));else localStorage.removeItem(deviceKey('undo'));}catch{}
    S.undo=previous;render();return false;
  }
  r.state='removed';S.undo=r;
  // If this small final write fails, the prepared copy remains recoverable after
  // the durable removal is replayed on reopening.
  try{localStorage.setItem(deviceKey('undo'),JSON.stringify(r));}catch{}
  render();return true;
}
async function undoRemoval(){
  const r=S.undo;if(!r||S.undoBusy)return;
  if(!recoveryMissing(r)){
    S.banner={kind:'plain',title:'Record already present',text:'A saved entry already has this identity. Undo has kept that entry as it is.'};
    render();return;
  }
  S.undoBusy=true;renderFeedback();
  const op=r.kind==='regime'?{regime:{date:r.date,count:r.count||1,indices:r.indices}}:{recover:r};
  if(await write(op)){
    try{localStorage.removeItem(deviceKey('undo'));}catch{}
    S.undo=null;
    S.banner={kind:'good',title:'Restored on this device',text:'The removed item has been restored. Other saved entries are kept.'};
  }
  S.undoBusy=false;render();
}

function subscribe(){
  unsubs.forEach(fn=>fn()); unsubs=[];
  const uid=S.user.uid, seen=new Set();
  S.days={}; savedDays=null; S.changes=[]; S.settings={...DEFAULTS}; S.ready=false;
  S.undo=null;S.fibreSnooze=null;S.fibreSnoozedUntil=null;S.localSaveError=null;S.banner=null;
  const received=(name,snap)=>{
    if(S.user?.uid!==uid) return;
    seen.add(name); S.ready=seen.size===3;
    let queued;
    try{queued=queuedWrites();replayQueuedWrites(queued);}catch(e){storeError(e);return;}
    loadDeviceState();
    if(!queued.length&&S.banner?.source==='sync')S.banner=null;
    setStatus(queued.length?'Saved locally; syncing':snap.metadata.fromCache?'Cached; checking sync':'Synced');
    applyTheme(); render();
  };
  const failed=e=>{setStatus('Not connected','bad');S.banner={kind:'bad',title:'Connection failed',text:String(e.message||e)};render();};
  unsubs.push(onSnapshot(collection(db,'days'),{includeMetadataChanges:true},snap=>{
    if(S.user?.uid!==uid) return;
    // Firestore can notify only a sync-status change. Keeping the same data
    // reference in that case also keeps the derived lists and statistics cached.
    if(!seen.has('days')||snap.docChanges().length) savedDays=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]));
    received('days',snap);
  },failed));
  unsubs.push(onSnapshot(collection(db,'changes'),{includeMetadataChanges:true},snap=>{
    if(S.user?.uid!==uid) return;
    if(!seen.has('changes')||snap.docChanges().length) S.changes=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>toDay(a.date)-toDay(b.date));
    received('changes',snap);
  },failed));
  unsubs.push(onSnapshot(doc(db,'settings','main'),{includeMetadataChanges:true},snap=>{
    if(S.user?.uid!==uid) return;
    S.savedSettings=snap.exists()?snap.data():{};
    S.settings=mealSettings(S.savedSettings); received('settings',snap);
  },failed));
  void flushWrites();
}

  }).join('')}</dl>`;

function mealAmountEditor(iso,m){

function weightHint(iso){
  const d=S.days[iso]||{};

function bcsScale(iso,val){

function syncBcsGuidance(){
  const help=$('[data-bcs-guidance]'), announcement=$('#bcs-announcement'), iso=help?.dataset.date;
  if(!help || !(S.tab==='day'&&S.cursor===iso || S.tab==='today')){
    if(announcement.textContent) announcement.textContent='';
    return;
  }
  const val=S.days[iso]?.bcs, text=bcsDescription(val);
  if(help.textContent!==text) help.textContent=text;
  for(const button of $$('[data-act="bcs"]',help.parentElement)){
    const on=Number(button.dataset.v)===val;
    button.classList.toggle('on',on); button.setAttribute('aria-pressed',String(on));
  }

  if(announcement.textContent!==text) announcement.textContent=text;
}

function refreshStoolLog(iso){

function mealPlanDetails(iso){
  const s=S.settings, meal=plannedMeal(iso), planning=isEditablePlan(iso,meal);
  const b=planning?bowlFor(iso,meal.recipe,s,S.changes,meal):null;
  const oil=s.oilSchedule||[], fibre=s.fibreSchedule||[];
  const next=oil.filter(e=>e.from>iso).sort((a,b)=>a.from.localeCompare(b.from))[0];
  const recent=[...oil,...fibre].map(e=>e.from).filter(d=>d<=iso&&toDay(iso)-toDay(d)<=7).sort().at(-1);
  const last6=mealsList().filter(m=>m.date<iso).slice(-6).reverse().map(m=>RECIPES.find(r=>r.id===m.recipe)?.short||m.recipe);
  const savedAmounts=['darfPlanned','darfFed','oilMl','fibreG'].some(k=>meal[k]!=null);
  const plan=b?`<h3 class="lab">Scheduled amounts</h3>${row('Bella &amp; Duke',b.bdGrams+' g')}
      ${row('DARF Active',`<strong>${b.darfG} g</strong>`)}
      ${row('Salmon oil',b.oilMl?b.oilMl+' ml':'none tonight')}${row('Pro-Fibre',b.fibreG+' g')}
      ${meal.egg?row('Egg',`1 · ${b.eggKcal} kcal`):''}${meal.broth?row('Bone broth',`50 ml · ${b.brothKcal} kcal`):''}
      <p class="sub">${b.darfBase} g base ${b.adjustment>=0?'+':'−'} ${Math.abs(b.adjustment)} g adjustment · ${b.totalKcal} kcal${b.floored?' · at the ration floor':''}</p>
      ${b.overTarget?'<p class="note warn">Other ingredients exceed the calorie target. DARF is 0 g.</p>':''}`:
      '<p class="muted">Choose a recipe to see tonight’s amounts.</p>';
  const amounts=!planning&&savedAmounts?`<h3 class="lab">Saved meal amounts</h3>
      ${meal.darfFed!=null?row('DARF actually fed',`<strong>${esc(meal.darfFed)} g</strong>`):''}
      ${row('DARF planned',meal.darfPlanned!=null?esc(meal.darfPlanned)+' g':'not recorded')}
      ${row('Salmon oil',meal.oilMl!=null?esc(meal.oilMl)+' ml saved':'not recorded')}${row('Pro-Fibre',meal.fibreG!=null?esc(meal.fibreG)+' g saved':'not recorded')}
      ${meal.totalKcal!=null?`<p class="sub">${esc(meal.totalKcal)} kcal saved</p>`:''}`:planning?plan:'<p class="muted">Meal amounts not recorded.</p>';
  return `<p class="sub">Regime: Pro-Fibre ${fibreGOn(iso,s)} g · oil ${oilMlOn(iso,s)} ml${next?` · changes to ${next.ml} ml in ${toDay(next.from)-toDay(iso)} days`:''}</p>`+
    (last6.length?`<p class="sub">Last six: ${esc(last6.join(', '))}</p>`:'')+
    amounts+
    (recent?`<p class="sub" style="color:var(--watch)">Fibre or oil changed on ${fmtDate(recent)}. An extra now will muddy the read-out.</p>`:'');
}
function refreshMealPlans(){
  // An all-day page can contain an activity draft alongside changing meal controls.
  // Refresh complete editors only when they contain no unfinished input of their own.
  const focus=document.activeElement?.id;
  const expanded=$$('#main details[id]').map(el=>[el.id,el.open]);
  for(const editor of $$('[data-meal-editor]')){
    if(editor.querySelector('[data-dirty]'))continue;
    const iso=editor.dataset.mealEditor,live=editor.dataset.mealLive==='true',previous=editor.dataset.mealPrevious==='true';
    editor.outerHTML=mealEditor(iso,live,live?`<div data-meal-plan="${iso}">${mealPlanDetails(iso)}</div>`:'',previous,
      previous?attributionFor(shiftDate(iso,1),mealsList()).primary:null);
  }
  for(const [id,open]of expanded){const el=document.getElementById(id);if(el)el.open=open;}
  // Inside an editor with a draft, these fragments contain no editable inputs.
  for(const el of $$('[data-meal-plan]')){
    const iso=el.dataset.mealPlan, html=mealPlanDetails(iso);
    if(el.innerHTML!==html) el.innerHTML=html;
    const m=plannedMeal(iso);
    for(const [k,label] of Object.entries(MEAL_FLAGS)){
      const id='meal-'+k+'-'+iso, control=document.getElementById(id);
      if(control) control.outerHTML=switchRow(id,label,m[k],mealFlagDetail(m,k,isEditablePlan(iso,m)),`data-act="extra" data-k="${k}" data-date="${iso}"`);
    }
  }
  for(const el of $$('[data-live-feeding]')){
    const iso=el.dataset.liveFeeding,m=plannedMeal(iso),disabled=!isFedMeal(m);
    el.innerHTML=liveFeedingControls(iso,m);
    for(const button of $$('[data-act="bowl"]',el.closest('[data-meal-editor]')))button.disabled=disabled;
    document.querySelector(`[data-bowl-help="${iso}"]`)?.classList.toggle('hide',!disabled);
  }
  if(focus&&document.activeElement?.id!==focus) refocus(focus);
}

/* STATUS */
function meanRows(today,weight){
  return [7,14,28].map(n=>{
    const m=weight?windowMean(weightsList(),toDay(today),n):bcsMean(S.days,today,n);
    return m.mean===null?'':row(n+'-day mean',m.mean.toFixed(weight?2:1)+(weight?' kg':'')+' · '+m.n+' readings');
  }).join('');
}
function viewStatus(){
  const today=localToday(), s=S.settings;
  const {vet,fib}=insights(), adv=weeklyAdvice();
  const off=offsetNow();
  const W=weightsList();
  const latest=W.length?W[W.length-1]:null;

  const vetHtml = vet.length
    ? vet.map(v=>`<div class="note ${v.sev==='r'?'bad':'warn'}"><b>${esc(v.title)}</b>${v.dates.length?esc(v.dates.map(fmtShort).join(', ')):''}${v.text?'<br>'+esc(v.text):''}</div>`).join('')
    : '<p class="muted">None.</p>';

  let advHtml;
  if (adv.applied){
    advHtml = `<div class="note warn"><b>${adv.adjustmentG>0?'Increase':'Reduce'} DARF by ${Math.abs(adv.adjustmentG)} g on every recipe</b>${esc(adv.reason)}</div>
      <div class="btnrow"><button class="btn sm" data-act="applyadv">Apply</button>
      <button class="btn ghost sm" data-act="refuseadv">Refuse</button></div>`;
  } else if (adv.held){
    advHtml = `<div class="note hold"><b>Held</b>${esc(adv.reason)}</div>`;
  } else {
    advHtml = `<div class="note plain"><b>No change</b>${esc(adv.reason||'Not enough data yet.')}</div>`;
  }
  const windows = (adv.currentMean!=null&&adv.previousMean!=null) ? `
    ${row(`${fmtShort(adv.currentWindow[0])} to ${fmtShort(adv.currentWindow[1])}`,`${adv.currentMean.toFixed(2)} kg`)}
    ${row(`${fmtShort(adv.previousWindow[0])} to ${fmtShort(adv.previousWindow[1])}`,`${adv.previousMean.toFixed(2)} kg`)}
    <p class="sub">${adv.percentChange==null?'Trend unavailable':(adv.percentChange>=0?'+':'')+adv.percentChange.toFixed(2)+'%'} &middot; ${adv.previousN} and ${adv.currentN} weigh-ins${adv.fullCorrectionG!=null?` &middot; full correction ${Math.abs(adv.fullCorrectionG).toFixed(0)} g, damped to ${Math.abs(Math.round(adv.rawStepG))} g`:''}</p>` : '';

  const chips = fib.chips.length ? `<div class="streak">${
    Array.from({length:s.fibreStreakDays},(_,i)=>{
      const c=fib.chips[i];
      if (!c) return '<span></span>';
      return `<span class="${c.verdict}" title="${fmtShort(c.date)}">${c.verdict==='clean'?'&check;':c.verdict==='broken'?'&times;':'&ndash;'}</span>`;
    }).join('')}</div>` : '';

  let fibHtml = row('Current dose',fib.dose+' g')+chips;
  if (fib.dose < s.fibreRestG) fibHtml += `<p class="sub">${fib.streak} of ${s.fibreStreakDays} clean days since ${fmtShort(fib.since)}. A day with no stool pauses rather than resets.</p>`;
  if (fibreAdviceVisible(fib)) fibHtml += `<div class="note warn" style="margin-top:9px"><b>${fib.advice.kind==='up'?'Step up':'Step back'}</b>${esc(fib.advice.text)}</div>
    <div class="btnrow"><button class="btn sm" data-act="applyfibre" data-g="${fib.advice.toG}">Apply</button>
    <button class="btn ghost sm" data-act="dismissfibre">Not now</button></div>`;
  else if(fib.advice)fibHtml+=`<p class="sub">Advice postponed until tomorrow. The current dose is unchanged.</p>`;
  if (fib.review) fibHtml += `<div class="note bad" style="margin-top:9px"><b>Review with the vet</b>${esc(fib.note)}</div>`;
  else if (fib.note && !fib.advice) fibHtml += `<p class="sub">${esc(fib.note)}</p>`;

  const pct=Math.min(Math.abs(off)/s.maxCumulativeG,1)*50;
  const gauge=`<div class="gauge"><div class="mid"></div><div class="fill" style="${off>=0?`left:50%;width:${pct}%`:`right:50%;width:${pct}%`}"></div></div>`;

  const ctx=weekContext(today);
  const tonight=RECIPES.map(r=>{const b=bowlFor(today,r.id,s,S.changes,mealDefaults(S.days[today]?.meal));
    return row(r.short,b.darfG+' g');}).join('');

  return bannerHtml()+'<h2 class="screen">Status</h2>'+panel('Vet items',vetHtml)+
    panel("This week's ration",advHtml+windows)+panel('Pro-Fibre',fibHtml)+`<div class="card">
    <div class="sec"><p class="lab">Weight</p>
      ${latest?`${row(`Latest, ${fmtShort(latest.date)}`,`${latest.kg.toFixed(2)} kg`)}`:'<p class="muted">No weights yet.</p>'}
      ${meanRows(today,true)}
    </div>
    <div class="sec"><p class="lab">Condition</p>
      ${meanRows(today,false)}
      <p class="sub">Excellent range 4.5–5.5; ideal centre 5.0. Body condition is subjective. Scores in this range do not alone call for a ration change. Weight-trend reductions retain the configured hold at or below ${s.bcsHoldAtOrBelow}.</p>
    </div>
    <div class="sec"><p class="lab">Corrective offset</p>${gauge}
      <p class="sub">${off>=0?'+':'&minus;'}${Math.abs(off)} g of the plus or minus ${s.maxCumulativeG} g cap</p>
      ${S.changes.length?S.changes.slice(-4).reverse().map(c=>`${row(`${fmtShort(c.date)} &middot; ${esc(c.source||'manual')}`,`${c.deltaG>=0?'+':'&minus;'}${Math.abs(c.deltaG)} g`)}`).join(''):'<p class="muted">No changes recorded.</p>'}
      <p class="sub">Oil changes adjust the base ration, not this offset.</p>
    </div>
  </div>`+panel('This week against last',ctx)+panel('Tonight by recipe',tonight);
}

function weekContext(today){
  const end=toDay(today);
  const agg=(from,to)=>{
    let wm=0,wk=0,am=0,n=0,kn=0,an=0,cl=0,lf=0,rf=0,tr=0,tn=0,eg=0,br=0,fi=0,oi=0;
    for (let d=from;d<=to;d++){
      const day=S.days[toIso(d)]; if (!day) continue;
      if (Number.isFinite(day.walkMin)){wm+=day.walkMin;n++;}
      if (Number.isFinite(day.walkKm)){wk+=day.walkKm;kn++;}
      if (Number.isFinite(day.activeMin)){am+=day.activeMin;an++;}
      if (Number.isFinite(day.treats)){tr+=day.treats;tn++;}
      const m=day.meal||{};
      if (m.bowl==='cleared')cl++; else if (m.bowl==='left')lf++; else if (m.bowl==='refused')rf++;
      if (m.egg)eg++; if (m.broth)br++; if (m.fibreGiven===true)fi++; if (m.oilGiven===true)oi++;
    }
    return {wm:n?wm/n:null,wk:kn?wk/kn:null,am:an?am/an:null,n,cl,lf,rf,tr:tn?tr/tn:null,eg,br,fi,oi};
  };
  const a=agg(end-6,end), b=agg(end-13,end-7);
  const d=(x,y)=> (x!=null&&y!=null&&y>0)?` &middot; ${x>=y?'+':''}${((x-y)/y*100).toFixed(0)}%`:'';
  return `
    ${row(`Walk minutes`,`${a.wm!=null?a.wm.toFixed(0):'--'}${d(a.wm,b.wm)}`)}
    ${row(`Kilometres`,`${a.wk!=null?a.wk.toFixed(1):'--'}${d(a.wk,b.wk)}`)}
    ${row(`Active minutes`,`${a.am!=null?a.am.toFixed(0):'--'}${d(a.am,b.am)}`)}
    ${row(`Bowl`,`${a.cl} cleared, ${a.lf} left, ${a.rf} refused`)}
    ${row(`Treats a day`,`${a.tr!=null?a.tr.toFixed(1):'--'}`)}
    ${row(`Egg / broth nights`,`${a.eg} / ${a.br}`)}
    ${row(`Fibre / oil confirmed`,`${a.fi} / ${a.oi}`)}
    <p class="sub">Context for reading a drift. None of it is ever an input to the advice.</p>`;
}

/* HISTORY */
function viewHistory(){
  const today=localToday(), s=S.settings;
  const range=S.range||28;
  const from=range===9999?toDay(earliestHistoryDate()):Math.max(toDay(s.startDate), toDay(today)-range+1);
  const isos=[]; for (let d=from;d<=toDay(today);d++) isos.push(toIso(d));
  const meals=mealsList(), displayIsos=isos.slice(), tomorrow=shiftDate(today,1);
  // Today's confirmed meal belongs to tomorrow's tracking group. This is only
  // a display row; it must not create or open a future daily record.
  if(attributionFor(tomorrow,meals).primary) displayIsos.push(tomorrow);
  // Imported date mistakes must remain inspectable without being moved or
  // silently corrected. Only All includes saved dates beyond today.
  if(range===9999){
    displayIsos.push(...Object.keys(S.days).filter(validDate),...meals.filter(isFedMeal).map(m=>shiftDate(m.date,1)));
  }

  const chips=[14,28,56,9999].map(r=>`<button id="range-${r}" ${choice(r===range,'chip')} data-act="range" data-r="${r}">${r===9999?'All':r+' days'}</button>`).join('');
  const W=weightsList().filter(w=>toDay(w.date)>=from&&w.date<=today);
  const B=isos.map(i=>({date:i,v:(S.days[i]||{}).bcs})).filter(x=>Number.isFinite(x.v));

  const rows=[...new Set(displayIsos)].sort().reverse().map(i=>{
    const canOpen=i<=today||Object.hasOwn(S.days,i), d=S.days[i]||{}, st=(d.stools||[]);
    const scores=st.map(x=>x.bristol).filter(Number.isFinite),lo=scores.length?Math.min(...scores):null,hi=scores.length?Math.max(...scores):null;
    const m=attributionFor(i,meals).primary, r=m?RECIPES.find(x=>x.id===m.recipe):null;
    const blood=st.some(x=>x.blood),mucus=st.some(x=>x.mucus),band=blood||scores.some(n=>n===1||n===7)?'r':mucus||scores.some(n=>n<3||n>4)?'a':scores.length?'g':'';
    const observed=lo===null?'—':lo===hi?String(lo):`${lo}–${hi}`;
    const events=(d.events||[]).map(id=>EVENTS.find(e=>e.id===id)?.label||id).join(', ');
    return `<tr data-date="${i}">
      <td class="date-column">${canOpen?`<button class="link" data-act="openday" data-date="${i}" aria-label="Open log for ${fmtDate(i)}">${fmtShort(i)}</button>`:fmtShort(i)}</td>
      <td class="meal-column" ${m?`data-meal-date="${m.date}"`:''}>${m?`<button class="meal-title link" data-act="openday" data-date="${m.date}" data-target="#meal-section-${m.date}" aria-label="Edit ${esc(r?.short||m.recipe)} meal fed on ${fmtDate(m.date)}">${esc(r?.short||m.recipe)}</button><p class="meal-meta">Fed ${fmtShort(m.date)} · ${esc(m.fedAt)}</p><p class="meal-detail">${m.darfFed!=null?`${esc(m.darfFed)} g DARF`:m.darfPlanned!=null?`${esc(m.darfPlanned)} g DARF planned`:'Amount not recorded'}</p><details class="meal-disclosure" id="meal-detail-${i}"><summary>Meal details</summary>${mealSummary(m)}</details>`:'<span class="meal-meta">Not recorded as fed</span>'}</td>
      <td class="${band}" data-stool-summary><span class="table-reading">${observed}${st.length>1?' ('+st.length+')':''}</span>${blood||mucus?`<span class="table-flags">${[blood?'Blood':'',mucus?'Mucus':''].filter(Boolean).join(' · ')}</span>`:''}</td>
      <td><span class="table-reading">${d.weightMissed===true?'Missed':recordedWeight(d)!==null?d.weight.toFixed(2):'—'}</span></td>
      <td><span class="table-reading">${Number.isFinite(d.bcs)?d.bcs:'—'}</span></td>
      <td><span class="table-reading">${m?.darfFed??m?.darfPlanned??'—'}</span></td>
      <td><span class="table-reading">${esc(m?.bowl==='left'?'Left some':m?.bowl?m.bowl[0].toUpperCase()+m.bowl.slice(1):'—')}</span></td>
      <td><span class="table-flags">${esc(events||'None recorded')}</span></td></tr>`;
  }).join('');

  return bannerHtml()+`
  <h2 class="screen">Data</h2>
  <div class="chips data-range" role="group" aria-label="Days to show">${chips}</div>
  <div class="card"><div class="sec"><p class="lab">Weight, kg</p>${lineChart(W.map(w=>({x:toDay(w.date),y:w.kg})),'kg')}</div>
    <div class="sec"><p class="lab">Condition</p>${lineChart(B.map(b=>({x:toDay(b.date),y:b.v})),'bcs',[3,7],s.bcsTarget)}</div>
    <div class="sec"><p class="lab">Stools</p>${stoolChart(isos)}</div></div>
  <div class="card"><div class="sec"><p class="lab">By recipe</p>${foodTable(isos,false)}</div>
    <div class="sec"><p class="lab">By extra</p>${foodTable(isos,true)}</div></div>
  <div class="card"><div class="table-intro"><h3 class="lab" id="daily-records-title">Daily records</h3><p class="sub">Each date groups that day’s observations with the previous evening’s meal. Bristol shows the recorded range; brackets show the number of stools.</p><p class="table-guide" id="daily-records-help">Scroll sideways for stools, weight and bowl results. The date stays in view.</p></div><div class="tw" tabindex="0" role="region" aria-labelledby="daily-records-title" aria-describedby="daily-records-help"><table class="log-table"><thead><tr><th scope="col" class="date-column">Date</th><th scope="col" class="meal-heading">Last night’s meal</th><th scope="col">Bristol</th><th scope="col">Weight, kg</th><th scope="col">Condition</th><th scope="col">DARF, g</th><th scope="col">Bowl</th><th scope="col">Events</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}

function chartFrame(yLabels, drawing, marks, dates, description){
  return `<div class="chart-frame" role="img" aria-label="${esc(description)}"><div class="chart-axis" aria-hidden="true">${yLabels.map(({label,position})=>`<span style="top:${position}%">${esc(label)}</span>`).join('')}</div><div class="chart-plot" aria-hidden="true"><svg class="chart" viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false">${drawing}</svg>${marks}</div><div class="chart-dates" aria-hidden="true"><span>${fmtShort(dates[0])}</span><span>${fmtShort(dates[1])}</span></div></div>`;
}
function chartValues(kind,headers,rows){
  const label=`View ${kind} values`,id=`chart-values-${kind.replace(/\s/g,'-')}`;
  return `<details class="chart-values" id="${id}"><summary>${label}</summary><div class="tw" tabindex="0" role="region" aria-label="${esc(kind)} values"><table><caption class="hide">${esc(kind)} by date</caption><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(value=>`<td>${esc(value)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
}
function lineChart(pts,kind,forceRange,targetLine){
  if(!pts.length)return '<p class="muted">No readings in this range.</p>';
  const name=kind==='kg'?'weight':'condition',unit=kind==='kg'?' kg':'',format=v=>v.toFixed(kind==='kg'?2:1);
  const values=chartValues(name,['Date',kind==='kg'?'Weight, kg':'Condition'],pts.map(p=>[fmtDate(toIso(p.x)),format(p.y)]));
  if(pts.length===1)return `<p class="chart-summary">${fmtDate(toIso(pts[0].x))}: ${format(pts[0].y)}${unit}. Add another reading to see a trend.</p>${values}`;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x0=Math.min(...xs),x1=Math.max(...xs),minimum=Math.min(...ys),maximum=Math.max(...ys);
  let lo=forceRange?Math.min(forceRange[0],minimum):minimum,hi=forceRange?Math.max(forceRange[1],maximum):maximum;
  if(!forceRange){const pad=Math.max((hi-lo)*.18,kind==='kg'?.15:.4);lo-=pad;hi+=pad;}
  const px=x=>((x-x0)/Math.max(x1-x0,1))*100,py=y=>(1-(y-lo)/Math.max(hi-lo,.0001))*100;
  const ticks=[hi,(lo+hi)/2,lo],yLabels=ticks.map(y=>({label:format(y),position:py(y)}));
  const grid=ticks.map(y=>`<line x1="0" x2="100" y1="${py(y)}" y2="${py(y)}" stroke="var(--rule)" stroke-width="1"/>`).join('');
  const target=targetLine==null?'':`<line x1="0" x2="100" y1="${py(targetLine)}" y2="${py(targetLine)}" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="4 3"/>`;
  const changes=S.changes.filter(c=>toDay(c.date)>=x0&&toDay(c.date)<=x1).map(c=>`<line x1="${px(toDay(c.date))}" x2="${px(toDay(c.date))}" y1="0" y2="100" stroke="var(--watch)" stroke-width="1.5" stroke-dasharray="3 3"/>`).join('');
  const path=pts.map((p,i)=>`${i?'L':'M'}${px(p.x).toFixed(3)},${py(p.y).toFixed(3)}`).join('');
  const points=pts.map(p=>`<span class="chart-point" style="left:${px(p.x)}%;top:${py(p.y)}%"></span>`).join('');
  const summary=`${pts.length} readings. ${format(pts[0].y)}${unit} on ${fmtShort(toIso(pts[0].x))}, ${format(pts.at(-1).y)}${unit} on ${fmtShort(toIso(pts.at(-1).x))}. Recorded range ${format(minimum)}–${format(maximum)}${unit}.`;
  return `<p class="chart-summary">${esc(summary)}</p>`+chartFrame(yLabels,grid+target+changes+`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`,points,[toIso(x0),toIso(x1)],`${kind==='kg'?'Weight':'Body condition'} over time. ${summary}`)+
    `<p class="legend">${targetLine!=null?'Horizontal dashes mark the ideal centre. Excellent range: 4.5–5.5. ':''}Vertical dashes mark a recorded ration change.</p>`+values;
}
function stoolChart(isos){
  const all=[];
  isos.forEach(iso=>(S.days[iso]?.stools||[]).forEach(s=>all.push({iso,time:s.time||'Not recorded',minute:validTime(s.time)?minsOf(s.time):null,b:s.bristol,mucus:s.mucus,blood:s.blood})));
  if(!all.length)return '<p class="muted">No stools logged in this range.</p>';
  const dated=all.filter(s=>s.minute!==null),x0=toDay(isos[0]),x1=toDay(isos.at(-1));
  const px=iso=>x0===x1?50:(toDay(iso)-x0)/(x1-x0)*100,py=minute=>minute/1440*100;
  const yLabels=[0,6,12,18,24].map(h=>({label:String(h).padStart(2,'0')+':00',position:h/24*100}));
  const grid=yLabels.map(t=>`<line x1="0" x2="100" y1="${t.position}" y2="${t.position}" stroke="var(--rule)" stroke-width="1"/>`).join('');
  const marks=dated.map(s=>`<span class="chart-mark${s.blood?' blood':''}${s.mucus?' mucus':''}" style="left:${px(s.iso)}%;top:${py(s.minute)}%"><span class="chart-point stool-point ${bandOfBristol(s.b)}"></span></span>`).join('');
  const summary=`${all.length} stools across ${new Set(all.map(s=>s.iso)).size} days. ${all.filter(s=>s.b<3).length} hard (types 1–2), ${all.filter(s=>s.b===3||s.b===4).length} types 3–4, ${all.filter(s=>s.b>=5).length} loose (types 5–7). ${all.filter(s=>s.mucus).length} with mucus; ${all.filter(s=>s.blood).length} with blood.`;
  return `<p class="chart-summary">${esc(summary)}${dated.length<all.length?' Entries without a time appear in the values list.':''}</p>`+
    (dated.length?chartFrame(yLabels,grid,marks,[isos[0],isos.at(-1)],`Stools by date and time. ${summary}`):'')+
    `<p class="legend">● Types 3–4; ◆ types 2, 5 and 6; ■ types 1 and 7. Dashed ring: mucus. Solid ring: blood.</p>`+
    chartValues('stool',['Date','Time','Bristol','Flags'],all.map(s=>[fmtDate(s.iso),s.time,s.b,[s.mucus?'Mucus':'',s.blood?'Blood':''].filter(Boolean).join(', ')||'None']));
}
function foodStats(isos){
  return cached('food-'+isos[0]+'-'+isos.at(-1),()=>{
    const stats=Object.create(null);
    const get=k=>stats[k]??={n:0,sum:0,cnt:0,loose:0,hard:0,mucus:0,blood:0};
    const keys=m=>[m.recipe,...['egg','broth','fibreGiven','oilGiven'].filter(k=>m[k]===true),...(m.egg===false&&m.broth===false?['none']:[])];
    const meals=mealsList();
    for(const iso of isos){
      const m=attributionFor(iso,meals).primary;
      if(!m) continue;
      const mealKeys=keys(m);
      // Count each confirmed meal once in its tracking date, including nights
      // with no stools. Every stool on that date uses this same meal.
      for(const k of mealKeys) get(k).n++;
      for(const stool of S.days[iso]?.stools||[]) for(const k of mealKeys){
        const x=get(k);x.sum+=stool.bristol;x.cnt++;
        if(stool.bristol>=5)x.loose++;if(stool.bristol<3)x.hard++;if(stool.mucus)x.mucus++;if(stool.blood)x.blood++;
      }
    }
    return {get};
  });
}
function foodTable(isos,extras){
  const {get}=foodStats(isos), labels=extras?[...Object.entries(MEAL_FLAGS),['none','Neither egg nor broth']]:RECIPES.map(r=>[r.id,r.short]);
  const rows=labels.map(([k,label])=>{
    const x=get(k), mean=x.cnt?x.sum/x.cnt:null;
    const findings=[x.hard?'Hard stools':'',x.loose>1?'Repeated loose stools':x.loose?'Loose stool':'',x.mucus?'Mucus':'',x.blood?'Blood':''].filter(Boolean);
    const read=!x.n?'Not yet fed':!x.cnt?'No stool observations':findings.length?findings.join(' · '):'Types 3–4 only';
    return `<tr><td>${label}</td><td>${x.n}</td><td>${mean?.toFixed(1)??'—'}</td><td>${x.loose}</td>${extras?'':`<td>${x.mucus}</td><td style="white-space:normal;min-width:12rem">${read}</td>`}</tr>`;
  }).join('');
  return `<div class="tw" tabindex="0" role="region" aria-label="Stool observations by ${extras?'extra':'recipe'}"><table><thead><tr><th scope="col">${extras?'Extra':'Recipe'}</th><th scope="col">Nights</th><th scope="col">Mean stool</th><th scope="col">Types 5–7</th>${extras?'':'<th scope="col">Mucus</th><th scope="col">Observations</th>'}</tr></thead><tbody>${rows}</tbody></table></div><p class="legend">${extras?'Unknown historical flags are excluded. Neither requires a confirmed No for both egg and broth.':'Counts describe recorded observations; they do not establish that a recipe caused them.'}</p>`;
}

/* EXPORT */
function download(name, text, type){
  const blob=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function monthIsos(ym){
  return Object.keys(S.days).filter(d=>d.startsWith(ym)).sort();
}
function csvCell(v){
  let s=String(v??'');
  if(typeof v==='string'&&/^[\s]*[=+\-@\t\r]/.test(s)) s="'"+s;
  return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
const yesNo=v=>v===true?'Y':v===false?'N':'';
function exportMonthCsv(){
  const ym=localToday().slice(0,7), isos=monthIsos(ym);
  const head=['date','worstBristol','stoolCount','mucus','blood','weightKg','bcs','recipe','darfPlanned','darfFed','oilMl','fibreG','egg','broth','bowl','fedAt','walkMin','walkKm','activeMin','treats','events','notes','weightMissed','fibreGiven','oilGiven'];
  const rows=isos.map(i=>{
    const d=S.days[i], st=d.stools||[], m=d.meal?plannedMeal(i,d.meal):{};
    return [i, st.length?Math.max(...st.map(x=>x.bristol)):'', st.length, st.some(x=>x.mucus)?'Y':'', st.some(x=>x.blood)?'Y':'',
      recordedWeight(d)??'', d.bcs??'', m.recipe??'', m.darfPlanned??'', m.darfFed??'', m.oilMl??'', m.fibreG??'',
      yesNo(m.egg), yesNo(m.broth), m.bowl??'', m.fedAt??'', d.walkMin??'', d.walkKm??'', d.activeMin??'', d.treats??'',
      (d.events||[]).join(' '), d.notes??'',yesNo(d.weightMissed),yesNo(m.fibreGiven),yesNo(m.oilGiven)].map(csvCell).join(',');
  });
  download(`Murphy_Log_${ym}.csv`, [head.join(','),...rows].join('\n'), 'text/csv;charset=utf-8');
  const sh=['date','time','bristol','word','mucus','blood','attributedTo'];
  const srows=[];
  const meals=mealsList();
  isos.forEach(i=>((S.days[i]||{}).stools||[]).forEach(s=>{
    const at=attributionFor(i,meals);
    srows.push([i,s.time,s.bristol,(BRISTOL[s.bristol]||{}).word,s.mucus?'Y':'',s.blood?'Y':'',at.primary?at.primary.date+' '+at.primary.recipe:''].map(csvCell).join(','));
  }));
  setTimeout(()=>download(`Murphy_Log_${ym}_stools.csv`, [sh.join(','),...srows].join('\n'), 'text/csv;charset=utf-8'), 400);
}
function exportMonthMd(){
  const ym=localToday().slice(0,7), isos=monthIsos(ym), s=S.settings;
  const L=[];
  L.push(`# Murphy's Log: ${MON[Number(ym.slice(5,7))-1]} ${ym.slice(0,4)}`,'');
  L.push(`**Exported:** ${fmtDate(localToday())}  `);
  L.push(`**Days recorded:** ${isos.length}  `);
  L.push(`**Ration target:** ${s.targetKcal} kcal on ${s.bdGrams} g of Bella & Duke plus DARF at ${s.kcalPerGDarf} kcal/g`,'');
  const W=weightsList().filter(w=>w.date.startsWith(ym));
  if (W.length){
    const mean=W.reduce((a,b)=>a+b.kg,0)/W.length;

function validateBackup(data){
  const check=(ok,where)=>{if(!ok) throw Error('Invalid backup: '+where);};
  const date=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&Number.isFinite(toDay(v))&&toIso(toDay(v))===v;
  const id=v=>typeof v==='string'&&v.length>0&&v.length<1500&&!/[\/]/.test(v)&&v!=='.'&&v!=='..';
  const visit=(v,depth=0)=>{
    check(depth<32,'nesting too deep');
    if(v&&typeof v==='object') for(const [k,x] of Object.entries(v)){
      check(!['__proto__','constructor','prototype'].includes(k),'unsafe field name'); visit(x,depth+1);
    }
  };
  const fields=(v,names,test,where)=>{
    for(const k of names.split(' ')) if(v[k]!=null) check(test(v[k]),where+'.'+k);
  };
  const num=v=>Number.isFinite(v)&&v>=0, bool=v=>typeof v==='boolean', str=v=>typeof v==='string';
  visit(data); check(object(data)&&object(data.days),'days');
  for(const [iso,d] of Object.entries(data.days)){
    check(date(iso)&&object(d),'day '+iso);
    fields(d,'date',v=>v===iso,iso); fields(d,'updatedAt',v=>str(v)&&Number.isFinite(Date.parse(v)),iso);
    fields(d,'notes',str,iso); fields(d,'weightMissed',bool,iso);
    // Older databases sometimes stored zero for a missing measurement. Preserve
    // their backup verbatim; recordedWeight excludes zero everywhere it is used.
    fields(d,'weight',num,iso);
    fields(d,'bcs',v=>Number.isFinite(v)&&v>=1&&v<=9,iso);
    fields(d,'walkMin walkKm activeMin treats',num,iso);
    if(d.events!=null) check(Array.isArray(d.events)&&d.events.every(str),iso+'.events');
    if(d.stools!=null){
      check(Array.isArray(d.stools),iso+'.stools'); const ids=new Set();
      for(const s of d.stools){
        check(object(s)&&Number.isInteger(s.bristol)&&s.bristol>=1&&s.bristol<=7,iso+'.stool');
        fields(s,'id',id,iso); fields(s,'time',v=>str(v)&&/^([01]\d|2[0-3]):[0-5]\d$/.test(v),iso);
        fields(s,'mucus blood',bool,iso); fields(s,'mealOverride',date,iso);
        if(s.id!=null){check(!ids.has(s.id),iso+'.duplicate stool id');ids.add(s.id);}
      }
    }
    if(d.meal!=null){
      check(object(d.meal),iso+'.meal');
      fields(d.meal,'recipe bowl fedAt',str,iso+'.meal');
      fields(d.meal,'darfPlanned darfFed oilMl fibreG',num,iso+'.meal');
      fields(d.meal,'egg broth fibreGiven oilGiven',bool,iso+'.meal');
    }
  }
  if(data.changes!=null){
    check(Array.isArray(data.changes),'changes'); const ids=new Set();
    for(const c of data.changes){
      check(object(c)&&id(c.id)&&date(c.date)&&Number.isFinite(c.deltaG)&&!ids.has(c.id),'change');ids.add(c.id);
      fields(c,'reason source',str,'change'); fields(c,'refused',bool,'change');
    }
  }
  if(data.settings!=null){
    check(object(data.settings),'settings');
    for(const [k,v] of Object.entries(DEFAULTS)) if(typeof v==='number') fields(data.settings,k,Number.isFinite,'settings');
    fields(data.settings,'startDate',date,'settings'); fields(data.settings,'theme',str,'settings');
    for(const [key,unit] of [['oilSchedule','ml'],['fibreSchedule','g']]) if(data.settings[key]!=null)
      check(Array.isArray(data.settings[key])&&data.settings[key].every(v=>object(v)&&date(v.from)&&num(v[unit])),key);
    if(data.settings.regimeChanges!=null) check(Array.isArray(data.settings.regimeChanges)&&data.settings.regimeChanges.every(date),'regimeChanges');
  }
  return data;
}
let importing=false;
async function importJson(file){
  if(eraseBlocksChanges())return;
  if(importing) return; importing=true;
  try{
    if(file.size>10*1024*1024) throw Error('Backup exceeds 10 MB; split it into smaller backups.');
    const data=validateBackup(JSON.parse(await file.text())), items=[];
    for(const [iso,day] of Object.entries(data.days)){
      const cur=S.days[iso];
      if(!cur||(day.updatedAt||'')>(cur.updatedAt||'')) items.push({col:'days',id:iso,patch:day,restore:true});
    }
    const n=items.length;
    for(const c of data.changes||[]) if(!S.changes.some(x=>x.id===c.id)) items.push({col:'changes',id:c.id,patch:c,restore:true});
    const settings=Object.fromEntries(Object.entries(data.settings||{}).filter(([k])=>!Object.hasOwn(S.savedSettings||{},k)));
    if(Object.keys(settings).length) items.push({col:'settings',id:'main',patch:settings,restore:true});
    if(items.length&&!await write({items})) return;
    S.banner={kind:'good',title:'Import saved locally',text:`${n} days accepted. Existing newer days, change IDs and settings were kept. Sync will check the server again before merging.`};
    render();
  }catch(e){S.banner={kind:'bad',title:'Import failed',text:String(e.message||e)};render();}
  finally{importing=false;}
}

function fieldError(input,message){
  const form=input.closest('[data-form]');
  input.setCustomValidity(message);input.setAttribute('aria-invalid','true');
  let error=$('[data-field-error]',form);
  if(!error){
    error=document.createElement('p');error.className='field-error';error.dataset.fieldError='';error.id=input.id+'-error';error.setAttribute('role','alert');form.append(error);
  }
  error.textContent=message;error.classList.remove('hide');
  const descriptions=(input.getAttribute('aria-describedby')||'').split(/\s+/).filter(Boolean);
  input.setAttribute('aria-describedby',[...new Set([...descriptions,error.id])].join(' '));
  input.reportValidity();input.focus();
}
function clearFieldError(input){
  input.setCustomValidity('');input.removeAttribute('aria-invalid');
  const form=input.closest('[data-form]'), error=form&&$('[data-field-error]',form);
  if(error){error.textContent='';error.classList.add('hide');}

async function confirmInput(form){
  if (!form.hasAttribute('data-dirty')) return;
  const el=$('input,textarea',form), k=form.dataset.key, iso=form.dataset.date, v=el.value;
  clearFieldError(el);
  const setting=form.dataset.setting, spec=k==='setnum'?settingsSpec[setting]:null;
  const n=v===''?null:Number(v);
  if(spec&&(n===null||!Number.isFinite(n)||n<spec.min||n>spec.max||Math.abs((n-spec.min)/spec.step-Math.round((n-spec.min)/spec.step))>1e-7)){
    fieldError(el,`${spec.label}: enter ${spec.min} to ${spec.max}${spec.step!==1?`, in steps of ${spec.step}`:''}.`);return;
  }
  if(!el.checkValidity()){fieldError(el,el.validationMessage||'Check this value and try again.');return;}
  if(k==='mealamount'&&(!['oilMl','fibreG'].includes(setting)||n!==null&&(!Number.isFinite(n)||n<0))){fieldError(el,'Enter zero or a positive amount, or leave this blank for not recorded.');return;}
  if (k!=='notes' && v!=='' && !Number.isFinite(n)) return;
  if (k==='weight'&&n!==null){
    const m=windowMean(weightsList(),toDay(iso)-1,7);
    if (m.mean&&Math.abs(n-m.mean)/m.mean>.05&&!confirm(`${n} kg differs by over 5% from the recent mean. Keep it?`)) return;
  }
  const patch=k==='notes'?{notes:v}:k==='weight'?{weight:n,weightMissed:false,weightBeforeMissed:null}:k==='darfFed'?{meal:{darfFed:n}}:{[k]:n};
  // A deliberate historical amount correction changes just that saved field.
  // It must never call calculatedMeal or rewrite the stored calorie snapshot.
  const saved=k==='setnum'?saveSettings({[setting]:n}):k==='mealamount'?saveDay(iso,{meal:{[setting]:n}}):k==='darfFed'?saveMeal(iso,patch.meal):saveDay(iso,patch);
  if(await saved)finishInput(form,true);
  else if(S.banner?.source==='local-save')S.localSaveError='form:'+el.id;
}
